  - id: Q-27
    kind: impact
    title: 규약 RG-05 의 이름이 바뀐 것의 영향 범위 (한계에서 멈춘다. 적용일 전날의 관계로만 닿는 대상이 있다)
    change: { step: 25, itemKey: [RG-05] }
    # 변동 대상은 규약 RG-05 하나다. 이 규약이 부과한 요건이 깊이 1, 요건이 걸린 상품이 깊이 2, 그 상품을 보유한 계좌가 깊이 3, 가입자가 깊이 4, 사업장이 깊이 5 다. 담당자는 깊이 6 이라 들지 않고, 그래서 한계에서 멈췄다는 표시가 켜진다. 계좌 A-013 가 상품 P-07 를 보유한 관계는 같은 날(2026-11-01) 먼저 들어온 판에서 끝났다: 적용일에는 유효하지 않고 전날(2026-10-31)에는 유효하다. 그 계좌는 전날의 관계로만 닿고 근거 경로의 날짜가 2026-10-31 이다.
