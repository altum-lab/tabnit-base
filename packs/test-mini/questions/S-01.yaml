# 시험용 Pack 의 검증 질문. 형식은 D4 3절이다.
#
# 상태: 정답 초안. 대표가 확정하기 전이다 (D4 4절: 정답은 대표가 정한다).
# 정답은 D3, D6, D8 의 규칙으로 자료에서 손으로 계산했고, 질문마다 근거를 주석으로 적었다.
# 모든 이름과 값은 지어낸 것이다.
#
# 개체는 유형의 이름과 입력의 키로 가리킨다. 목록의 순서는 엔진이 정한 순서다 (D4 4절).
#
# 영향 범위와 조치는 판을 투입한 직후에 그때의 자료로 한 번 계산해 저장한 것이다 (D2 AD-119).
# 그래서 같은 날의 판이라도 투입하는 차례(steps 의 차례)가 정답에 닿는다.

scenario:
  id: S-01
  title: 운영지침과 의료사업이 세 차례 바뀐다
  steps:
    # 2026-01-01: 처음 자료가 들어온다. 모두 첫 판이다.
    - { step: 1, inputSource: program,           file: data/program-v1.csv,           effectiveDate: 2026-01-01 }
    - { step: 2, inputSource: guideline,         file: data/guideline-v1.csv,         effectiveDate: 2026-01-01 }
    - { step: 3, inputSource: guideline-program, file: data/guideline-program-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 4, inputSource: partner-health,    file: data/partner-health-v1.csv,    effectiveDate: 2026-01-01 }
    - { step: 5, inputSource: partner-private,   file: data/partner-private-v1.csv,   effectiveDate: 2026-01-01 }
    # 전담팀의 이름은 이 자료가 넣는다. 4, 5단계에서는 팀이 코드로 가리켜지기만 해서 이름 없이 만들어진다 (참조로만 만들어진 개체).
    - { step: 6, inputSource: team,              file: data/team-v1.csv,              effectiveDate: 2026-01-01 }
    # 2026-03-01: 운영지침이 바뀐다. G-01 의 점검 주기가 줄고, G-03 이 없어지고, G-04 가 생긴다.
    - { step: 7, inputSource: guideline,         file: data/guideline-v2.csv,         effectiveDate: 2026-03-01 }
    - { step: 8, inputSource: guideline-program, file: data/guideline-program-v2.csv, effectiveDate: 2026-03-01 }
    # 2026-04-01: 의료사업이 바뀐다. P-01 의 목표 인원이 늘고, P-03 이 운영을 시작한다.
    - { step: 9, inputSource: program,           file: data/program-v2.csv,           effectiveDate: 2026-04-01 }
    # 2026-06-01: 운영지침이 한 번 더 바뀐다. G-01 의 제목과 G-04 의 점검 주기.
    - { step: 10, inputSource: guideline,         file: data/guideline-v3.csv,         effectiveDate: 2026-06-01 }

# 시점: 과거 2026-01-01 과 2026-02-28 / 2026-03-01 (판이 바뀌는 경계), 현재 2026-07-01 (마지막 판 뒤).

questions:

  # ── 시점 조회 ──────────────────────────────────────────────

  - id: Q-01
    kind: relations-as-of
    title: 처음 자료가 들어온 날, 검진 지원 사업(P-03)의 관계
    asOf: 2026-01-01
    entity: { type: 의료사업, key: P-03 }
    # 시작일 당일이라 들어온다. 순서는 관계 유형(사업연계 < 사업참여 < 지침적용), 상대 개체, 관계 식별자.
    expect:
      relations:
        - { type: 사업연계, source: { type: 의료사업, key: P-03 }, target: { type: 의료사업, key: P-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 사업참여, source: { type: 민간기관, key: C-01 }, target: { type: 의료사업, key: P-03 }, validFrom: 2026-01-01, validTo: null }
        - { type: 지침적용, source: { type: 운영지침, key: G-03 }, target: { type: 의료사업, key: P-03 }, validFrom: 2026-01-01, validTo: 2026-03-01 }

  - id: Q-02
    kind: relations-as-of
    title: 지침 G-03 이 없어지기 전날의 관계 (종료일 전날)
    asOf: 2026-02-28
    entity: { type: 운영지침, key: G-03 }
    # 8단계에서 (G-03, P-03) 행이 사라져 이 관계는 2026-03-01 에 끝난다. 전날에는 아직 유효하다.
    expect:
      relations:
        - { type: 지침적용, source: { type: 운영지침, key: G-03 }, target: { type: 의료사업, key: P-03 }, validFrom: 2026-01-01, validTo: 2026-03-01 }

  - id: Q-03
    kind: relations-as-of
    title: 지침 G-03 이 없어진 날의 관계 (종료일 당일)
    asOf: 2026-03-01
    entity: { type: 운영지침, key: G-03 }
    # 종료일은 제외한다. 개체 G-03 은 남아 있으므로 오류가 아니라 빈 목록이다.
    expect:
      relations: []

  - id: Q-04
    kind: relations-as-of
    title: 지침이 바뀐 날, 검진 지원 사업(P-03)의 관계
    asOf: 2026-03-01
    entity: { type: 의료사업, key: P-03 }
    # G-03 의 적용은 끝났고 G-04 의 적용이 이날 시작한다.
    expect:
      relations:
        - { type: 사업연계, source: { type: 의료사업, key: P-03 }, target: { type: 의료사업, key: P-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 사업참여, source: { type: 민간기관, key: C-01 }, target: { type: 의료사업, key: P-03 }, validFrom: 2026-01-01, validTo: null }
        - { type: 지침적용, source: { type: 운영지침, key: G-04 }, target: { type: 의료사업, key: P-03 }, validFrom: 2026-03-01, validTo: null }

  - id: Q-05
    kind: relations-as-of
    title: 현재, 방문 건강 관리 사업(P-01)의 관계
    asOf: 2026-07-01
    entity: { type: 의료사업, key: P-01 }
    # P-01 이 출발 쪽인 관계와 도착 쪽인 관계가 모두 나온다.
    # 사업연계 안에서는 상대 개체 P-02 < P-03, 사업참여 안에서는 상대 개체의 유형 민간기관 < 보건기관.
    # 9단계에서 P-01 의 행은 목표 인원만 바뀌었다. 연계 관계는 그대로라 처음 판의 것이 이어진다.
    expect:
      relations:
        - { type: 사업연계, source: { type: 의료사업, key: P-01 }, target: { type: 의료사업, key: P-02 }, validFrom: 2026-01-01, validTo: null }
        - { type: 사업연계, source: { type: 의료사업, key: P-03 }, target: { type: 의료사업, key: P-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 사업참여, source: { type: 민간기관, key: C-02 }, target: { type: 의료사업, key: P-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 사업참여, source: { type: 보건기관, key: H-01 }, target: { type: 의료사업, key: P-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 지침적용, source: { type: 운영지침, key: G-01 }, target: { type: 의료사업, key: P-01 }, validFrom: 2026-01-01, validTo: null }

  # ── 변동 ───────────────────────────────────────────────────

  - id: Q-06
    kind: changes
    title: 운영지침의 둘째 판에서 나온 변동
    step: 7
    # 앞 판(2단계)과 견준다. G-01 은 점검 주기가 30 에서 14 로, G-03 은 없어지고, G-04 는 새로 생겼다. G-02 는 그대로다.
    expect:
      changes:
        - { itemKey: [G-01], kind: changed }
        - { itemKey: [G-03], kind: removed }
        - { itemKey: [G-04], kind: added }

  - id: Q-07
    kind: changes
    title: 지침 적용의 둘째 판에서 나온 변동 (키 열이 둘)
    step: 8
    expect:
      changes:
        - { itemKey: [G-03, P-03], kind: removed }
        - { itemKey: [G-04, P-03], kind: added }

  - id: Q-08
    kind: changes
    title: 운영지침의 셋째 판에서 나온 변동 (한 번 바뀐 것이 또 바뀐다)
    step: 10
    # G-01 은 제목이, G-04 는 점검 주기가 바뀌었다.
    expect:
      changes:
        - { itemKey: [G-01], kind: changed }
        - { itemKey: [G-04], kind: changed }

  # ── 영향 범위 ──────────────────────────────────────────────
  # 최대 깊이는 Pack 의 기본값 3 이다. 날짜는 적용일 전날과 적용일 둘이다 (D8 1절).
  # 방향: 지침적용은 출발→도착, 사업참여는 도착→출발, 사업연계는 양쪽, 연락담당은 퍼지지 않는다.

  - id: Q-09
    kind: impact
    title: 지침 G-01 의 점검 주기가 바뀐 것의 영향 범위
    change: { step: 7, itemKey: [G-01] }
    # 변동 대상은 G-01 하나다. 2026-02-28 과 2026-03-01 에 G-01 에서 닿는 대상이 같고 경로의 길이도 같아
    # 적용일(2026-03-01)의 경로를 남긴다.
    # 깊이 1: G-01 의 적용 사업 P-01, P-02.
    # 깊이 2: P-01 과 연계된 P-03, P-01 에 참여하는 C-02 와 H-01, P-02 에 참여하는 H-02.
    # 깊이 3: P-03 에 참여하는 C-01.
    # 사업에서 지침으로는 거슬러 가지 않는다(G-02). 전담팀은 연락담당이 퍼지지 않아 들지 않는다.
    expect:
      targets:
        - entity: { type: 의료사업, key: P-01 }
          depth: 1
          path: { from: { type: 운영지침, key: G-01 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-01 }, target: { type: 의료사업, key: P-01 } } ] }
        - entity: { type: 의료사업, key: P-02 }
          depth: 1
          path: { from: { type: 운영지침, key: G-01 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-01 }, target: { type: 의료사업, key: P-02 } } ] }
        - entity: { type: 민간기관, key: C-02 }
          depth: 2
          path: { from: { type: 운영지침, key: G-01 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-01 }, target: { type: 의료사업, key: P-01 } }, { type: 사업참여, source: { type: 민간기관, key: C-02 }, target: { type: 의료사업, key: P-01 } } ] }
        - entity: { type: 보건기관, key: H-01 }
          depth: 2
          path: { from: { type: 운영지침, key: G-01 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-01 }, target: { type: 의료사업, key: P-01 } }, { type: 사업참여, source: { type: 보건기관, key: H-01 }, target: { type: 의료사업, key: P-01 } } ] }
        - entity: { type: 보건기관, key: H-02 }
          depth: 2
          path: { from: { type: 운영지침, key: G-01 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-01 }, target: { type: 의료사업, key: P-02 } }, { type: 사업참여, source: { type: 보건기관, key: H-02 }, target: { type: 의료사업, key: P-02 } } ] }
        - entity: { type: 의료사업, key: P-03 }
          depth: 2
          path: { from: { type: 운영지침, key: G-01 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-01 }, target: { type: 의료사업, key: P-01 } }, { type: 사업연계, source: { type: 의료사업, key: P-03 }, target: { type: 의료사업, key: P-01 } } ] }
        - entity: { type: 민간기관, key: C-01 }
          depth: 3
          path: { from: { type: 운영지침, key: G-01 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-01 }, target: { type: 의료사업, key: P-01 } }, { type: 사업연계, source: { type: 의료사업, key: P-03 }, target: { type: 의료사업, key: P-01 } }, { type: 사업참여, source: { type: 민간기관, key: C-01 }, target: { type: 의료사업, key: P-03 } } ] }
      countsByType: { 민간기관: 2, 보건기관: 2, 의료사업: 3 }
      countsByDepth: { 1: 2, 2: 4, 3: 1 }
      truncated: false

  - id: Q-10
    kind: impact
    title: 지침 G-03 이 없어진 것의 영향 범위 (한계에서 멈춘다)
    change: { step: 7, itemKey: [G-03] }
    # 변동 대상은 G-03 이다 (앞 판의 행이 만든 개체).
    # 이 영향 범위는 7단계를 투입한 직후에 계산한다. 그때는 8단계(지침 적용의 둘째 판)가 아직 들어오지 않아
    # G-03 의 적용 관계가 2026-02-28 과 2026-03-01 에 모두 유효하다. 두 날짜의 경로가 같은 길이라
    # 적용일(2026-03-01)의 경로를 남긴다. 8단계가 들어와 그 관계가 끝나도 저장한 결과는 바뀌지 않는다.
    # 깊이 1: P-03.  깊이 2: P-03 에 참여하는 C-01, P-03 과 연계된 P-01.
    # 깊이 3: P-01 에 참여하는 C-02 와 H-01, P-01 과 연계된 P-02.
    # 깊이 4 에 P-02 에 참여하는 H-02 가 있다. 최대 깊이 3 에서 멈추고 표시를 켠다.
    expect:
      targets:
        - entity: { type: 의료사업, key: P-03 }
          depth: 1
          path: { from: { type: 운영지침, key: G-03 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-03 }, target: { type: 의료사업, key: P-03 } } ] }
        - entity: { type: 민간기관, key: C-01 }
          depth: 2
          path: { from: { type: 운영지침, key: G-03 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-03 }, target: { type: 의료사업, key: P-03 } }, { type: 사업참여, source: { type: 민간기관, key: C-01 }, target: { type: 의료사업, key: P-03 } } ] }
        - entity: { type: 의료사업, key: P-01 }
          depth: 2
          path: { from: { type: 운영지침, key: G-03 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-03 }, target: { type: 의료사업, key: P-03 } }, { type: 사업연계, source: { type: 의료사업, key: P-03 }, target: { type: 의료사업, key: P-01 } } ] }
        - entity: { type: 민간기관, key: C-02 }
          depth: 3
          path: { from: { type: 운영지침, key: G-03 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-03 }, target: { type: 의료사업, key: P-03 } }, { type: 사업연계, source: { type: 의료사업, key: P-03 }, target: { type: 의료사업, key: P-01 } }, { type: 사업참여, source: { type: 민간기관, key: C-02 }, target: { type: 의료사업, key: P-01 } } ] }
        - entity: { type: 보건기관, key: H-01 }
          depth: 3
          path: { from: { type: 운영지침, key: G-03 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-03 }, target: { type: 의료사업, key: P-03 } }, { type: 사업연계, source: { type: 의료사업, key: P-03 }, target: { type: 의료사업, key: P-01 } }, { type: 사업참여, source: { type: 보건기관, key: H-01 }, target: { type: 의료사업, key: P-01 } } ] }
        - entity: { type: 의료사업, key: P-02 }
          depth: 3
          path: { from: { type: 운영지침, key: G-03 }, asOf: 2026-03-01, relations: [ { type: 지침적용, source: { type: 운영지침, key: G-03 }, target: { type: 의료사업, key: P-03 } }, { type: 사업연계, source: { type: 의료사업, key: P-03 }, target: { type: 의료사업, key: P-01 } }, { type: 사업연계, source: { type: 의료사업, key: P-01 }, target: { type: 의료사업, key: P-02 } } ] }
      countsByType: { 민간기관: 2, 보건기관: 1, 의료사업: 3 }
      countsByDepth: { 1: 1, 2: 2, 3: 3 }
      truncated: true

  - id: Q-11
    kind: impact
    title: 사업 P-03 이 운영을 시작한 것의 영향 범위 (참조로만 나온 개체도 변동 대상이다)
    change: { step: 9, itemKey: [P-03] }
    # P-03 의 행은 개체 P-03 과, 연계 관계의 상대편으로 P-01 을 만든다.
    # 행에서 나온 모든 개체가 변동 대상이므로 (D2 AD-43, AD-59) 변동 대상은 P-03 과 P-01 둘이다.
    # 둘 다 영향 대상에서 빠진다. 두 날짜(2026-03-31, 2026-04-01)의 결과가 같아 적용일의 경로를 남긴다.
    # 깊이 1: P-03 에 참여하는 C-01. P-01 에 참여하는 C-02 와 H-01, P-01 과 연계된 P-02.
    # 깊이 2: P-02 에 참여하는 H-02.
    expect:
      targets:
        - entity: { type: 민간기관, key: C-01 }
          depth: 1
          path: { from: { type: 의료사업, key: P-03 }, asOf: 2026-04-01, relations: [ { type: 사업참여, source: { type: 민간기관, key: C-01 }, target: { type: 의료사업, key: P-03 } } ] }
