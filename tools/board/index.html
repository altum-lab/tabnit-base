<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabnit Base 개발 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f4; --surface:#ffffff; --sunk:#e4e9ee; --ink:#14212d; --muted:#586574; --line:#cfd7df;
  --brand:#0f3d5c; --brand-ink:#ffffff; --gate:#d4501a; --ok:#1c7f55; --warn:#a86a10; --bad:#b93a2c; --info:#2b62b3;
  --ok-bg:#e0f1e9; --warn-bg:#f7ecd6; --bad-bg:#f8e2de; --info-bg:#e1eaf7; --gate-bg:#fbe7dc;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e151c; --surface:#16202a; --sunk:#1d2a36; --ink:#e6edf3; --muted:#93a1af; --line:#2b3a48;
    --brand:#7cc0ea; --brand-ink:#0b1720; --gate:#ff8a55; --ok:#5fcf9c; --warn:#e5b454; --bad:#f08a7c; --info:#86b3f2;
    --ok-bg:#153527; --warn-bg:#3a2f14; --bad-bg:#3d1f1b; --info-bg:#1a2c47; --gate-bg:#40241a;
  }
}
:root[data-theme="dark"]{
  --paper:#0e151c; --surface:#16202a; --sunk:#1d2a36; --ink:#e6edf3; --muted:#93a1af; --line:#2b3a48;
  --brand:#7cc0ea; --brand-ink:#0b1720; --gate:#ff8a55; --ok:#5fcf9c; --warn:#e5b454; --bad:#f08a7c; --info:#86b3f2;
  --ok-bg:#153527; --warn-bg:#3a2f14; --bad-bg:#3d1f1b; --info-bg:#1a2c47; --gate-bg:#40241a;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h2{font-size:17px;margin-bottom:10px}
h3{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:6px}
p{margin:0 0 8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 60px}
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.topin h1{font-size:18px;letter-spacing:-.01em}
.topin .sub{color:var(--muted);font-size:13px}
.conn{margin-left:auto;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.conn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:5px}
.conn.live .dot{background:var(--ok)} .conn.ro .dot{background:var(--warn)} .conn.off .dot{background:var(--bad)}
nav.tabs{max-width:1240px;margin:0 auto;padding:8px 20px 0;display:flex;gap:2px;overflow-x:auto}
nav.tabs a{padding:8px 13px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;font-size:14px}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--brand)}
nav.tabs a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--info);outline-offset:2px}
main{padding-top:22px}
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:980px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2e{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tile .k{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.tile .v{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.tile .v small{font-size:14px;font-weight:500;color:var(--muted)}
.tile .n{font-size:12.5px;color:var(--muted);margin-top:6px}
.tile.gate{border-left:4px solid var(--gate)}
.lead{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.lead .k,.lead .n,.lead .v small{color:inherit;opacity:.82}
.bar{position:relative;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:5px}
.bar>i.rv{background:var(--info);opacity:.55}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gate)}
.barwrap{position:relative;padding:3px 0}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow.cur{font-weight:600}
.srow .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.srow .pc{text-align:right;font-family:var(--mono);font-size:13px}
@media (max-width:600px){.srow{grid-template-columns:104px minmax(0,1fr) 64px}}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono)}
.scroll{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.pill.s-done,.pill.s-완료,.pill.s-통과,.pill.s-닫힘{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.pill.s-doing,.pill.s-작성중,.pill.s-대응중{background:var(--info-bg);border-color:transparent;color:var(--info)}
.pill.s-review,.pill.s-검토{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.pill.s-blocked,.pill.s-지연,.pill.s-미달{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tag.j{color:var(--gate)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button.link{white-space:nowrap;border:0;background:none;padding:0;color:var(--info);text-decoration:underline;text-underline-offset:3px}
button.danger{color:var(--bad)}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:74px;resize:vertical}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools .sp{flex:1}
.kan{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-height:120px}
.col h3{display:flex;justify-content:space-between;color:var(--ink);font-weight:600}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-top:8px}
.tk .t{font-weight:500;margin:3px 0 6px;cursor:pointer}
.tk .t:hover{text-decoration:underline}
.tk .f{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tk select{padding:2px 4px;font-size:12.5px}
.tk.s-blocked{border-left:3px solid var(--bad)}
.tk .ac{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.who{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:4px;background:var(--brand);color:var(--brand-ink);font-family:var(--mono);font-size:12px;font-weight:600}
.gantt{position:relative;min-width:860px;padding:26px 0 8px}
.gantt .axis{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);font-size:11.5px;color:var(--muted);padding-left:4px}
.gantt .today{position:absolute;top:0;bottom:0;border-left:2px solid var(--gate);z-index:3}
.gantt .today span{position:absolute;top:0;left:4px;font-size:11.5px;color:var(--gate);font-weight:600;white-space:nowrap}
.grow{position:relative;height:38px;margin-top:6px}
.gbar{position:absolute;top:4px;height:30px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);overflow:visible;font-size:12.5px;white-space:nowrap}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);opacity:.28;border-radius:4px}
.gbar span{position:relative;display:block;padding:5px 8px;font-weight:500}
.gbar.cur{border-color:var(--brand);border-width:2px}
.gms{position:absolute;top:4px;transform:translateX(-50%);text-align:center;font-size:11.5px;white-space:nowrap}
.gms b{display:block;width:12px;height:12px;margin:0 auto 2px;transform:rotate(45deg);background:var(--surface);border:2px solid var(--muted)}
.gms.g b{border-color:var(--gate)} .gms.p b{background:var(--ok);border-color:var(--ok)} .gms.l b{background:var(--bad);border-color:var(--bad)}
ul.plain{margin:0;padding-left:18px} ul.plain li{margin-bottom:5px}
ol.flow{margin:0;padding-left:20px} ol.flow li{margin-bottom:6px}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin-bottom:14px;font-size:13.5px}
.banner.bad{background:var(--bad-bg)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(620px,94vw)}
dialog::backdrop{background:rgba(8,14,20,.55)}
dialog form{padding:20px;display:grid;gap:12px}
dialog h2{margin:0}
.fr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.fr{grid-template-columns:repeat(2,minmax(0,1fr))}}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
label>input,label>select,label>textarea{color:var(--ink);font-size:14.5px;width:100%}
.act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.act .sp{flex:1}
.logl{list-style:none;margin:0;padding:0}
.logl li{padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.logl li:first-child{border-top:0}
.logl time{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:8px}
.loadrow{display:grid;grid-template-columns:118px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:6px 0}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.stack .d{background:var(--ok)} .stack .r{background:var(--warn)} .stack .g{background:var(--info)} .stack .b{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.gwrap{overflow:auto;max-height:74vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gr{display:flex;height:32px;border-bottom:1px solid var(--line)}
.gl{position:sticky;left:0;z-index:2;flex:none;width:250px;background:var(--surface);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;overflow:hidden}
.gl .nm{overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gl .nm:hover{text-decoration:underline}
.gt{position:relative;flex:none}
.ghead{position:sticky;top:0;z-index:4;background:var(--surface)}
.ghead .gl{z-index:5;color:var(--muted);font-size:12px}
.ghead .gt.dayrow{display:flex}
.gd{flex:none;font-size:11px;color:var(--muted);border-left:1px solid var(--line);padding:9px 0 0 3px;white-space:nowrap;overflow:visible}
.gd.wk{background:var(--sunk)}
.gsp{position:absolute;top:4px;height:24px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);font-size:12px;font-weight:500;padding:2px 7px;white-space:nowrap;overflow:hidden}
.gsp.cur{border:2px solid var(--brand);padding:1px 6px}
.gmk{position:absolute;top:7px;font-size:11.5px;white-space:nowrap;transform:translateX(-5px);color:var(--muted)}
.gmk.g{color:var(--gate);font-weight:600}
.gbody{position:relative}
.glayer{position:absolute;top:0;bottom:0;pointer-events:none}
.gwk{position:absolute;top:0;bottom:0;background:var(--sunk);opacity:.65}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--gate);z-index:3}
.gr.grp{background:var(--sunk)} .gr.grp .gl{background:var(--sunk);font-weight:600}
.gb{position:absolute;top:5px;height:22px;border-radius:4px;font-size:11.5px;line-height:22px;padding:0 9px;text-align:center;font-family:var(--mono);white-space:nowrap;overflow:hidden;z-index:1;user-select:none;-webkit-user-select:none;background:var(--surface);border:1.5px solid var(--muted);color:var(--ink)}
.gbl{position:absolute;top:8px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:none}
.gb.ed{cursor:grab;touch-action:none} .gb.drag{cursor:grabbing;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:3}
.gb.auto{border-style:dashed}
.gb.s-doing{background:var(--info);border-color:var(--info);color:var(--surface)}
.gb.s-review{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.gb.s-done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.gb.s-blocked{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.gb i{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize} .gb .hl{left:0} .gb .hr{right:0}
.tk[draggable=true]{cursor:grab}
.tk.dragging{opacity:.45}
.col.over{outline:2px dashed var(--brand);outline-offset:-2px}
.flag{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:3px;margin:0 4px 2px 0;white-space:nowrap;border:1px solid transparent}
.flag.late,.flag.blocked{background:var(--bad-bg);color:var(--bad)}
.flag.nostart,.flag.stale{background:var(--warn-bg);color:var(--warn)}
.flag.noev,.flag.wait{background:var(--info-bg);color:var(--info)}
.verdict{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;border-left:6px solid var(--ok)}
.verdict.v-주의{border-left-color:var(--warn)} .verdict.v-위험{border-left-color:var(--bad)}
.verdict .big{font-size:26px;font-weight:700;line-height:1.1;min-width:84px}
.verdict.v-정상 .big{color:var(--ok)} .verdict.v-주의 .big{color:var(--warn)} .verdict.v-위험 .big{color:var(--bad)}
.verdict ul{margin:0;padding-left:18px;flex:1;min-width:240px}
.kp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:980px){.kp{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kp .card{padding:12px}
.kp .v{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.15}
.kp .k{font-size:12.5px;color:var(--muted)}
.kp .bad .v{color:var(--bad)} .kp .warn .v{color:var(--warn)}
.why{font-size:13px;color:var(--ink)}
.gb.late{box-shadow:0 0 0 2px var(--bad)}
.cmt{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:6px 0;font-size:13.5px}
.cmt time{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}
.fnrow.sub td:nth-child(2){padding-left:30px}
.fnd{display:grid;grid-template-columns:86px minmax(0,1fr);gap:2px 10px;font-size:13px;margin-top:6px}
.fnd dt{color:var(--muted)} .fnd dd{margin:0;white-space:pre-wrap}
.pbar{display:flex;align-items:center;gap:8px;min-width:110px}
.pbar .bar{flex:1;height:8px}
.pbar .bar>i.full{background:var(--ok)}
.modc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:980px){.modc{grid-template-columns:repeat(2,minmax(0,1fr))}}
.modc .card{padding:12px;cursor:pointer}
.modc .card.on{border-color:var(--brand);border-width:2px;padding:11px}
dialog.wide{width:min(860px,96vw)}
.fr2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.fr2{grid-template-columns:minmax(0,1fr)}}
.sec{margin-top:26px}
.clk{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.bar>i,.gbar i{transition:width .3s}}
.pbox{font-family:var(--mono);white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font-size:12.5px;line-height:1.55;margin:6px 0 0}
.scn{display:inline-block;min-width:22px;text-align:center;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 6px;background:var(--info-bg)}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <h1>Tabnit Base 개발 보드</h1>
    <span class="sub">v1.0 · 2026년 12월 30일 출시 · 대외비</span>
    <div class="conn" id="conn"><span><span class="dot"></span><span id="connText">저장소 연결 중</span></span>
      <label style="display:flex;gap:6px;align-items:center;color:inherit;white-space:nowrap">나는
        <select id="me" aria-label="내 역할" style="width:auto"></select></label>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="화면">
    <a href="#dash">현황</a><a href="#report">점검 보고</a><a href="#sprint">스프린트</a><a href="#gantt">간트</a><a href="#backlog">백로그</a><a href="#issues">이슈</a><a href="#impl">구현 기록</a><a href="#docs">설계 문서</a><a href="#claude">Claude 활용</a><a href="#schedule">일정</a><a href="#way">작업 방식</a>
  </nav>
</header>
<div class="wrap"><main id="view" aria-live="polite"></main></div>

<script>

function curSprint(){
  const t = today(), sp = BASE.sprints;
  return sp.find(s => D(s.start) <= t && t <= D(s.end)) || sp.find(s => D(s.start) > t) || sp[sp.length-1];
}
function plannedShare(list){        // 오늘까지 끝났어야 하는 추정 일수
  const t = today(); let p = 0;
  BASE.sprints.forEach(s => {
    const est = sum(list.filter(x => x.sprint===s.id), x => x.est);
    const a = D(s.start), b = D(s.end);
    if (t > b) p += est;
    else if (t >= a) p += est * (days(a,t)+1) / (days(a,b)+1);
  });
  return p;
}

/* ---------- 저장소 ---------- */
const chains = {};
function write(path, data){
  if (!db || !canWrite) return Promise.resolve(false);
  if (path.startsWith("tasks/") || path.startsWith("issues/") || path.startsWith("funcs/")) {
    data = Object.assign({}, data, { updated: Date.now(), by: me });
    if (path.startsWith("tasks/")) { const cur = tasks().find(x => x.id === path.slice(6)) || {};
      if (data.status !== "todo" && !data.startedAt) data.startedAt = cur.startedAt || iso(today());
      if (data.status === "done") data.doneAt = cur.status === "done" && cur.doneAt ? cur.doneAt : iso(today()); else delete data.doneAt; }
  }
  const run = () => db.doc(path).set(data);
  const p = (chains[path] || Promise.resolve()).then(run, run);
  chains[path] = p.catch(() => {});
  return p.then(() => true, e => { onWriteErr(e); return false; });
}
function onWriteErr(e){
  const c = e && e.code;
  if (c === "invalid_argument" || c === "not_granted" || c === "revoked") { canWrite = false; setConn("ro", "이 계정은 읽기만 할 수 있습니다. 공유 권한을 기여자 이상으로 받아야 고칠 수 있습니다."); }
  else if (c === "quota_exceeded") setConn(connState, "저장 공간이 찼습니다. 오래된 기록을 지워야 합니다.");
  else setConn(connState, "저장하지 못했습니다. 잠시 뒤 다시 해 주세요.");
  paint();
}
function addLog(text){
  if (!db || !canWrite) return;
  const now = new Date();
  db.collection("log").add({ ts: now.getTime(), date: iso(now), who: me, text }).catch(() => {});
}
function setConn(state, note){
  connState = state; connNote = note || "";
  const el = $("#conn"); el.className = "conn " + (state==="live"?"live":state==="ro"?"ro":state==="off"?"off":"");
  $("#connText").textContent = state==="live" ? (storeMode==="server" ? "서버에 저장 · 함께 편집" : "이 브라우저에만 저장") : state==="ro" ? "읽기 전용" : state==="off" ? "저장소 연결 안 됨" : "저장소 연결 중";
}
async function connect(){
  let timer = setTimeout(() => { if (connState==="loading") { setConn("off", "저장소에 아직 닿지 못했습니다. 지금 보이는 것은 처음 계획이며, 다른 사람의 변경이 빠져 있을 수 있습니다."); paint(); } }, 10000);
  const settle = () => { if (timer) { clearTimeout(timer); timer = null; } };
  const api = await makeStore();
  const user = null;
  db = api;
  let can = null; try { can = user ? await user.can("data.write") : null; } catch(e){}
  canWrite = can !== false;
  const fail = e => { settle(); setConn("off", "저장소 연결이 끊겼습니다. 화면을 다시 열어 주세요."); paint(); };
  const coll = (name, into) => db.collection(name).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); ov[into] = o;
    if (!snap.metadata.fromCache) { settle(); if (connState==="loading" || connState==="off") setConn(canWrite ? "live" : "ro", canWrite ? "" : "이 계정은 읽기만 할 수 있습니다."); }
    paint();

  coll("tasks","tasks"); coll("docs","docs"); coll("milestones","milestones"); coll("risks","risks"); coll("meta","meta"); coll("issues","issues"); coll("checkins","checkins"); coll("funcs","funcs");

/* ---------- 저장소: 서버가 있으면 서버, 없으면 이 브라우저 ---------- */
let storeMode = "local";
async function makeStore(){
  const subs = []; let docs = {}, rev = -1, ready = false;
  const fire = () => subs.forEach(f => f());
  const LS = "tabnit.board.v1";
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const snap = (name, q) => {
    let ds = Object.keys(docs).filter(k => k.startsWith(name + "/")).map(k => ({ id:k.slice(name.length+1), data:() => docs[k] }));
    if (q.o) ds.sort((x,y) => { const a = x.data()[q.o[0]], b = y.data()[q.o[0]]; return (q.o[1]==="desc" ? -1 : 1) * (a > b ? 1 : a < b ? -1 : 0); });
    if (q.l) ds = ds.slice(0, q.l);
    return { docs:ds, metadata:{ fromCache:false } };
  };
  let setDoc;
  // 1) 서버 확인
  let server = false;
  if (location.protocol.startsWith("http")) {
    try { const r = await fetch("api/state", { cache:"no-store" }); if (r.ok) { const j = await r.json(); docs = j.docs || {}; rev = j.rev; server = true; } } catch(e){}
  }
  if (server) {
    storeMode = "server";
    const pull = async () => {
      try { const r = await fetch("api/state?since=" + rev, { cache:"no-store" });
        if (r.status === 200) { const j = await r.json(); docs = j.docs || {}; rev = j.rev; fire(); }
        if (connState === "off") { setConn("live", ""); paint(); }
      } catch(e) { if (connState !== "off") { setConn("off", "서버에 닿지 않습니다. 다시 연결되면 자동으로 이어집니다."); paint(); } }
    };
    setInterval(pull, 3000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
    setDoc = async (p, d) => {
      docs = Object.assign({}, docs, { [p]: d }); fire();
      const r = await fetch("api/doc?path=" + encodeURIComponent(p), { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(d) });
      if (!r.ok) throw { code:"unavailable" };
      const j = await r.json(); if (j.rev === rev + 1) rev = j.rev; else pull();
    };
  } else {
    storeMode = "local";
    try { docs = JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ docs = {}; }
    window.addEventListener("storage", ev => { if (ev.key === LS) { try { docs = JSON.parse(ev.newValue || "{}"); } catch(e){} fire(); } });
    setDoc = async (p, d) => { docs = Object.assign({}, docs, { [p]: d }); try { localStorage.setItem(LS, JSON.stringify(docs)); } catch(e){ throw { code:"quota_exceeded" }; } fire(); };
  }
  ready = true;
  return {
    dump: () => docs,
    doc: p => ({ set: d => setDoc(p, d) }),
    collection: name => { const q = { o:null, l:0 };
      const c = { orderBy(f, d){ q.o = [f, d]; return c; }, limit(n){ q.l = n; return c; },
        onSnapshot(next){ const run = () => next(snap(name, q)); subs.push(run); setTimeout(run, 0); return () => {}; },
        add(d){ return setDoc(name + "/" + newId(), d); } };
      return c; }
  };
}
function backupDown(){
  const blob = new Blob([JSON.stringify({ exported:new Date().toISOString(), docs: db.dump() }, null, 1)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "tabnit-board-" + iso(new Date()) + ".json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function backupUp(file){
  const fr = new FileReader();
  fr.onload = async () => { try { const j = JSON.parse(fr.result); const d = j.docs || j; for (const p of Object.keys(d)) if (/^[\w.~:@+-]+\/[\w.~:@+-]+$/.test(p)) await write(p, d[p]); addLog("백업 불러오기: " + Object.keys(d).length + "건"); } catch(e){ setConn(connState, "백업 파일을 읽지 못했습니다."); paint(); } };

  if (a === "newfn") return fnDlg(null);
  if (a === "fxmod") { FX.mod = FX.mod === id ? "" : id; return paint(true); }
  if (a === "fndoc") { copyText("구현 기록 문서", "마크다운 형식입니다. 저장소의 docs 폴더에 붙여 넣어 둘 수 있습니다.", fnDoc()); return dlg.classList.add("wide"); }
  if (a === "issue") return (db && canWrite) ? issueDlg(id) : null;
  if (a === "newissue") return id ? askIssue(id) || null : issueDlg(null);
  if (a === "checkin") return checkinDlg();
  if (a === "copyreport") return copyReport();
  if (a === "bdown") return backupDown();
  if (a === "task") return (db && canWrite) ? taskDlg(id) : null;
  if (a === "new") return taskDlg(null, el.getAttribute("data-sprint"));
  if (a === "sprint") { sprintSel = id; return; }
  if (a === "metrics") { const m = metrics();
    return openDlg("검증과 통합 숫자", `<div class="fr"><label>검증 질문 전체<input type="number" name="qTotal" min="0" value="${m.qTotal}"></label><label>통과<input type="number" name="qPass" min="0" value="${m.qPass}"></label><label>밤 통합 연속 성공(일)<input type="number" name="nightly" min="0" value="${m.nightly}"></label></div><p class="note" style="margin:0">밤 통합 결과를 보고 아침 회의 전에 적습니다.</p>`,
      fd => { const n = { qTotal:Number(fd.get("qTotal"))||0, qPass:Number(fd.get("qPass"))||0, nightly:Number(fd.get("nightly"))||0 }; write("meta/metrics", n); addLog("검증 질문 "+n.qPass+"/"+n.qTotal+", 밤 통합 연속 "+n.nightly+"일"); }); }
  if (a === "ms") { const m = merged("milestones").find(x => x.id===id);
    return openDlg(m.id+" "+m.name, `<div class="fr"><label>날짜<input type="date" name="date" value="${m.date}" required></label><label>상태<select name="status">${opt(MS_ST,m.status)}</select></label></div><label>메모<textarea name="note">${esc(m.note||"")}</textarea></label>`,
      fd => { const n = { date:fd.get("date"), status:fd.get("status"), note:fd.get("note").trim() }; write("milestones/"+id, n); if (n.status!==m.status || n.date!==m.date) addLog(m.id+" "+m.name+": "+n.status+" ("+n.date+")"); }); }
  if (a === "docnote") { const d = merged("docs").find(x => x.id===id);
    return openDlg(d.id+" "+d.name, `<div class="fr"><label>기한<input type="date" name="due" value="${d.due}" required></label><label>상태<select name="status">${opt(DOC_ST,d.status)}</select></label></div><label>메모<textarea name="note" placeholder="저장소 경로, 남은 것, 바뀐 것">${esc(d.note||"")}</textarea></label>`,
      fd => { const n = { due:fd.get("due"), status:fd.get("status"), note:fd.get("note").trim() }; write("docs/"+id, n); if (n.status!==d.status) addLog(d.id+" "+d.name+": "+n.status); }); }
  if (a === "member" || a === "addmember") { const p = a === "member" ? team().find(x => x.id === id) : null;
    const used = team().map(x => x.id), nid = p ? p.id : "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").find(c => !used.includes(c)) || ("X" + used.length);
    return openDlg(p ? slotName(p.id)+" 고치기" : "자리 추가 · "+slotName(nid), `<div class="fr2"><label>이름<input type="text" name="name" value="${esc(p ? p.name : "")}" placeholder="나중에 넣어도 됩니다"></label><label>맡는 일<input type="text" name="role" value="${esc(p ? p.role : "")}" required></label></div>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="active" style="width:auto" ${!p || p.active !== false ? "checked" : ""}> 활동 중 (끄면 담당자 선택에서 빠집니다)</label>
      <p class="note" style="margin:0">오타를 고치거나 처음 실명을 넣을 때 씁니다. 사람이 바뀐 것이면 "교체"를 쓰세요.</p>`,
      fd => { const name = fd.get("name").trim(); saveTeam(m => { const c = m[nid] || { hist:[], since:"" }; m[nid] = { name, role:fd.get("role").trim(), active:!!fd.get("active"), hist:c.hist || [], since:c.since || (name ? iso(today()) : "") }; });
        addLog(p ? slotName(nid)+" 정보 수정"+(name && name !== p.name ? ": "+name : "") : "자리 추가: "+slotName(nid)+" · "+fd.get("role").trim()); }); }
  if (a === "replace") { const p = team().find(x => x.id === id), mine = tasks().filter(x => x.owner === id && x.status !== "done");
    return openDlg(slotName(id)+" 담당자 교체", `<p class="note" style="margin:0">지금: <b>${esc(p.name || "(이름 미정)")}</b> · 끝나지 않은 작업 ${mine.length}건 (진행 중 ${mine.filter(x => x.status === "doing" || x.status === "review").length}건)이 새 담당자에게 그대로 넘어갑니다.</p>
      <div class="fr2"><label>새 담당자 이름<input type="text" name="name" required></label><label>교체일<input type="date" name="date" value="${iso(today())}" required></label></div>
      <label>인수인계 내용<textarea name="note" required placeholder="진행 중인 작업의 상태, 남은 것, 주의할 것, 인계 문서 위치"></textarea></label>`,
      fd => { const name = fd.get("name").trim(), date = fd.get("date"), note = fd.get("note").trim();
        saveTeam(m => { const c = m[id]; c.hist.push({ name:c.name, from:c.since || "", to:date, note }); c.name = name; c.since = date; c.active = true; });
        addLog(slotName(id)+" 교체: "+(p.name || "(이름 미정)")+" → "+name+" · 인수인계: "+note); }, "", "교체"); }
  if (a === "moveall") { const mine = tasks().filter(x => x.owner === id && x.status !== "done"), fs = funcs().filter(f => f.owner === id), is = issueList().filter(i => i.owner === id && issOpen(i));
    const others = teamIds().filter(x => x !== id);
    return openDlg(slotName(id)+"의 작업 넘기기", `<p class="note" style="margin:0">끝나지 않은 작업 ${mine.length}건, 구현 기록 ${fs.length}건, 열린 이슈 ${is.length}건을 다른 자리로 옮깁니다. 끝난 작업은 그대로 둡니다.</p>
      <label>받는 자리<select name="to">${opt(others, others[0], x => slotName(x)+" "+whoName(x))}</select></label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="off" style="width:auto"> 넘긴 뒤 이 자리를 "빠짐"으로 둡니다</label>`,
      fd => { const to = fd.get("to"); if (!to) return false;
        (async () => { for (const x of mine) { const n = Object.assign({}, x, { owner:to }); delete n.id; await write("tasks/"+x.id, n); }
          for (const f of fs) { const n = Object.assign({}, f, { owner:to }); delete n.id; await write("funcs/"+f.id, n); }
          for (const i of is) { const n = Object.assign({}, i, { owner:to }); delete n.id; await write("issues/"+i.id, n); }
          if (fd.get("off")) await saveTeam(m => { m[id].active = false; });
          addLog(slotName(id)+" → "+slotName(to)+" 작업 "+mine.length+"건, 구현 기록 "+fs.length+"건, 이슈 "+is.length+"건 넘김"); })(); }, "", "넘기기"); }
  if (a === "log") return openDlg("기록 남기기", `<label>내용<textarea name="text" required placeholder="결정한 것, 바뀐 것, 알릴 것"></textarea></label>`, fd => { const s = fd.get("text").trim(); if (s) addLog(s); });
}
document.addEventListener("click", ev => {
  const el = ev.target.closest && ev.target.closest("[data-a]"); if (!el || el.tagName === "SELECT") return;
  act(el.getAttribute("data-a"), el);
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const el = ev.target; if (el.getAttribute && el.getAttribute("role") === "button" && el.hasAttribute("data-a")) { ev.preventDefault(); act(el.getAttribute("data-a"), el); }
});
document.addEventListener("change", ev => {
  const el = ev.target, a = el.getAttribute && el.getAttribute("data-a"), id = el.getAttribute && el.getAttribute("data-id");
  if (el.id === "bup") { if (el.files[0]) backupUp(el.files[0]); el.value = ""; return; }
  if (el.id === "me") { me = el.value; try { localStorage.setItem("tabnit.me", me); } catch(e){} return; }
  if (el.hasAttribute && el.hasAttribute("data-f") && el.tagName === "SELECT") { F[el.getAttribute("data-f")] = el.value; return paint(true); }
  if (el.hasAttribute && el.hasAttribute("data-fx")) { FX[el.getAttribute("data-fx")] = el.value; return paint(true); }
  if (el.hasAttribute && el.hasAttribute("data-if")) { IF[el.getAttribute("data-if")] = el.value; return paint(true); }
  if (el.hasAttribute && el.hasAttribute("data-g")) { G[el.getAttribute("data-g")] = el.value; return paint(true); }
  if (a === "selsprint") { sprintSel = el.value; return paint(true); }
  if (a === "st") return setStatus(id, el.value);
  if (a === "doc") { const d = merged("docs").find(x => x.id===id); write("docs/"+id, { due:d.due, status:el.value, note:d.note||"" }); addLog(d.id+" "+d.name+": "+el.value); return; }
  if (a === "risk") { const r = merged("risks").find(x => x.id===id); write("risks/"+id, { status:el.value }); addLog(r.id+" "+r.name+": "+el.value); return; }
});
function setStatus(id, st){
  const t = tasks().find(x => x.id===id); if (!t || t.status===st || !ST[st]) return;
  const n = Object.assign({}, t, {status:st}); delete n.id; write("tasks/"+id, n); addLog(id+" "+ST[t.status]+" → "+ST[st]);
  if (st === "blocked") setTimeout(() => askIssue(id), 50);
}
function release(){ busy = false; if (wantPaint) { wantPaint = false; } paint(true); }

/* 칸반: 카드를 끌어 다른 칸에 놓기 */
let dragId = null;
document.addEventListener("dragstart", ev => { const c = ev.target.closest && ev.target.closest("[data-drag]"); if (!c) return;
  dragId = c.getAttribute("data-drag"); busy = true; c.classList.add("dragging");
  try { ev.dataTransfer.setData("text/plain", dragId); ev.dataTransfer.effectAllowed = "move"; } catch(e){} });
document.addEventListener("dragover", ev => { if (!dragId) return; const col = ev.target.closest && ev.target.closest("[data-col]"); if (!col) return;
  ev.preventDefault(); document.querySelectorAll(".col.over").forEach(x => { if (x !== col) x.classList.remove("over"); }); col.classList.add("over"); });
document.addEventListener("drop", ev => { if (!dragId) return; const col = ev.target.closest && ev.target.closest("[data-col]"); if (!col) return;
  ev.preventDefault(); const id = dragId; dragId = null; busy = false; setStatus(id, col.getAttribute("data-col")); });
document.addEventListener("dragend", () => { dragId = null; release(); });

/* 간트: 막대를 끌어 날짜 옮기기, 양 끝을 끌어 기간 바꾸기 */
let gd = null;
document.addEventListener("pointerdown", ev => {
  const bar = ev.target.closest && ev.target.closest(".gb"); if (!bar || ev.button > 0) return;
  if (!bar.classList.contains("ed")) return;
  const mode = ev.target.classList.contains("hl") ? "l" : ev.target.classList.contains("hr") ? "r" : "m";
  gd = { bar, id:bar.dataset.id, mode, x:ev.clientX, dw:Number(bar.dataset.dw), l:parseFloat(bar.style.left), w:parseFloat(bar.style.width), dd:0, moved:false, len:days(D(bar.dataset.s), D(bar.dataset.e)) };
  busy = true; try { bar.setPointerCapture(ev.pointerId); } catch(e){} bar.classList.add("drag"); ev.preventDefault();
});
document.addEventListener("pointermove", ev => {
  if (!gd) return;
  let dd = Math.round((ev.clientX - gd.x) / gd.dw);
  if (gd.mode === "l") dd = Math.min(dd, gd.len); if (gd.mode === "r") dd = Math.max(dd, -gd.len);
  if (dd === gd.dd) return; gd.dd = dd; gd.moved = true;
  if (gd.mode !== "r") gd.bar.style.left = (gd.l + dd*gd.dw) + "px";
  if (gd.mode === "l") gd.bar.style.width = (gd.w - dd*gd.dw) + "px";
  if (gd.mode === "r") gd.bar.style.width = (gd.w + dd*gd.dw) + "px";
});
function gEnd(ev, cancel){
  if (!gd) return; const d = gd; gd = null; d.bar.classList.remove("drag");
  if (cancel) return release();
  if (!d.moved || d.dd === 0) { release(); return taskDlg(d.id); }
  const t = tasks().find(x => x.id===d.id); if (!t) return release();
  const s = iso(addD(D(d.bar.dataset.s), d.mode==="r" ? 0 : d.dd)), e = iso(addD(D(d.bar.dataset.e), d.mode==="l" ? 0 : d.dd));
  const n = Object.assign({}, t, { start:s, end:e, sprint:sprintOf(s, t.sprint) }); delete n.id;
  write("tasks/"+d.id, n); addLog(d.id+" 일정 "+md(s)+" ~ "+md(e)+(n.sprint!==t.sprint ? " ("+t.sprint+" → "+n.sprint+")" : ""));
  release();
}
document.addEventListener("pointerup", ev => gEnd(ev, false));
document.addEventListener("pointercancel", ev => gEnd(ev, true));

let qt = null;
document.addEventListener("input", ev => { const el = ev.target; if (el.id !== "fq") return; if (el.hasAttribute("data-fxq")) FX.q = el.value; else F.q = el.value; clearTimeout(qt); qt = setTimeout(() => paint(true), 160); });

let meKey = "";
function fillMe(){ const l = team().filter(p => p.active !== false), k = l.map(p => p.id+":"+p.name).join("|"); if (k === meKey) return; meKey = k;
  $("#me").innerHTML = l.map(p => `<option value="${esc(p.id)}"${p.id===me?" selected":""}>${esc(p.id==="CEO" ? "대표" : p.id+(p.name ? " "+p.name : ""))}</option>`).join(""); }
fillMe();
window.addEventListener("hashchange", go);
go();
connect();
</script>
</body>
</html>
