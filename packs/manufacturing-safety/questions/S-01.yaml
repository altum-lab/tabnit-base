        - { attribute: 노출기준값, value: "0.5", validFrom: 2026-01-01, validTo: null }
        - { attribute: 유해성구분, value: 급성독성 구분3, validFrom: 2026-01-01, validTo: 2026-09-02 }
        - { attribute: 자료개정일, value: "2025-01-15", validFrom: 2026-01-01, validTo: 2026-09-02 }
