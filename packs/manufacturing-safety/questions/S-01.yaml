# 제조 안전 Pack 의 검증 질문. 형식은 D4 3절이다.
#
# 상태: 정답 초안. 대표가 확정하기 전이다 (D4 4절: 정답은 대표가 정한다).
# 모든 이름과 값은 지어낸 것이다. 실제 회사, 현장, 법령, 문서와 관계가 없다.
#
# 정답을 만든 방법: 자료가 커서 (개체 157개) 손으로 적지 않았다. 예시 입력 파일에서 문서의 규칙
# (D3 6절·7절의 변동 대상과 영향 범위, D8 의 두 날짜와 규칙의 조건, D7 의 순서)을 엔진과 따로 구현한 계산으로 만들었다.
# 제품이 낸 답을 옮겨 적은 것이 아니다. 질문마다 무엇 때문에 그 답인지를 주석으로 적었다.
#
# 개체는 유형의 이름과 입력의 키로 가리킨다. 목록의 순서는 제품이 내놓는 순서다 (D4 4절, D2 AD-282).
# 영향 범위와 조치는 판을 투입한 직후에 그때의 자료로 한 번 계산해 저장한 것이다 (D2 AD-119).
# 영향이 퍼지는 길: 물질안전자료 → 화학물질 → 제조공정·약품보관소·법정요건 → 공정설비·작업인원 (최대 깊이 3).
#
# 이 질문들이 묻지 않는 것: 길이가 같은 근거 경로가 둘인 경우, 관계 유형과 상대 개체가 같은 관계가 둘인 경우.
# 정답을 만든 계산이 그 두 규칙(관계 식별자로 가리기)을 구현하지 않아 그런 자료를 넣지 않았다.
# 그 규칙은 엔진의 일반 시험과 시험용 Pack 의 질문이 본다.

scenario:
  id: S-01
  title: 물질안전자료가 두 번 바뀌고 인원이 옮기고 공정이 운영을 시작하고 물질 하나를 쓰지 않게 된다
  steps:
    # 2026-01-01: 처음 자료가 들어온다. 모두 첫 판이라 변동은 없다.
    - { step: 1, inputSource: regulation, file: data/regulation-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 2, inputSource: requirement, file: data/requirement-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 3, inputSource: substance, file: data/substance-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 4, inputSource: safety-sheet, file: data/safety-sheet-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 5, inputSource: process, file: data/process-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 6, inputSource: process-substance, file: data/process-substance-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 7, inputSource: equipment, file: data/equipment-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 8, inputSource: storage, file: data/storage-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 9, inputSource: substance-storage, file: data/substance-storage-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 10, inputSource: emission-point, file: data/emission-point-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 11, inputSource: process-emission, file: data/process-emission-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 12, inputSource: worker, file: data/worker-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 13, inputSource: incident, file: data/incident-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 14, inputSource: incident-substance, file: data/incident-substance-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 15, inputSource: permit, file: data/permit-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 16, inputSource: evidence, file: data/evidence-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 17, inputSource: requirement-substance, file: data/requirement-substance-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 18, inputSource: requirement-storage, file: data/requirement-storage-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 19, inputSource: requirement-emission, file: data/requirement-emission-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 20, inputSource: requirement-equipment, file: data/requirement-equipment-v1.csv, effectiveDate: 2026-01-01 }
    # 2026-09-02: 불산 자료(SDS-01)가 7판이 되며 유해성 구분이 오르고 특별관리 대상이 된다. 황산 자료(SDS-04)는 노출기준만 바뀐다.
    - { step: 21, inputSource: safety-sheet, file: data/safety-sheet-v2.csv, effectiveDate: 2026-09-02 }
    # 2026-10-01: W-1003 이 가-세정-01 에서 나-세정-02 로 옮기고, W-1061 이 새로 오고, W-1052 가 빠진다.
    - { step: 22, inputSource: worker, file: data/worker-v2.csv, effectiveDate: 2026-10-01 }
    # 2026-10-15: 계획이던 공정 나-세정-03 이 운영을 시작한다. 같은 날 그 공정의 설비 넷도 운영이 된다.
    - { step: 23, inputSource: process, file: data/process-v2.csv, effectiveDate: 2026-10-15 }
    - { step: 24, inputSource: equipment, file: data/equipment-v2.csv, effectiveDate: 2026-10-15 }
    # 2026-11-20: 공정 다-세정-01 이 불산을 더 쓰지 않는다. 그 뒤에 같은 날의 물질안전자료가 들어온다 (차례가 정답에 닿는다).
    - { step: 25, inputSource: process-substance, file: data/process-substance-v2.csv, effectiveDate: 2026-11-20 }
    # 2026-11-20: 불산 자료가 한 번 더 바뀐다 (8판). 실란 자료(SDS-06)도 바뀐다.
    - { step: 26, inputSource: safety-sheet, file: data/safety-sheet-v3.csv, effectiveDate: 2026-11-20 }

# 시점: 과거 2026-01-01 과 2026-09-30 / 2026-10-01 (인원이 옮기는 경계), 현재 2026-12-01 (마지막 판 뒤).

questions:

  # ── 시점 조회 ──────────────────────────────────────────────

  - id: Q-01
    kind: relations-as-of
    title: 처음 자료가 들어온 날, 불산(MAT-01)의 관계
    asOf: 2026-01-01
    entity: { type: 화학물질, key: MAT-01 }
    # 시작일 당일이라 들어온다. 불산을 쓰는 공정 다섯, 보관소 셋, 걸린 요건 일곱, 관련 사고 넷, 자료 하나다. 순서는 관계 유형, 상대 개체.
    expect:
      relations:
        - { type: 물질보관, source: { type: 화학물질, key: MAT-01 }, target: { type: 약품보관소, key: STO-가-A }, validFrom: 2026-01-01, validTo: null }
        - { type: 물질보관, source: { type: 화학물질, key: MAT-01 }, target: { type: 약품보관소, key: STO-나-B }, validFrom: 2026-01-01, validTo: null }
        - { type: 물질보관, source: { type: 화학물질, key: MAT-01 }, target: { type: 약품보관소, key: STO-다-A }, validFrom: 2026-01-01, validTo: null }
        - { type: 물질사용, source: { type: 제조공정, key: 가-세정-01 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 물질사용, source: { type: 제조공정, key: 가-세정-02 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 물질사용, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 물질사용, source: { type: 제조공정, key: 나-세정-03 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 물질사용, source: { type: 제조공정, key: 다-세정-01 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: 2026-11-20 }
        - { type: 사고관련, source: { type: 안전사고, key: INC-2023-077 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 사고관련, source: { type: 안전사고, key: INC-2024-031 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 사고관련, source: { type: 안전사고, key: INC-2025-012 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 사고관련, source: { type: 안전사고, key: INC-2025-091 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 요건적용, source: { type: 법정요건, key: REQ-01 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 요건적용, source: { type: 법정요건, key: REQ-02 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 요건적용, source: { type: 법정요건, key: REQ-03 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 요건적용, source: { type: 법정요건, key: REQ-04 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 요건적용, source: { type: 법정요건, key: REQ-05 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 요건적용, source: { type: 법정요건, key: REQ-06 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 요건적용, source: { type: 법정요건, key: REQ-07 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 자료기술, source: { type: 화학물질, key: MAT-01 }, target: { type: 물질안전자료, key: SDS-01 }, validFrom: 2026-01-01, validTo: null }

  - id: Q-02
    kind: relations-as-of
    title: W-1003 이 옮기기 전날의 관계 (종료일 전날)
    asOf: 2026-09-30
    entity: { type: 작업인원, key: W-1003 }
    # 배치는 2026-10-01 에 끝난다. 전날에는 가-세정-01 의 배치가 아직 유효하다. 변경 교육의 증빙도 이 인원을 가리킨다.
    expect:
      relations:
        - { type: 이행증빙, source: { type: 법정요건, key: REQ-02 }, target: { type: 작업인원, key: W-1003 }, validFrom: 2026-01-01, validTo: null }
        - { type: 인원배치, source: { type: 제조공정, key: 가-세정-01 }, target: { type: 작업인원, key: W-1003 }, validFrom: 2026-01-01, validTo: 2026-10-01 }

  - id: Q-03
    kind: relations-as-of
    title: W-1003 이 옮긴 날의 관계 (종료일 당일, 새 시작일 당일)
    asOf: 2026-10-01
    entity: { type: 작업인원, key: W-1003 }
    # 가-세정-01 의 배치는 이날 끝나 들지 않고, 나-세정-02 의 배치가 이날 시작해 든다.
    expect:
      relations:
        - { type: 이행증빙, source: { type: 법정요건, key: REQ-02 }, target: { type: 작업인원, key: W-1003 }, validFrom: 2026-01-01, validTo: null }
        - { type: 인원배치, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 작업인원, key: W-1003 }, validFrom: 2026-10-01, validTo: null }

  - id: Q-04
    kind: relations-as-of
    title: W-1052 가 빠진 날의 관계
    asOf: 2026-10-01
    entity: { type: 작업인원, key: W-1052 }
    # 인원의 행이 사라져 배치는 2026-10-01 에 끝났다. 이 인원을 가리키는 다른 관계가 없으면 빈 목록이다.
    expect:
      relations: []

  - id: Q-05
    kind: relations-as-of
    title: 현재, 공정 나-세정-02 의 관계
    asOf: 2026-12-01
    entity: { type: 제조공정, key: 나-세정-02 }
    # 옮겨 온 W-1003 의 배치는 시작일이 2026-10-01 이다. 나머지는 처음 자료의 것이다. 배기와 작업허가도 든다.
    expect:
      relations:
        - { type: 물질사용, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 화학물질, key: MAT-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 물질사용, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 화학물질, key: MAT-03 }, validFrom: 2026-01-01, validTo: null }
        - { type: 배기연결, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 대기배출구, key: EMI-나-07 }, validFrom: 2026-01-01, validTo: null }
        - { type: 설비구성, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 공정설비, key: 나-세정-02-E1 }, validFrom: 2026-01-01, validTo: null }
        - { type: 설비구성, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 공정설비, key: 나-세정-02-E2 }, validFrom: 2026-01-01, validTo: null }
        - { type: 설비구성, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 공정설비, key: 나-세정-02-E3 }, validFrom: 2026-01-01, validTo: null }
        - { type: 인원배치, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 작업인원, key: W-1003 }, validFrom: 2026-10-01, validTo: null }
        - { type: 인원배치, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 작업인원, key: W-1032 }, validFrom: 2026-01-01, validTo: null }
        - { type: 인원배치, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 작업인원, key: W-1033 }, validFrom: 2026-01-01, validTo: null }
        - { type: 인원배치, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 작업인원, key: W-1034 }, validFrom: 2026-01-01, validTo: null }
        - { type: 인원배치, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 작업인원, key: W-1035 }, validFrom: 2026-01-01, validTo: null }
        - { type: 인원배치, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 작업인원, key: W-1036 }, validFrom: 2026-01-01, validTo: null }
        - { type: 인원배치, source: { type: 제조공정, key: 나-세정-02 }, target: { type: 작업인원, key: W-1037 }, validFrom: 2026-01-01, validTo: null }

  # ── 변동 ───────────────────────────────────────────────────

  - id: Q-06
    kind: changes
    title: 물질안전자료의 둘째 판에서 나온 변동
    step: 21
    # 불산 자료와 황산 자료의 행이 바뀌었다. 나머지 열 행은 그대로다. 순서는 항목의 키.
    expect:
      changes:
        - { itemKey: [SDS-01], kind: changed }
        - { itemKey: [SDS-04], kind: changed }

  - id: Q-07
    kind: changes
    title: 인원의 둘째 판에서 나온 변동 (추가, 변경, 삭제가 모두 있다)
    step: 22
    # W-1003 은 배치 공정이 바뀌어 변경, W-1052 는 행이 없어져 삭제, W-1061 은 새 행이라 추가.
    expect:
      changes:
        - { itemKey: [W-1003], kind: changed }
        - { itemKey: [W-1052], kind: removed }
        - { itemKey: [W-1061], kind: added }

  - id: Q-08
    kind: changes
    title: 물질안전자료의 셋째 판에서 나온 변동 (한 번 바뀐 것이 또 바뀐다)
    step: 26
    # 불산 자료가 8판이 되고, 실란 자료가 처음 바뀐다. 황산 자료는 둘째 판과 같아 변동이 아니다.
    expect:
      changes:
        - { itemKey: [SDS-01], kind: changed }
        - { itemKey: [SDS-06], kind: changed }

  - id: Q-17
    kind: changes
    title: 설비의 둘째 판에서 나온 변동
    step: 24
    # 나-세정-03 의 설비 넷의 상태가 계획에서 운영으로 바뀌었다. 나머지 스물여덟 대는 그대로다.
    expect:
      changes:
        - { itemKey: [나-세정-03-E1], kind: changed }
        - { itemKey: [나-세정-03-E2], kind: changed }
        - { itemKey: [나-세정-03-E3], kind: changed }
        - { itemKey: [나-세정-03-E4], kind: changed }

  # ── 영향 범위 ──────────────────────────────────────────────

  - id: Q-09
    kind: impact
    title: 불산 자료가 7판이 된 것의 영향 범위
    change: { step: 21, itemKey: [SDS-01] }
    # 변동 대상은 물질안전자료 SDS-01 하나다 (이 자료의 행은 물질을 가리키지 않는다). 깊이 1 은 불산, 깊이 2 는 불산을 쓰는 공정 다섯과 보관소 셋과 걸린 요건 일곱, 깊이 3 은 그 공정의 설비와 인원이다. 설비에 걸린 요건(REQ-05)은 이미 깊이 2 에서 찾았으므로 한계 너머에 새 대상이 없다.
    expect:
      targets:
        - entity: { type: 화학물질, key: MAT-01 }
          depth: 1
          path: { from: { type: 물질안전자료, key: SDS-01 }, asOf: 2026-09-02, relations: [ { type: 자료기술, source: { type: 화학물질, key: MAT-01 }, target: { type: 물질안전자료, key: SDS-01 } } ] }
