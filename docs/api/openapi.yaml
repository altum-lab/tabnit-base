# Tabnit Base 의 API 규격. 기준 문서는 docs/D7-api-contract.md 다.
# 이 파일을 먼저 고치고 구현한다. 화면의 호출 코드는 이 파일에서 만든다 (D2 AD-09, AD-77).
# 상태: 초안. 지금은 시점 조회, 판 올리기, 조치 목록, 변동의 영향 범위, 조치 하나와 이력, 확정과 보류, Pack 과 입력 자료의 목록, 로그인과 세션, Pack 적재가 들어 있다.
openapi: 3.1.0
info:
  title: Tabnit Base API
  version: 0.1.0
  description: >-
    관계를 읽는 모든 API 는 조회 시점(asOf)을 받고, 응답에 어느 날짜로 답했는지 담는다.
    목록의 순서는 서버가 정하며 화면은 바꾸지 않는다.
    로그인(POST /api/v1/session) 말고는 모두 로그인해야 부를 수 있다. 로그인하면 서버가 세션 쿠키를 준다.
    바꾸는 요청(POST, DELETE 등)에는 서버가 XSRF-TOKEN 쿠키로 준 값을 X-XSRF-TOKEN 헤더에 실어 보낸다.
    로그인하지 않았으면 401 (UNAUTHENTICATED), 그 헤더가 없거나 틀리면 403 (FORBIDDEN)이다.
    역할은 관리자(ADMIN)와 담당자(OFFICER) 둘이다. 관리자는 담당자의 일을 모두 한다. Pack 적재는 관리자만 한다.
    할 수 없는 일을 부르면 403 (FORBIDDEN)이다.
paths:
  /api/v1/relations:
    get:
      operationId: getRelationsAsOf
      summary: 개체의 관계 가운데 조회 시점에 유효한 것을 돌려준다
      parameters:
        - name: entityId
          in: query
          required: true
          description: 개체의 id. 서버가 준 값을 그대로 보낸다
          schema:
            type: string
            minLength: 1
        - name: asOf
          in: query
          required: false
          description: 조회 시점. 없으면 설치 설정의 시간대에서의 오늘. 0001-01-01 부터 9999-12-31 까지의 날짜만 받는다
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            조회 시점에 유효한 관계. 개체가 출발 쪽이든 도착 쪽이든 들어 있다.
            순서는 관계 유형, 상대 개체의 id, 관계의 id 차례이고 모두 글자 코드 순이다.
            유효한 것이 없으면 빈 목록이다. 나눠 준다: offset 만큼 건너뛰고 limit 개까지 준다.
            total 은 나누기 전의 전체 수다. 나눠 받은 것을 이으면 한 번에 받은 것과 순서까지 같다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationsAsOf'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/constraint-violations:
    get:
      operationId: listConstraintViolations
      summary: Pack 의 자료가 조회 시점에 Pack 의 제약을 어긴 곳을 돌려준다
      description: >-
        물을 때 조회 시점에 유효한 자료에 제약(Pack 의 constraints.ttl, SHACL)을 걸어 답한다. 위반을 저장하지 않는다.
        조회 시점에 유효한 값이나 관계가 하나라도 있는 개체만 검사한다 (값도 관계도 없는 개체는 그 날짜에 없는 것으로
        본다). 위반은 보고만 한다:
        조치로 이어지지 않는다. 담당자와 관리자가 부를 수 있다
      parameters:
        - name: packId
          in: query
          required: true
          description: Pack 의 식별자
          schema:
            type: string
            minLength: 1
        - name: asOf
          in: query
          required: false
          description: 조회 시점. 없으면 설치 설정의 시간대에서의 오늘. 0001-01-01 부터 9999-12-31 까지의 날짜만 받는다
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            위반을 나눠 돌려준다: offset 만큼 건너뛰고 limit 개까지 준다. total 은 위반의 전체 수다.
            순서는 심각한 것부터 (위반, 경고, 알림), 그 안에서 개체의 id, 어긴 곳의 종류와 이름, 제약의 종류, 값,
            제약의 이름, 문구의 글자 코드 순이다. 위반이 없으면 빈 목록이다.
            자료가 한도(maxRows)보다 크면 검사하지 않는다: checked 가 false 이고 목록은 비어 있다 (위반이 없다는 뜻이 아니다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolationList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/entities:
    get:
      operationId: searchEntities
      summary: Pack 의 개체를 글자로 찾는다
      description: >-
        검색어가 다음 가운데 하나에 맞는 개체를 돌려준다: 키에 검색어가 들어 있다, id 전체가 검색어와 같다,
        조회 시점에 유효한 속성 값에 검색어가 들어 있다 (표시 이름도 속성 값이다). 영어 글자의 대소문자만 가리지
        않는다. 검색어의 % 와 _ 는 글자 그대로다. 검색어가 없으면 그 Pack 의 개체 전부다.
        개체에는 유효기간이 없어서 키와 id 로는 어느 조회 시점에나 찾는다. 담당자와 관리자가 부를 수 있다
      parameters:
        - name: packId
          in: query
          required: true
          description: Pack 의 식별자
          schema:
            type: string
            minLength: 1
        - name: q
          in: query
          required: false
          description: 검색어. 없거나 비어 있으면 그 Pack 의 개체 전부다. 빈칸도 글자로 본다. 200자까지
          schema:
            type: string
            maxLength: 200
        - name: entityType
          in: query
          required: false
          description: >-
            걸러 낼 개체 유형의 이름. 여러 번 적을 수 있다 (entityType=A&entityType=B). 상위 유형을 적으면 그 하위
            유형의 개체도 나온다. 없으면 모든 유형이다. Pack 의 온톨로지에 없는 이름이면 400 이다
          schema:
            type: array
            items:
              type: string
              minLength: 1
          style: form
          explode: true
        - name: asOf
          in: query
          required: false
          description: 조회 시점. 없으면 설치 설정의 시간대에서의 오늘. 0001-01-01 부터 9999-12-31 까지의 날짜만 받는다
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            찾은 개체를 나눠 돌려준다: offset 만큼 건너뛰고 limit 개까지 준다. total 은 찾은 개체의 전체 수다.
            순서는 개체의 id 의 글자 코드 순이다. 맞는 것이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/attribute-values:
    get:
      operationId: getAttributeValuesAsOf
      summary: 개체 하나의 속성 값을 조회 시점으로 돌려준다
      description: >-
        조회 시점에 유효한 값만 준다 (시작일 포함, 종료일 제외). 그 날짜에 값이 없는 속성은 목록에 없고, 하나도 없으면
        빈 목록이다. 순서는 속성의 이름, 시작일의 글자 코드 순이다. 나눠 주지 않는다. 담당자와 관리자가 부를 수 있다
      parameters:
        - name: entityId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: asOf
          in: query
          required: false
          description: 조회 시점. 없으면 오늘
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 그 개체와 조회 시점에 유효한 속성 값
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeValuesAsOf'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/pack-relation-map:
    get:
      operationId: getPackRelationMap
      summary: 가운데 개체 없이 Pack 의 지도를 조회 시점으로 돌려준다
      description: >-
        조회 시점에 유효한 관계와 그 관계에 닿은 개체다. 이어진 개체가 한도(maxNodes) 이하이면 개체와 관계를 그대로
        주고, 넘으면 유형별 묶음만 준다 (grouped 가 true, nodes 와 edges 는 비어 있다). 유형별 묶음과 수는 언제나
        준다: 유형마다의 개체 수를 더한 것이 connectedEntities 와 같다. 관계가 하나도 없는 개체는 지도에 넣지 않고
        수만 준다 (isolatedEntities). 담당자와 관리자가 부를 수 있다
      parameters:
        - name: packId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: asOf
          in: query
          required: false
          description: 조회 시점. 없으면 오늘
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Pack 의 지도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackRelationMap'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/relation-path:
    get:
      operationId: getRelationPath
      summary: 두 개체 사이의 가장 짧은 경로를 조회 시점에 유효한 관계로 찾는다
      description: >-
        관계의 방향을 가리지 않고 잇는다 (들어오는 관계와 나가는 관계를 모두 따라간다). 영향 범위의 근거 경로와 다른
        계산이다. 길이가 같은 가장 짧은 경로가 여럿이면 출발 개체 쪽부터 관계의 id 를 차례로 견줘 글자 코드 순으로 앞선
        하나를 준다. 최대 길이와 훑는 개체의 수에 한도가 있다: 한도 때문에 찾지 못했으면 limitReached 가 true 다.
        담당자와 관리자가 부를 수 있다
      parameters:
        - name: fromEntityId
          in: query
          required: true
          description: 출발 개체의 id
          schema:
            type: string
            minLength: 1
        - name: toEntityId
          in: query
          required: true
          description: 도착 개체의 id. 출발 개체와 같은 Pack 의 것이어야 한다. 출발 개체와 같으면 길이 0 의 경로다
          schema:
            type: string
            minLength: 1
        - name: asOf
          in: query
          required: false
          description: 조회 시점. 없으면 설치 설정의 시간대에서의 오늘. 0001-01-01 부터 9999-12-31 까지의 날짜만 받는다
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 경로를 돌려준다. 경로가 없는 것은 오류가 아니다 (found 가 false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationPath'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/relation-map:
    get:
      operationId: getRelationMap
      summary: 개체 하나를 가운데 두고, 조회 시점에 유효한 관계로 이어진 이웃을 노드와 간선으로 돌려준다
      description: >-
        관계 지도 화면이 쓴다. 영향이 퍼지는 방향을 보지 않는다: 들어오는 관계와 나가는 관계를 모두 따라간다.
        담당자와 관리자가 부를 수 있다
      parameters:
        - name: entityId
          in: query
          required: true
          description: 가운데 개체의 id. 서버가 준 값을 그대로 보낸다
          schema:
            type: string
            minLength: 1
        - name: asOf
          in: query
          required: false
          description: 조회 시점. 없으면 설치 설정의 시간대에서의 오늘. 0001-01-01 부터 9999-12-31 까지의 날짜만 받는다
          schema:
            type: string
            format: date
        - name: depth
          in: query
          required: false
          description: 가운데 개체에서 따라갈 관계의 수. 없으면 1. 영어 숫자 한 글자(1, 2, 3)로 적는다
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 1
      responses:
        '200':
          description: >-
            노드와 간선. 노드는 깊이, 개체 유형, 개체의 id 차례이고 가운데 개체가 맨 앞이다.
            간선은 관계 유형, 출발 개체의 id, 도착 개체의 id, 관계의 id 차례다. 모두 글자 코드 순이다.
            노드가 maxNodes 를 넘으면 앞에서부터 maxNodes 개만 담고 truncated 가 true 다.
            찾은 노드가 maxNodes 를 넘은 단계에서 더 깊이 따라가지 않는다 (reachedDepth).
            간선은 담긴 노드끼리 이은 것만 들어 있다. 이어진 것이 없으면 노드는 가운데 개체 하나이고 간선은 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationMap'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/audit-records:
    get:
      operationId: listAuditRecords
      summary: 감사 기록을 걸러 본다 (관리자만)
      description: >-
        저장된 줄을 그대로 준다. 처리에 들어간 요청은 두 줄이다 (하기 전의 STARTED, 끝난 뒤의 SUCCESS 나 FAILED.
        결과의 줄이 startedId 로 시작의 줄을 가리킨다). 권한이 없어 들어가지 못한 요청은 DENIED 한 줄이다.
        순서는 id 의 내림차순이다 (가장 최근에 남긴 것부터). 관리자만 부를 수 있다: 담당자가 부르면 403 이다.
        보는 것도 감사 기록에 남는다. 감사 기록을 고치거나 지우는 API 는 없다
      parameters:
        - name: actor
          in: query
          required: false
          description: 누가. 아이디가 글자 그대로 같은 줄만. 일부로 찾지 않는다
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: action
          in: query
          required: false
          description: 무엇을. 기능의 이름(규격의 operationId 따위)이 글자 그대로 같은 줄만. 역할이 모자라 막힌 시도는 그 기능의 이름이 아니라 accessDenied 로 남는다
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: outcome
          in: query
          required: false
          description: 결과
          schema:
            $ref: '#/components/schemas/AuditOutcome'
        - name: from
          in: query
          required: false
          description: 언제부터. 설치 설정의 시간대에서 이 날짜의 첫 순간부터다
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 언제까지. 설치 설정의 시간대에서 이 날짜의 끝까지다 (이 날짜를 포함한다). from 보다 앞설 수 없다
          schema:
            type: string
            format: date
        - name: maxId
          in: query
          required: false
          description: 일련번호(id)의 위쪽 끝. 이 번호까지의 줄만 준다 (이 번호를 포함한다). 첫 쪽의 맨 위 줄의 id 를 붙들어 다음 쪽부터 보내면, 넘기는 사이에 남은 줄 때문에 목록이 밀리지 않는다
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 조건에 맞는 줄을 나눠 돌려준다. total 은 조건에 맞는 줄의 전체 수다. 맞는 것이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecordList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/session:
    get:
      operationId: getSession
      summary: 지금 로그인한 사람을 돌려준다
      description: 화면이 처음 열릴 때 로그인했는지 알아보는 데 쓴다. 이 응답과 함께 XSRF-TOKEN 쿠키가 온다
      responses:
        '200':
          description: 로그인한 사람
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      operationId: login
      summary: 아이디와 비밀번호로 로그인한다
      description: >-
        성공하면 세션 쿠키를 준다. 아이디가 없는 것, 비밀번호가 틀린 것, 여러 번 틀려 잠시 막힌 것을
        응답으로 가리지 않는다 (계정이 있는지를 알려 주지 않는다). X-XSRF-TOKEN 헤더가 있어야 한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인한 사람
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: logout
      summary: 로그아웃한다
      description: 세션을 끝낸다. 로그인하지 않은 채로 불러도 204 다
      responses:
        '204':
          description: 세션이 끝났다
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/packs:
    get:
      operationId: listPacks
      summary: 적재된 Pack 과 그 입력 자료의 목록을 돌려준다
      description: >-
        판을 올릴 때 Pack 과 입력 자료를 고르는 데 쓴다. 입력 자료마다 지금의 가장 새 판을 함께 준다:
        다음에 올리는 판의 적용일은 그 판의 적용일보다 늦어야 한다. 담당자와 관리자가 부를 수 있다
      responses:
        '200':
          description: >-
            Pack 의 순서는 Pack 의 id 의 글자 코드 순이고, 입력 자료의 순서는 입력 자료의 id 의 글자 코드 순이다.
            적재된 Pack 이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/pack-definition:
    get:
      operationId: getPackDefinition
      summary: 적재된 Pack 하나의 정의를 읽는다
      description: >-
        개체 유형, 속성, 관계 유형과 영향 방향, 입력 자료와 매핑, 규칙, 제약을 한 번에 준다. 읽기만 한다: 정의를 고치는
        API 는 없다 (고치려면 Pack 의 파일을 고쳐 다시 적재한다). 목록의 순서는 이름의 글자 코드 순이고 규칙은 번호 순,
        입력 자료는 식별자 순이다. 담당자와 관리자가 부를 수 있다
      parameters:
        - name: packId
          in: query
          required: true
          description: Pack 의 식별자
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 그 Pack 의 정의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackDefinition'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/verification-results:
    get:
      operationId: getVerificationResults
      summary: 적재된 Pack 의 검증 질문을 지금의 저장소에 물어 질문마다의 통과와 실패를 돌려준다
      description: >-
        읽기만 한다: 자료를 바꾸지 않고 결과를 저장하지 않는다. 질문은 서버의 Pack 폴더의 그 Pack 의 questions/ 에서
        읽는다 (전수 대조는 돌리지 않는다). 시나리오마다, 저장소의 그 Pack 의 판이 시나리오의 단계와 꼭 같을 때만
        묻는다 (입력 자료, 판 번호, 적용일, 파일의 내용, 받은 차례). 다르면 그 시나리오는 통과와 실패를 내지 않고
        matched 가 false 이며 어느 단계가 다른지를 mismatch 에 적는다. 견주는 코드는 명령줄 실행기와 같다. 두 번
        물어 답이 같은지도 함께 준다. 관리자만 부를 수 있다
      parameters:
        - name: packId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 시나리오마다의 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResults'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/pack-folders:
    get:
      operationId: listPackFolders
      summary: 서버의 Pack 폴더에 놓인 Pack 의 폴더를 읽는다 (관리자만)
      description: >-
        적재할 수 있는 것을 고르는 데 쓴다. 폴더의 이름과 이미 적재됐는지만 준다: 폴더 안을 읽어 검증하지 않는다
        (Pack 으로 맞는지는 적재할 때 안다). 적재가 받는 이름(영어 소문자, 숫자, 붙임표)의 폴더만 담는다. 파일, 숨은 폴더,
        바로가기는 담지 않는다. 순서는 이름의 글자 코드 순이다. 서버의 폴더 경로를 담지 않는다.
        관리자만 부를 수 있다
      responses:
        '200':
          description: 폴더의 목록. 서버에 Pack 폴더가 정해져 있지 않으면 configured 가 false 이고 목록은 비어 있다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackFolderList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/pack-loads:
    post:
      operationId: loadPack
      summary: 서버의 Pack 폴더에 있는 Pack 하나를 적재한다
      description: >-
        관리자만 부를 수 있다. 설치할 때 정한 Pack 폴더(설치 설정 tabnit.packs-dir) 바로 아래의 폴더를 이름으로 고른다.
        폴더의 이름이 Pack 의 id 다. 서버가 그 폴더를 읽어 검증하고 정의를 적재한다. 문제가 하나라도 있으면 아무것도
        적재하지 않는다. 같은 Pack 을 다시 적재하면 바뀐 것만 고친다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackLoadRequest'
      responses:
        '200':
          description: 적재한 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackLoad'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/editions:
    get:
      operationId: listEditions
      summary: Pack 에 받아들인 판의 목록을 최근에 받은 것부터 돌려준다
      description: >-
        지난 판을 다시 보는 데 쓴다. 받아들인 판만 나온다: 거부된 투입과 내용이 같아 판이 되지 않은 투입은 나오지 않는다.
        담당자와 관리자가 부를 수 있다
      parameters:
        - name: packId
          in: query
          required: true
          description: Pack 의 식별자
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            판을 나눠 돌려준다: offset 만큼 건너뛰고 limit 개까지 준다. total 은 그 Pack 의 판의 전체 수다.
            순서는 받은 때가 늦은 것부터이고, 같으면 입력 자료의 id 의 글자 코드 순, 그 안에서 판 번호가 큰 것부터다.
            판이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      operationId: submitEdition
      summary: 파일 하나를 입력 자료의 새 판으로 올리고, 바뀐 항목과 그 처리 결과를 돌려준다
      description: >-
        받아들인 판은 앞 판과 비교해 바뀐 항목(변동)을 찾고, 이어서 변동마다 영향 범위를 계산해
        조치를 만들어 저장한다. 응답이 오면 그 판의 조치가 만들어져 있다.
        한 Pack 에서는 한 번에 하나만 처리한다. 뒤에 온 요청은 앞의 것이 끝날 때까지 기다린다.
        담당자와 관리자가 부를 수 있다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [packId, inputSourceId, effectiveDate, file]
              properties:
                packId:
                  type: string
                  minLength: 1
                  description: Pack 의 식별자
                inputSourceId:
                  type: string
                  minLength: 1
                  description: 입력 자료의 식별자. 그 Pack 의 매핑 가운데 하나다
                effectiveDate:
                  type: string
                  format: date
                  description: 판의 적용일. 이 날부터 새 판의 내용이 유효하다
                file:
                  type: string
                  format: binary
                  description: 올리는 파일. 파일의 이름은 기록에 남긴다
      responses:
        '200':
          description: >-
            판을 받아들였거나(ACCEPTED), 내용이 바로 앞 판과 같아 판을 만들지 않았다(UNCHANGED).
            changes 의 순서는 항목의 키의 글자 코드 순이다. notices 의 순서는 행 번호, 종류, 코드, 내용 순이다.
            retriedChanges 의 순서는 처리한 차례다 (판을 받은 차례, 받은 때가 같으면 입력 자료의 id 순과 판 번호 순, 그 안에서 항목의 키의 글자 코드 순)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionSubmission'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          description: >-
            파일을 받아들이지 않았다. 판은 만들어지지 않았고 투입 기록에 거부로 남았다.
            공통 오류 형식에 거부한 이유의 코드(reasonCode)와 값(reasonDetail)을 더해 담는다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EditionRejectedProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/edition:
    get:
      operationId: getEdition
      summary: 지난 판 하나의 바뀐 항목과 그 처리 상태와 알림을, 올린 직후의 답과 같은 모양으로 돌려준다
      description: >-
        저장된 것을 읽어 돌려준다. 다시 계산하지 않는다. 담당자와 관리자가 부를 수 있다
      parameters:
        - name: editionId
          in: query
          required: true
          description: 판의 id. 서버가 준 것을 그대로 보낸다
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: >-
            판 올리기의 답과 같은 모양이다. outcome 은 ACCEPTED, retriedChanges 는 빈 목록, processingNotStarted 는
            false 다. changes 의 처리 상태와 조치의 수는 지금 저장된 값이다 (올린 뒤에 다시 처리됐으면 그 결과다).
            개체의 표시 이름은 그 판의 적용일의 값이다. 순서는 판 올리기의 답과 같다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionSubmission'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/edition-comparison:
    get:
      operationId: compareEditions
      summary: 같은 입력 자료의 두 판을 견줘 추가, 변경, 삭제된 항목과 값의 앞뒤를 돌려준다
      description: >-
        읽기만 한다: 견준 것을 저장하지 않고 변동 이벤트, 영향 범위, 조치를 만들지 않는다. 판마다 저장된 기록
        (그 행이 무엇을 만들었는가)을 판을 올릴 때와 같은 계산으로 견준다. 그래서 바로 앞 판과 견준 결과는 그 판을
        올릴 때 저장한 변동과 같다. 적힌 방향 그대로 견준다: 뒤의 판을 앞에 적으면 추가와 삭제, 값의 앞뒤가 거꾸로다.
        값이 바뀌었다가 되돌아온 속성은 변경으로 나오고 앞뒤의 값이 같다 (끊긴 뒤 새로 만든 값이다).
        담당자와 관리자가 부를 수 있다
      parameters:
        - name: fromEditionId
          in: query
          required: true
          description: 앞에 적는 판의 id. 견주는 기준이다
          schema:
            type: string
            minLength: 1
        - name: toEditionId
          in: query
          required: true
          description: 뒤에 적는 판의 id. 앞의 판과 같은 Pack 의 같은 입력 자료의 것이어야 한다. 앞의 판과 같으면 바뀐 것이 없다
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 두 판과 바뀐 항목. 순서는 항목의 키의 글자 코드 순이다. 바뀐 것이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionComparison'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/change-events:
    get:
      operationId: listChangeEvents
      summary: Pack 의 변동 이벤트를 판을 거치지 않고 목록으로 돌려준다
      description: >-
        줄마다 변동이 나온 판, 상태, 조치의 수, 저장된 영향 범위의 영향 대상의 수가 있다. 변동마다 영향 범위가 하나이므로
        이 목록이 영향 범위의 이력이기도 하다. 순서는 가장 최근에 받은 판의 변동부터이고 (판의 목록과 같은 차례),
        한 판 안에서는 항목의 키의 글자 코드 순이다. 변동 대상과 바뀐 값은 담지 않는다: 판 하나(getEdition)에서 본다.
        담당자와 관리자가 부를 수 있다
      parameters:
        - name: packId
          in: query
          required: true
          description: Pack 의 식별자
          schema:
            type: string
            minLength: 1
        - name: status
          in: query
          required: false
          description: 이 상태의 변동만. 없으면 모든 상태
          schema:
            type: string
            enum: [PENDING, PROCESSED, FAILED]
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 변동 이벤트를 나눠 돌려준다. total 은 거른 변동의 전체 수다. 변동이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEventList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/unprocessed-changes:
    get:
      operationId: listUnprocessedChanges
      summary: Pack 의 처리되지 않은 변동(실패, 대기)을 실패한 까닭과 함께 본다
      description: >-
        판을 올리면 바뀐 항목마다 영향 범위를 계산하고 규칙을 실행한다. 그 처리에 실패했거나 아직 하지 못한 변동이
        여기에 나온다. 처리된 변동은 나오지 않는다. 순서는 처리하는 차례다: 판을 받은 차례, 그 안에서는 항목의 키의
        글자 코드 순
      parameters:
        - name: packId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 처리되지 않은 변동. 없으면 빈 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessedChangeList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/change-reprocessings:
    post:
      operationId: reprocessChanges
      summary: Pack 의 처리되지 않은 변동을 지금의 자료와 지금의 규칙으로 다시 처리한다
      description: >-
        관리자만 부를 수 있다. 그 Pack 의 처리되지 않은 변동(실패, 대기)을 모두, 정해진 차례로 처음부터 다시 계산한다.
        Pack 이나 자료를 고친 뒤에 부른다. 변동 하나가 다시 실패해도 나머지는 처리한다. 처리할 것이 없으면 빈 목록이다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReprocessingRequest'
      responses:
        '200':
          description: 다시 처리한 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeReprocessing'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/actions:
