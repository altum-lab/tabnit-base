          description: 행이 한 번에 내보내는 한도를 넘는다 (EXPORT_TOO_LARGE). 일부만 담은 파일을 주지 않는다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/impact-target-exports:
    get:
      operationId: exportImpactTargets
      summary: 변동 이벤트의 저장된 영향 범위의 영향 대상을 파일로 내보낸다
      description: >-
        순서는 getChangeImpactScope 의 영향 대상과 같고 offset, limit 이 없다. 대상마다 근거 경로를 함께 담는다.
        담당자와 관리자가 부를 수 있다
      parameters:
        - name: changeEventId
          in: query
          required: true
          description: 변동 이벤트의 id
          schema:
            type: string
            minLength: 1
        - name: format
          in: query
          required: true
          description: 파일의 형식. csv 또는 json
          schema:
            type: string
            enum: [csv, json]
      responses:
        '200':
          description: >-
            영향 대상의 파일이다 (Content-Disposition 이 attachment 이고 파일 이름을 준다). 나누지 않는다: 그 조건의 전체를 담는다.
            순서는 목록의 API 와 같다. json 은 목록의 답과 같은 모양이고 offset 은 0, limit 은 한 번에 내보내는 행의 한도다.
            csv 는 UTF-8 (맨 앞에 BOM), 쉼표, CRLF 이고 첫 행이 머리 행이다. 같은 목록에서는 글자까지 같은 파일이다
          content:
