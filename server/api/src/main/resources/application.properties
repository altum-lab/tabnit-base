spring.application.name=tabnit-api

# 조회 시점이 없는 요청에 넣는 "오늘"을 정하는 시간대 (D2 AD-40). 설치할 때 정한다. 적지 않으면 Asia/Seoul 이다.
# tabnit.time-zone=Asia/Seoul

# 올리는 파일 크기의 한도 (D7 5절). 설치할 때 정한다. 서버가 요청을 받을 때와 판을 투입할 때 같은 값을 쓴다.
# 요청 전체의 한도는 파일 말고 다른 항목의 몫을 조금 더 둔다. 한도를 바꾸면 둘을 함께 바꾼다.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# 로그인과 세션 (D7 9절).
# 세션은 서버의 메모리에 둔다. 이 시간 동안 요청이 없으면 끝나고 다시 로그인한다 (D2 AD-266).
server.servlet.session.timeout=30m
# 세션 쿠키: 스크립트가 읽지 못하고, 같은 사이트에서만 보내며, HTTPS 로만 보낸다.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
# 같은 아이디로 잇달아 이만큼 틀리면 이 시간 동안 그 아이디의 로그인을 막는다 (D2 AD-265). 적지 않으면 5번, 15분이다.
# tabnit.login.max-failures=5
# tabnit.login.lock-duration=15m
