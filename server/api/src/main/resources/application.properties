spring.application.name=tabnit-api

# 조회 시점이 없는 요청에 넣는 "오늘"을 정하는 시간대 (D2 AD-40). 설치할 때 정한다. 적지 않으면 Asia/Seoul 이다.
# tabnit.time-zone=Asia/Seoul

# 올리는 파일 크기의 한도 (D7 5절). 설치할 때 정한다. 서버가 요청을 받을 때와 판을 투입할 때 같은 값을 쓴다.
# 요청 전체의 한도는 파일 말고 다른 항목의 몫을 조금 더 둔다. 한도를 바꾸면 둘을 함께 바꾼다.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
