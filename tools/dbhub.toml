# Claude Code 가 개발용 PostgreSQL 을 "읽기 전용"으로 보게 하는 설정 (DBHub MCP 서버).
# 대상은 내 Mac 의 개발 컨테이너뿐이다. 가상 데이터만 들어 있다. 고객 DB, 시연 서버 DB 를 여기에 적지 않는다.
# 포트 54329 는 scripts/04-claude.sh 가 server/api/compose.yaml 에 고정해 둔 값이다.
# 비밀번호는 여기에 적지 않는다. .mcp.json 이 환경 변수 TABNIT_DEV_DB_PASSWORD 로 넘긴다
# (없으면 Spring Initializr 가 compose.yaml 에 넣는 개발용 기본값을 쓴다).

[[sources]]
id = "tabnit_dev"
description = "Tabnit Base 개발용 PostgreSQL (내 Mac 컨테이너, 가상 데이터)"
type = "postgres"
host = "localhost"
port = 54329
database = "mydatabase"
user = "myuser"
password = "${TABNIT_DEV_DB_PASSWORD}"
sslmode = "disable"

# 조회만 허용. 스키마 변경은 Flyway 파일(V번호__설명.sql)로만 한다.
[[tools]]
name = "execute_sql"
source = "tabnit_dev"
readonly = true
max_rows = 500

[[tools]]
name = "search_objects"
source = "tabnit_dev"

# 실행 계획만 보여 주고 실행하지 않는다. 재귀 질의와 색인 점검(A-04, A-07)에 쓴다.
[[tools]]
name = "explain_sql"
source = "tabnit_dev"
