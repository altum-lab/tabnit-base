# Tabnit Base 의 API 규격. 기준 문서는 docs/D7-api-contract.md 다.
# 이 파일을 먼저 고치고 구현한다. 화면의 호출 코드는 이 파일에서 만든다 (D2 AD-09, AD-77).
# 상태: 초안. 지금은 시점 조회, 판 올리기, 조치 목록, 변동의 영향 범위, 조치 하나와 이력, 확정과 보류, Pack 과 입력 자료의 목록, 로그인과 세션, Pack 적재가 들어 있다.
openapi: 3.1.0
info:
  title: Tabnit Base API
  version: 0.1.0
  description: >-
    관계를 읽는 모든 API 는 조회 시점(asOf)을 받고, 응답에 어느 날짜로 답했는지 담는다.
    목록의 순서는 서버가 정하며 화면은 바꾸지 않는다.
    로그인(POST /api/v1/session) 말고는 모두 로그인해야 부를 수 있다. 로그인하면 서버가 세션 쿠키를 준다.
    바꾸는 요청(POST, DELETE 등)에는 서버가 XSRF-TOKEN 쿠키로 준 값을 X-XSRF-TOKEN 헤더에 실어 보낸다.
    로그인하지 않았으면 401 (UNAUTHENTICATED), 그 헤더가 없거나 틀리면 403 (FORBIDDEN)이다.
    역할은 관리자(ADMIN)와 담당자(OFFICER) 둘이다. 관리자는 담당자의 일을 모두 한다. Pack 적재는 관리자만 한다.
    할 수 없는 일을 부르면 403 (FORBIDDEN)이다.
paths:
  /api/v1/relations:
    get:
      operationId: getRelationsAsOf
      summary: 개체의 관계 가운데 조회 시점에 유효한 것을 돌려준다
      parameters:
        - name: entityId
          in: query
          required: true
          description: 개체의 id. 서버가 준 값을 그대로 보낸다
          schema:
            type: string
            minLength: 1
        - name: asOf
          in: query
          required: false
          description: 조회 시점. 없으면 설치 설정의 시간대에서의 오늘
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            조회 시점에 유효한 관계. 개체가 출발 쪽이든 도착 쪽이든 들어 있다.
            순서는 관계 유형, 상대 개체의 id, 관계의 id 차례이고 모두 글자 코드 순이다.
            유효한 것이 없으면 빈 목록이다. 나눠 준다: offset 만큼 건너뛰고 limit 개까지 준다.
            total 은 나누기 전의 전체 수다. 나눠 받은 것을 이으면 한 번에 받은 것과 순서까지 같다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationsAsOf'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/session:
    get:
      operationId: getSession
      summary: 지금 로그인한 사람을 돌려준다
      description: 화면이 처음 열릴 때 로그인했는지 알아보는 데 쓴다. 이 응답과 함께 XSRF-TOKEN 쿠키가 온다
      responses:
        '200':
          description: 로그인한 사람
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    post:
      operationId: login
      summary: 아이디와 비밀번호로 로그인한다
      description: >-
        성공하면 세션 쿠키를 준다. 아이디가 없는 것, 비밀번호가 틀린 것, 여러 번 틀려 잠시 막힌 것을
        응답으로 가리지 않는다 (계정이 있는지를 알려 주지 않는다). X-XSRF-TOKEN 헤더가 있어야 한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인한 사람
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: logout
      summary: 로그아웃한다
      description: 세션을 끝낸다. 로그인하지 않은 채로 불러도 204 다
      responses:
        '204':
          description: 세션이 끝났다
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/packs:
    get:
      operationId: listPacks
      summary: 적재된 Pack 과 그 입력 자료의 목록을 돌려준다
      description: >-
        판을 올릴 때 Pack 과 입력 자료를 고르는 데 쓴다. 입력 자료마다 지금의 가장 새 판을 함께 준다:
        다음에 올리는 판의 적용일은 그 판의 적용일보다 늦어야 한다. 담당자와 관리자가 부를 수 있다
      responses:
        '200':
          description: >-
            Pack 의 순서는 Pack 의 id 의 글자 코드 순이고, 입력 자료의 순서는 입력 자료의 id 의 글자 코드 순이다.
            적재된 Pack 이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/pack-loads:
    post:
      operationId: loadPack
      summary: 서버의 Pack 폴더에 있는 Pack 하나를 적재한다
      description: >-
        관리자만 부를 수 있다. 설치할 때 정한 Pack 폴더(설치 설정 tabnit.packs-dir) 바로 아래의 폴더를 이름으로 고른다.
        폴더의 이름이 Pack 의 id 다. 서버가 그 폴더를 읽어 검증하고 정의를 적재한다. 문제가 하나라도 있으면 아무것도
        적재하지 않는다. 같은 Pack 을 다시 적재하면 바뀐 것만 고친다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackLoadRequest'
      responses:
        '200':
          description: 적재한 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackLoad'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/editions:
    post:
      operationId: submitEdition
      summary: 파일 하나를 입력 자료의 새 판으로 올리고, 바뀐 항목과 그 처리 결과를 돌려준다
      description: >-
        받아들인 판은 앞 판과 비교해 바뀐 항목(변동)을 찾고, 이어서 변동마다 영향 범위를 계산해
        조치를 만들어 저장한다. 응답이 오면 그 판의 조치가 만들어져 있다.
        한 Pack 에서는 한 번에 하나만 처리한다. 뒤에 온 요청은 앞의 것이 끝날 때까지 기다린다.
        담당자와 관리자가 부를 수 있다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [packId, inputSourceId, effectiveDate, file]
              properties:
                packId:
                  type: string
                  minLength: 1
                  description: Pack 의 식별자
                inputSourceId:
                  type: string
                  minLength: 1
                  description: 입력 자료의 식별자. 그 Pack 의 매핑 가운데 하나다
                effectiveDate:
                  type: string
                  format: date
                  description: 판의 적용일. 이 날부터 새 판의 내용이 유효하다
                file:
                  type: string
                  format: binary
                  description: 올리는 파일. 파일의 이름은 기록에 남긴다
      responses:
        '200':
          description: >-
            판을 받아들였거나(ACCEPTED), 내용이 바로 앞 판과 같아 판을 만들지 않았다(UNCHANGED).
            changes 의 순서는 항목의 키의 글자 코드 순이다. notices 의 순서는 행 번호, 종류, 코드, 내용 순이다.
            retriedChanges 의 순서는 처리한 차례다 (판을 받은 차례, 받은 때가 같으면 입력 자료의 id 순과 판 번호 순, 그 안에서 항목의 키의 글자 코드 순)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionSubmission'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          description: >-
            파일을 받아들이지 않았다. 판은 만들어지지 않았고 투입 기록에 거부로 남았다.
            공통 오류 형식에 거부한 이유의 코드(reasonCode)와 값(reasonDetail)을 더해 담는다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EditionRejectedProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/unprocessed-changes:
    get:
      operationId: listUnprocessedChanges
      summary: Pack 의 처리되지 않은 변동(실패, 대기)을 실패한 까닭과 함께 본다
      description: >-
        판을 올리면 바뀐 항목마다 영향 범위를 계산하고 규칙을 실행한다. 그 처리에 실패했거나 아직 하지 못한 변동이
        여기에 나온다. 처리된 변동은 나오지 않는다. 순서는 처리하는 차례다: 판을 받은 차례, 그 안에서는 항목의 키의
        글자 코드 순
      parameters:
        - name: packId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 처리되지 않은 변동. 없으면 빈 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessedChangeList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/change-reprocessings:
    post:
      operationId: reprocessChanges
      summary: Pack 의 처리되지 않은 변동을 지금의 자료와 지금의 규칙으로 다시 처리한다
      description: >-
        관리자만 부를 수 있다. 그 Pack 의 처리되지 않은 변동(실패, 대기)을 모두, 정해진 차례로 처음부터 다시 계산한다.
        Pack 이나 자료를 고친 뒤에 부른다. 변동 하나가 다시 실패해도 나머지는 처리한다. 처리할 것이 없으면 빈 목록이다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReprocessingRequest'
      responses:
        '200':
          description: 다시 처리한 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeReprocessing'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/actions:
    get:
      operationId: listActions
      summary: Pack 의 조치 목록을 근거 조항과 그 판과 함께 돌려준다
      description: 담당자와 관리자가 부를 수 있다
      parameters:
        - name: packId
          in: query
          required: true
          description: Pack 의 식별자
          schema:
            type: string
            minLength: 1
        - name: status
          in: query
          required: false
          description: 이 상태의 조치만. 없으면 가리지 않는다
          schema:
            $ref: '#/components/schemas/ActionStatus'
        - name: changeEventId
          in: query
          required: false
          description: 이 변동 이벤트에서 나온 조치만. 서버가 준 id 를 그대로 보낸다. 없으면 가리지 않는다
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            거른 조치를 나눠 돌려준다: offset 만큼 건너뛰고 limit 개까지 준다. total 은 거른 조치의 전체 수다.
            순서는 기한이 이른 것부터이고, 같으면 우선순위(수가 작은 것부터),
            규칙 번호, 대상 개체의 id, 조치의 id 차례다. 글자는 모두 글자 코드 순이다.
            해당하는 것이 없으면 빈 목록이다. 그 Pack 의 것이 아닌 변동 이벤트로 거르면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/action:
    get:
      operationId: getAction
      summary: 조치 하나를 그 이력과 함께 돌려준다
      description: 담당자와 관리자가 부를 수 있다
      parameters:
        - name: actionId
          in: query
          required: true
          description: 조치의 id. 서버가 준 값을 그대로 보낸다
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 조치와 그 이력. 이력의 순서는 상태를 바꾼 차례다. 아직 아무도 바꾸지 않았으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/action-decisions:
    post:
      operationId: decideAction
      summary: 조치를 확정하거나 보류한다
      description: >-
        대기인 조치는 확정하거나 보류할 수 있고, 보류인 조치는 확정할 수 있다. 확정은 되돌릴 수 없다.
        누가 했는지와 언제 했는지는 요청에서 받지 않는다. 서버가 로그인한 사람과 서버의 시각으로 채워 이력에 남긴다.
        지금의 상태로 바꾼 바로 그 사람이 같은 동작을 다시 보내면 (응답을 받지 못해 다시 누른 경우) 아무것도 바꾸지 않고
        성공으로 답한다. 새 이력은 남지 않고 처음의 사유가 남는다.
        담당자가 부른다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionDecisionRequest'
      responses:
        '200':
          description: >-
            바뀐 조치와 그 이력. 이력의 마지막 줄이 방금 한 것이다.
            같은 사람이 같은 동작을 다시 보낸 것이면 처음 한 것이 마지막 줄이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: >-
            지금의 상태에서는 그렇게 바꿀 수 없다 (다른 사람이 이미 확정한 조치, 다른 사람이 보류한 조치를 다시 보류,
            확정된 조치를 보류). 아무것도 바뀌지 않았다. 공통 오류 형식에 조치의 지금 상태와 마지막 이력을 더해 담는다.
            자기가 바꾼 뒤 응답을 받지 못해 같은 동작을 다시 보낸 것은 이 응답이 아니라 200 이다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ActionDecisionConflictProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/impact-scopes:
    get:
      operationId: getChangeImpactScope
      summary: 변동 이벤트 하나의 저장된 영향 범위를 근거 경로와 함께 돌려준다
      description: >-
        판을 올린 직후에 그때의 자료로 한 번 계산해 저장한 것이다. 뒤에 자료가 바뀌어도 달라지지 않는다.
        판의 적용일 전날과 적용일, 두 날짜의 관계로 따라간 결과를 합친 것이다.
        조치의 근거 경로는 여기서 그 조치의 대상(entityId)으로 찾는다. 담당자와 관리자가 부를 수 있다
      parameters:
        - name: changeEventId
          in: query
          required: true
          description: 변동 이벤트의 id. 서버가 준 값을 그대로 보낸다
          schema:
            type: string
            minLength: 1
        - name: entityId
          in: query
          required: false
          description: >-
            이 개체인 영향 대상만 준다 (조치의 근거 경로를 찾을 때 쓴다). 그 개체가 영향 대상이 아니면 targets 는
            빈 목록이다. total, countsByType, countsByDepth 는 거르지 않은 영향 범위의 값 그대로다
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            영향 대상을 나눠 돌려준다: offset 만큼 건너뛰고 limit 개까지 준다. total 과 countsByType, countsByDepth 는
            나누기 전의 영향 범위 전체의 값이다. 영향 대상의 순서는 깊이, 개체 유형, 개체의 id 차례다. countsByType 은 개체 유형의 글자 코드 순,
            countsByDepth 는 깊이 순이다. 경로의 단계는 변동 대상 쪽부터의 차례다.
            영향 대상이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImpactScope'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Offset:
      name: offset
      in: query
      required: false
      description: 건너뛸 수. 없으면 0. 전체 수와 같거나 크면 빈 목록이다
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      description: 한 번에 받을 수. 없으면 50. 1 부터 200 까지
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Problem:
      description: 공통 오류 형식 (RFC 9457 에 code 와 field 를 더한 것)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RelationsAsOf:
      type: object
      required: [asOf, entityId, total, offset, limit, relations]
      properties:
        asOf:
          type: string
          format: date
          description: 답에 쓴 날짜. 요청에 asOf 가 있었든 없었든 담는다
        entityId:
          type: string
        total:
          type: integer
          minimum: 0
          description: 조회 시점에 유효한 관계의 전체 수. 나누기 전의 수다. 화면은 다시 세지 않는다
        offset:
          type: integer
          minimum: 0
          description: 답에 쓴 건너뛴 수
        limit:
          type: integer
          minimum: 1
          description: 답에 쓴 한 번에 주는 수
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
    Relation:
      type: object
      required: [id, relationType, sourceEntityId, targetEntityId, source, target, validFrom, validTo, provenance, recordedAt]
      properties:
        id:
          type: string
        relationType:
          type: string
        sourceEntityId:
          type: string
          description: 출발 개체의 id
        targetEntityId:
          type: string
          description: 도착 개체의 id
        source:
          description: 출발 개체. 표시 이름은 조회 시점의 값이다
          $ref: '#/components/schemas/EntityRef'
        target:
          description: 도착 개체. 표시 이름은 조회 시점의 값이다
          $ref: '#/components/schemas/EntityRef'
        validFrom:
          type: string
          format: date
          description: 시작일. 포함한다
        validTo:
          type: [string, 'null']
          format: date
          description: 종료일. 제외한다. null 이면 계속 유효하다
        provenance:
          $ref: '#/components/schemas/Provenance'
        recordedAt:
          type: string
          format: date-time
          description: 기록한 때 (협정 세계시)
    Provenance:
      type: object
      description: 출처. 어느 입력 자료의 어느 판에서 왔는가
      required: [inputSourceId, editionNo]
      properties:
        inputSourceId:
          type: string
        editionNo:
          type: integer
          minimum: 1
    Session:
      type: object
      description: 로그인한 사람
      required: [loginId, role, timeZone]
      properties:
        loginId:
          type: string
          description: 아이디
        role:
          type: string
          enum: [ADMIN, OFFICER]
          description: 역할. ADMIN 관리자, OFFICER 담당자
        timeZone:
          type: string
          description: >-
            설치 설정의 시간대 (예. Asia/Seoul). 화면은 시각을 이 시간대로 바꿔 보여 준다.
            API 의 시각은 모두 협정 세계시 그대로다. 서버가 조회 시점의 "오늘"을 정할 때 쓰는 시간대와 같다
    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          description: 비밀번호. 서버는 이 값을 저장하거나 기록에 남기지 않는다
    PackLoadRequest:
      type: object
      required: [packId]
      properties:
        packId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z0-9-]+$'
          description: 적재할 Pack 의 id. 서버의 Pack 폴더 바로 아래에 있는 폴더의 이름이다
    PackLoad:
      type: object
      required: [packId, outcome, warnings]
      properties:
        packId:
          type: string
        outcome:
          type: string
          enum: [LOADED, UPDATED, UNCHANGED]
          description: LOADED 처음 적재했다. UPDATED 이미 있던 정의를 고친 것으로 바꿨다. UNCHANGED 이미 있는 것과 같아 바꾸지 않았다
        warnings:
          type: array
          description: >-
            경고. 적재를 막지 않는다: Pack 은 적재됐다. 뜻대로 동작하지 않을 수 있는 곳을 알린다.
            pack 이 준 순서 그대로다 (규칙의 경고는 규칙 번호 순). 없으면 빈 목록이다.
            같은 Pack 을 다시 적재해 바뀐 것이 없어도 같은 경고가 나온다
          items:
            $ref: '#/components/schemas/PackWarning'
    PackWarning:
      type: object
      description: Pack 을 적재하면서 알리는 경고 하나
      required: [file, item, message]
      properties:
        file:
          type: string
          description: Pack 폴더 안에서의 자리. 규칙의 경고는 rules 다
        item:
          type: string
          description: 경고의 대상. 규칙의 경고는 규칙 번호다
        message:
          type: string
          description: 사용자에게 보이는 문구. 무엇이 왜 걸리는지와 무엇을 하면 되는지를 담는다
    PackProblem:
      type: object
      description: Pack 에서 찾은 문제 하나
      required: [file, item, message]
      properties:
        file:
          type: string
          description: Pack 폴더 안에서의 파일 이름. 폴더 자체의 문제면 빈 글자
        item:
          type: string
          description: 틀린 항목. 정의의 이름이다
        message:
          type: string
          description: 무엇이 틀렸고 어떻게 고치면 되는지
    PackList:
      type: object
      required: [packs]
      properties:
        packs:
          type: array
          items:
            $ref: '#/components/schemas/PackSummary'
    PackSummary:
      type: object
      required: [packId, label, inputSources]
      properties:
        packId:
          type: string
          description: Pack 의 id
        label:
          type: string
          description: Pack 의 이름
        inputSources:
          type: array
          description: 그 Pack 이 받는 입력 자료. 매핑이 하나도 없는 Pack 이면 비어 있다
          items:
            $ref: '#/components/schemas/InputSourceSummary'
    InputSourceSummary:
      type: object
      required: [inputSourceId, fileFormat, latestEdition]
      properties:
        inputSourceId:
          type: string
          description: 입력 자료의 id
        fileFormat:
          type: string
          enum: [CSV, XLSX]
          description: 받는 파일의 형식
        latestEdition:
          description: 지금의 가장 새 판. 아직 판이 없으면 null
          oneOf:
            - $ref: '#/components/schemas/EditionSummary'
            - type: 'null'
    EditionSummary:
      type: object
      required: [editionId, editionNo, effectiveDate]
      properties:
        editionId:
          type: string
        editionNo:
          type: integer
          minimum: 1
          description: 그 입력 자료 안에서의 판 번호
        effectiveDate:
          type: string
          format: date
          description: 그 판의 적용일
    ActionStatus:
      type: string
      enum: [PENDING, CONFIRMED, ON_HOLD]
      description: 조치의 상태. PENDING 대기, CONFIRMED 확정, ON_HOLD 보류
    EntityRef:
      type: object
      description: >-
        개체 하나. 화면은 표시 이름, 유형의 이름표, 키로 보여 준다. id 는 서버에 되돌려 보내는 값이다.
        표시 이름은 날짜에 따라 달라질 수 있다: 어느 날짜의 값인지는 이 개체가 든 응답이 정한다
        (관계 조회는 조회 시점, 조치와 영향 범위는 그 변동이 나온 판의 적용일)
      required: [entityId, entityType, entityTypeLabel, entityKey, displayName]
      properties:
        entityId:
          type: string
          description: 개체의 id
        entityType:
          type: string
          description: 개체 유형의 이름. Pack 이 정한 것
        entityTypeLabel:
          type: string
          description: 개체 유형의 이름표 (화면에 보일 이름). Pack 이 정한 것
        entityKey:
          type: string
          description: 입력의 키
        displayName:
          type: [string, 'null']
          description: >-
            표시 이름. Pack 이 그 유형의 표시 이름으로 정한 속성의, 그 날짜에 유효한 값이다.
            Pack 이 정하지 않았거나 그 날짜에 값이 없으면 null 이고, 화면은 키를 보여 준다
    ActionList:
      type: object
      required: [packId, status, changeEventId, total, offset, limit, actions]
      properties:
        packId:
          type: string
        status:
          description: 거르는 데 쓴 상태. 가리지 않았으면 null
          oneOf:
            - $ref: '#/components/schemas/ActionStatus'
            - type: 'null'
        changeEventId:
          type: [string, 'null']
          description: 거르는 데 쓴 변동 이벤트의 id. 가리지 않았으면 null
        total:
          type: integer
          minimum: 0
          description: 거른 조치의 전체 수. 나누기 전의 수다. 화면은 다시 세지 않는다
        offset:
          type: integer
          minimum: 0
          description: 답에 쓴 건너뛴 수
        limit:
          type: integer
          minimum: 1
          description: 답에 쓴 한 번에 주는 수
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
    Action:
      type: object
      description: 조치 하나. 해야 할 일
      required: [id, changeEventId, ruleNo, ruleLabel, actionText, priority, dueDate, status, appliesTo, target, basis, createdAt]
      properties:
        id:
          type: string
          description: 조치의 id
        changeEventId:
          type: string
          description: 이 조치를 낳은 변동 이벤트의 id. 영향 범위를 볼 때 쓴다
        ruleNo:
          type: string
          description: 근거 규칙의 번호
        ruleLabel:
          type: string
          description: 조치를 만들 때의 그 규칙의 이름
        actionText:
          type: string
          description: 해야 할 일. 조치를 만들 때 규칙에 적혀 있던 문구 그대로다
        priority:
          type: integer
          minimum: 1
          description: 우선순위. 수가 작을수록 먼저다
        dueDate:
          type: string
          format: date
          description: 기한. 근거가 된 판의 적용일에 규칙이 적은 일수를 더한 날짜
        status:
          $ref: '#/components/schemas/ActionStatus'
        appliesTo:
          type: string
          enum: [IMPACT_TARGET, CHANGE_TARGET]
          description: >-
            대상이 영향 대상인가(IMPACT_TARGET), 바뀐 개체 자신인가(CHANGE_TARGET).
            IMPACT_TARGET 이면 그 변동의 영향 범위에 대상의 근거 경로가 있다. CHANGE_TARGET 이면 근거 경로가 없다
        target:
          $ref: '#/components/schemas/EntityRef'
        basis:
          $ref: '#/components/schemas/ActionBasis'
        createdAt:
          type: string
          format: date-time
          description: 만든 때 (협정 세계시)
    ActionDetail:
      type: object
      required: [action, history]
      properties:
        action:
          $ref: '#/components/schemas/Action'
        history:
          type: array
          description: 그 조치의 이력. 상태를 바꾼 차례다
          items:
            $ref: '#/components/schemas/ActionDecision'
    ActionDecision:
      type: object
      description: 조치의 이력 한 줄. 상태를 한 번 바꾼 것
      required: [seq, fromStatus, toStatus, decidedBy, decidedAt, note]
      properties:
        seq:
          type: integer
          minimum: 1
          description: 그 조치 안에서의 차례
        fromStatus:
          $ref: '#/components/schemas/ActionStatus'
        toStatus:
          $ref: '#/components/schemas/ActionStatus'
        decidedBy:
          type: string
          description: 누가 했는가. 사용자의 아이디
        decidedAt:
          type: string
          format: date-time
          description: 언제 했는가 (협정 세계시)
        note:
          type: [string, 'null']
          description: 사유. 없으면 null. 보류에는 반드시 있다
    ActionDecisionRequest:
      type: object
      required: [actionId, decision]
      properties:
        actionId:
          type: string
          minLength: 1
          description: 조치의 id. 서버가 준 값을 그대로 보낸다
        decision:
          type: string
          enum: [CONFIRM, HOLD]
          description: CONFIRM 확정, HOLD 보류
        note:
          type: [string, 'null']
          maxLength: 1000
          description: 사유. 보류에는 반드시 적는다. 확정에는 없어도 된다. 1,000자까지 (공백뿐이어도 한도는 같다). 눈에 보이는 글자가 없으면 없는 것으로 본다
    ActionDecisionConflictProblem:
      description: 공통 오류 형식에 조치의 지금 상태와 마지막 이력을 더했다
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [currentStatus, lastDecision]
          properties:
            currentStatus:
              $ref: '#/components/schemas/ActionStatus'
            lastDecision:
              description: 그 조치의 마지막 이력. 누가 언제 지금의 상태로 바꿨는가. currentStatus 와 같은 때에 읽은 것이다
              oneOf:
                - $ref: '#/components/schemas/ActionDecision'
                - type: 'null'
    ActionBasis:
      type: object
      description: 조치의 근거. 변동이 생긴 행의 주 개체(근거 조항)와, 그 변동이 나온 입력 자료의 판
      required: [entity, inputSourceId, editionNo, effectiveDate]
      properties:
        entity:
          $ref: '#/components/schemas/EntityRef'
        inputSourceId:
          type: string
        editionNo:
          type: integer
          minimum: 1
        effectiveDate:
          type: string
          format: date
          description: 그 판의 적용일
    ChangeImpactScope:
      type: object
      required: [changeEventId, packId, asOfPrevious, asOfEffective, maxDepth, truncated, storedAt, total, offset, limit, countsByType, countsByDepth, targets]
      properties:
        changeEventId:
          type: string
        packId:
          type: string
        asOfPrevious:
          type: string
          format: date
          description: 계산에 쓴 두 날짜 가운데 판의 적용일 전날
        asOfEffective:
          type: string
          format: date
          description: 판의 적용일
        maxDepth:
          type: integer
          minimum: 1
          description: 계산에 쓴 최대 깊이
        truncated:
          type: boolean
          description: 최대 깊이에서 멈췄고 그 너머에 아직 찾지 못한 대상이 있는가
        storedAt:
          type: string
          format: date-time
          description: 저장한 때 (협정 세계시)
        total:
          type: integer
          minimum: 0
          description: 영향 대상의 전체 수. 나누기 전의 수다. 변동 대상 자신은 세지 않는다
        offset:
          type: integer
          minimum: 0
          description: 답에 쓴 건너뛴 수
        limit:
          type: integer
          minimum: 1
          description: 답에 쓴 한 번에 주는 수
        countsByType:
          type: array
          description: 개체 유형별 수. 합계는 total 과 같다
          items:
            type: object
            required: [entityType, count]
            properties:
              entityType:
                type: string
              count:
                type: integer
                minimum: 1
        countsByDepth:
          type: array
          description: 깊이별 수. 합계는 total 과 같다
          items:
            type: object
            required: [depth, count]
            properties:
              depth:
                type: integer
                minimum: 1
              count:
                type: integer
                minimum: 1
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ImpactTarget'
    ImpactTarget:
      type: object
      description: 영향 대상 하나와 거기에 이른 근거 경로
      required: [entityId, entityType, entity, depth, path]
      properties:
        entityId:
          type: string
        entityType:
          type: string
          description: 개체 유형. 계산할 때의 값
        entity:
          description: 영향 대상인 개체. 표시 이름은 판의 적용일(asOfEffective)의 값이다
          $ref: '#/components/schemas/EntityRef'
        depth:
          type: integer
          minimum: 1
          description: 깊이. 가장 가까운 변동 대상에서 건넌 관계의 수. 경로의 단계의 수와 같다
        path:
          $ref: '#/components/schemas/ImpactPath'
    ImpactPath:
      type: object
      required: [startEntityId, start, asOf, steps]
      properties:
        startEntityId:
          type: string
          description: 경로가 시작한 변동 대상 개체의 id
        start:
          description: 경로가 시작한 변동 대상 개체. 표시 이름은 판의 적용일의 값이다
          $ref: '#/components/schemas/EntityRef'
        asOf:
          type: string
          format: date
          description: 이 경로의 관계가 모두 유효한 날짜. asOfPrevious 와 asOfEffective 가운데 하나다
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ImpactPathStep'
    ImpactPathStep:
      type: object
      description: 따라간 관계 하나. 계산할 때의 내용이다
      required: [stepNo, relationId, relationType, sourceEntityId, targetEntityId, source, target]
      properties:
        stepNo:
          type: integer
          minimum: 1
          description: 변동 대상 쪽부터의 차례
        relationId:
          type: string
        relationType:
          type: string
        sourceEntityId:
          type: string
          description: 그 관계의 출발 개체의 id. 관계에 적힌 방향이다 (따라간 방향이 아니다)
        targetEntityId:
          type: string
          description: 그 관계의 도착 개체의 id
        source:
          description: 그 관계의 출발 개체. 표시 이름은 판의 적용일의 값이다
          $ref: '#/components/schemas/EntityRef'
        target:
          description: 그 관계의 도착 개체. 표시 이름은 판의 적용일의 값이다
          $ref: '#/components/schemas/EntityRef'
    EditionSubmission:
      type: object
      required: [outcome, editionId, packId, inputSourceId, editionNo, effectiveDate, itemCount, changes, notices, retriedChanges, processingNotStarted]
      properties:
        outcome:
          type: string
          enum: [ACCEPTED, UNCHANGED]
          description: ACCEPTED 는 새 판을 만들었다. UNCHANGED 는 내용이 바로 앞 판과 같아 판을 만들지 않았다
        editionId:
          type: string
          description: 만든 판의 id. UNCHANGED 면 내용이 같았던 앞 판의 id
        packId:
          type: string
        inputSourceId:
          type: string
        editionNo:
          type: integer
          minimum: 1
          description: 그 입력 자료 안에서의 판 번호
        effectiveDate:
          type: string
          format: date
          description: 그 판의 적용일. UNCHANGED 면 앞 판의 것이다
        itemCount:
          type: integer
          minimum: 0
          description: 받아들인 항목(행)의 수. UNCHANGED 면 0
        changes:
          type: array
          description: 앞 판과 비교해 바뀐 항목. 첫 판이거나 UNCHANGED 면 비어 있다
          items:
            $ref: '#/components/schemas/EditionChange'
        notices:
          type: array
          description: 투입의 알림 (건너뛴 행 등). UNCHANGED 면 비어 있다
          items:
            $ref: '#/components/schemas/EditionNotice'
        retriedChanges:
          type: array
          description: 이 요청이 함께 다시 처리한, 앞선 판의 변동. 전에 처리에 실패해 남아 있던 것이다. 보통 비어 있다
          items:
            $ref: '#/components/schemas/RetriedChange'
        processingNotStarted:
          type: boolean
          description: >-
            판은 받아들였지만 변동의 처리를 시작하지 못했는가. true 면 changes 의 처리 상태는 모두 PENDING 이고,
            다음에 받아들여진 판을 올릴 때 처리된다
    EditionChange:
      type: object
      required: [changeEventId, itemKey, kind, primaryEntityId, targetEntityIds, processing]
      properties:
        changeEventId:
          type: string
          description: 변동 이벤트의 id
        itemKey:
          type: string
          description: 바뀐 항목의 키
        kind:
          type: string
          enum: [ADDED, CHANGED, REMOVED]
          description: 추가, 변경, 삭제
        primaryEntityId:
          type: string
          description: 그 행의 주 개체의 id. 조치의 근거가 된다
        targetEntityIds:
          type: array
          description: 변동 대상 개체의 id. 글자 코드 순이다
          items:
            type: string
        processing:
          $ref: '#/components/schemas/ChangeProcessing'
    ChangeProcessing:
      type: object
      description: 변동 하나를 영향 범위 계산과 조치 생성까지 처리한 결과
      required: [status, failedStage, failureCode, failures, actionCount]
      properties:
        status:
          type: string
          enum: [PROCESSED, FAILED, PENDING]
          description: >-
            PROCESSED 는 조치까지 저장했다. FAILED 는 실패했고 뒤에 다시 시도된다 (다음에 받아들여진 판을 올릴 때,
            또는 관리자가 다시 처리할 때). PENDING 은 아직 처리하지 못했다
        failedStage:
          type: [string, 'null']
          enum: [IMPACT, RULES, null]
          description: 실패했을 때 어느 단계인가. IMPACT 는 영향 범위 계산, RULES 는 규칙 실행. 아니면 null
        failureCode:
          type: [string, 'null']
          description: 실패한 이유의 코드. 아니면 null. 문구가 아니다. 화면이 코드마다 안내문을 보여 준다
        failures:
          type: array
          description: >-
            평가에 실패한 규칙 (failureCode 가 RULE_FAILED 일 때). 규칙 번호 순이다. 그 밖의 실패와 실패가 아닌
            것은 빈 목록이다
          items:
            $ref: '#/components/schemas/ChangeFailure'
        actionCount:
          type: integer
          minimum: 0
          description: 그 변동에서 만들어진 조치의 수. 처리되지 않았으면 0
    ChangeFailure:
      type: object
      description: 평가에 실패한 규칙 하나와 그 까닭
      required: [ruleNo, code, entityId, attributeName, value]
      properties:
        ruleNo:
          type: string
          description: 규칙 번호
        code:
          type: string
          description: 까닭의 코드. 문구가 아니다 (예. VALUE_FORMAT_MISMATCH, DUE_DATE_OUT_OF_RANGE)
        entityId:
          type: [string, 'null']
          description: 걸린 개체의 id. 없으면 null
        attributeName:
          type: [string, 'null']
          description: 걸린 속성의 이름. 없으면 null
        value:
          type: [string, 'null']
          description: 걸린 값. 없으면 null
    UnprocessedChangeList:
      type: object
      required: [packId, changes]
      properties:
        packId:
          type: string
        changes:
          type: array
          description: 처리되지 않은 변동. 처리하는 차례다
          items:
            $ref: '#/components/schemas/UnprocessedChange'
    UnprocessedChange:
      type: object
      required: [changeEventId, editionId, inputSourceId, editionNo, effectiveDate, itemKey, kind, primaryEntityId, processing]
      properties:
        changeEventId:
          type: string
        editionId:
          type: string
          description: 그 변동이 나온 판의 id
        inputSourceId:
          type: string
        editionNo:
          type: integer
        effectiveDate:
          type: string
          format: date
          description: 그 판의 적용일
        itemKey:
          type: string
        kind:
          type: string
          enum: [ADDED, CHANGED, REMOVED]
        primaryEntityId:
          type: string
        processing:
          $ref: '#/components/schemas/ChangeProcessing'
    ChangeReprocessingRequest:
      type: object
      required: [packId]
      properties:
        packId:
          type: string
    ChangeReprocessing:
      type: object
      required: [packId, processedCount, failedCount, changes]
      properties:
        packId:
          type: string
        processedCount:
          type: integer
          minimum: 0
          description: changes 가운데 처리된 것의 수
        failedCount:
          type: integer
          minimum: 0
          description: changes 가운데 다시 실패한 것의 수
        changes:
          type: array
          description: 이 요청이 다시 처리한 변동과 그 결과. 처리한 차례다. 처리할 것이 없었으면 빈 목록
          items:
            $ref: '#/components/schemas/RetriedChange'
    RetriedChange:
      type: object
      required: [changeEventId, editionId, itemKey, processing]
      properties:
        changeEventId:
          type: string
        editionId:
          type: string
          description: 그 변동이 나온 판의 id
        itemKey:
          type: string
        processing:
          $ref: '#/components/schemas/ChangeProcessing'
    EditionNotice:
      type: object
      description: 투입의 알림 하나. 종류와 이유의 코드와 값, 그리고 그것을 풀어 쓴 문구다
      required: [kind, rowNo, code, subject, detail, message]
      properties:
        kind:
          type: string
          description: 종류. SKIPPED_ROW, REFERENCE_ONLY_ENTITY, ATTRIBUTE_CONFLICT, RELATION_CONFLICT, PERIOD_ADJUSTED
        rowNo:
          type: integer
          description: 걸린 행의 번호
        code:
          type: string
          description: 이유의 코드
        subject:
          type: [string, 'null']
          description: 걸린 열의 이름이나 개체·속성의 id. 없으면 null
        detail:
          type: [string, 'null']
          description: 걸린 값. 없으면 null
        message:
          type: string
          description: >-
            사용자에게 보이는 한국어 문구. 몇 번째 행의 어느 열(또는 어느 개체의 어느 속성)이 왜 걸렸는지와
            무엇을 하면 되는지를 적는다. 화면이 가르는 데는 kind 와 code 를 쓴다: 문구는 바뀔 수 있다
    EditionRejectedProblem:
      description: 공통 오류 형식에 거부한 이유를 더했다
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reasonCode, reasonDetail]
          properties:
            reasonCode:
              type: string
              description: 거부한 이유의 코드. 투입 기록에 남은 것과 같다
            reasonDetail:
              type: [string, 'null']
              description: 거부한 이유의 값 (예. 없는 열의 이름). 없으면 null
    Problem:
      type: object
      description: RFC 9457 의 항목에 code 와 field 를 더했다
      required: [title, status, detail, code]
      properties:
        type:
          type: string
          description: 오류 종류의 주소. 따로 정하지 않은 오류는 about:blank
        title:
          type: string
          description: 오류 종류의 짧은 이름
        status:
          type: integer
          description: HTTP 상태
        detail:
          type: string
          description: 사용자에게 보이는 한국어 문구. 무엇을 하면 되는지까지 적는다
        code:
          type: string
          description: 오류의 종류. 화면이 이것으로 가른다. 바뀌지 않는 값이다
          enum: [MISSING_ENTITY_ID, INVALID_AS_OF, ENTITY_NOT_FOUND, MISSING_LOGIN_ID, MISSING_PASSWORD, LOGIN_FAILED, MISSING_PACK_ID, MISSING_INPUT_SOURCE_ID, MISSING_EFFECTIVE_DATE, INVALID_EFFECTIVE_DATE, MISSING_FILE, INVALID_EDITION, PACK_NOT_FOUND, INPUT_SOURCE_NOT_FOUND, FILE_TOO_LARGE, EDITION_REJECTED, INVALID_STATUS, MISSING_ACTION_ID, INVALID_ACTION_ID, ACTION_NOT_FOUND, INVALID_BODY, MISSING_DECISION, INVALID_DECISION, INVALID_NOTE, ACTION_DECISION_CONFLICT, MISSING_CHANGE_EVENT_ID, INVALID_CHANGE_EVENT_ID, IMPACT_SCOPE_NOT_FOUND, UNAUTHENTICATED, FORBIDDEN, INTERNAL, INVALID_PACK_ID, PACK_FOLDER_NOT_FOUND, PACK_INVALID, PACK_CHANGE_REJECTED, INVALID_OFFSET, INVALID_LIMIT, INVALID_ENTITY_ID]
        field:
          type: string
          description: 틀린 항목의 이름. 입력 오류일 때만 있다
        problems:
          type: array
          description: code 가 PACK_INVALID 일 때만 있다. Pack 에서 찾은 문제 전부. pack 이 준 순서 그대로다
          items:
            $ref: '#/components/schemas/PackProblem'
        reasons:
          type: array
          description: code 가 PACK_CHANGE_REJECTED 일 때만 있다. 이미 적재된 정의와 맞지 않는 곳. pack 이 준 순서 그대로다
          items:
            type: string
