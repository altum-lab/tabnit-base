        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          description: 행이 한 번에 내보내는 한도를 넘는다 (EXPORT_TOO_LARGE). 일부만 담은 파일을 주지 않는다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/impact:
    get:
      operationId: getImpactFromEntity
      summary: 개체 하나에서 출발해 조회 시점의 영향 범위를 계산해 근거 경로와 함께 돌려준다
      description: >-
        저장하지 않는다: 부를 때마다 지금의 자료로 계산한다. 영향 범위, 조치, 변동 이벤트를 만들지 않는다.
        관계 유형마다의 영향 방향과 최대 깊이는 그 개체의 Pack 의 정의를 쓴다. 조회 시점에 유효한 관계만 따라간다.
        includePreviousDay 를 주면 그 전날에 유효한 관계도 함께 따라가 합친다: 그 날짜가 적용일인 변동의 저장된
        영향 범위(getChangeImpactScope)와 같은 방식이다. 담당자와 관리자가 부를 수 있다
      parameters:
        - name: entityId
          in: query
          required: true
          description: 출발 개체의 id. 서버가 준 값을 그대로 보낸다
          schema:
            type: string
            minLength: 1
        - name: asOf
          in: query
          required: false
          description: 조회 시점. 없으면 오늘
          schema:
            type: string
            format: date
        - name: includePreviousDay
          in: query
          required: false
          description: true 이면 조회 시점의 전날에 유효한 관계도 함께 따라간다. 없으면 false 다
          schema:
            type: boolean
            default: false
        - name: maxDepth
          in: query
          required: false
          description: 최대 깊이. 1 부터 그 Pack 의 최대 깊이의 기본값까지다. 없으면 그 기본값이다
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            영향 대상을 나눠 돌려준다: offset 만큼 건너뛰고 limit 개까지 준다. total 과 countsByType, countsByDepth 는
            나누기 전의 영향 범위 전체의 값이다. 영향 대상의 순서는 깊이, 개체 유형, 개체의 id 차례다. countsByType 은 개체 유형의
            글자 코드 순, countsByDepth 는 깊이 순이다. 경로의 단계는 출발 개체 쪽부터의 차례다. 출발 개체 자신은 영향 대상에
            들지 않는다. 영향 대상이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityImpact'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/impact-scopes:
    get:
      operationId: getChangeImpactScope
      summary: 변동 이벤트 하나의 저장된 영향 범위를 근거 경로와 함께 돌려준다
      description: >-
        판을 올린 직후에 그때의 자료로 한 번 계산해 저장한 것이다. 뒤에 자료가 바뀌어도 달라지지 않는다.
        판의 적용일 전날과 적용일, 두 날짜의 관계로 따라간 결과를 합친 것이다.
        조치의 근거 경로는 여기서 그 조치의 대상(entityId)으로 찾는다. 담당자와 관리자가 부를 수 있다
      parameters:
        - name: changeEventId
          in: query
          required: true
          description: 변동 이벤트의 id. 서버가 준 값을 그대로 보낸다
          schema:
            type: string
            minLength: 1
        - name: entityId
          in: query
          required: false
          description: >-
            이 개체인 영향 대상만 준다 (조치의 근거 경로를 찾을 때 쓴다). 그 개체가 영향 대상이 아니면 targets 는
            빈 목록이다. total, countsByType, countsByDepth 는 거르지 않은 영향 범위의 값 그대로다
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            영향 대상을 나눠 돌려준다: offset 만큼 건너뛰고 limit 개까지 준다. total 과 countsByType, countsByDepth 는
            나누기 전의 영향 범위 전체의 값이다. 영향 대상의 순서는 깊이, 개체 유형, 개체의 id 차례다. countsByType 은 개체 유형의 글자 코드 순,
            countsByDepth 는 깊이 순이다. 경로의 단계는 변동 대상 쪽부터의 차례다.
            영향 대상이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImpactScope'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Offset:
      name: offset
      in: query
      required: false
      description: 건너뛸 수. 없으면 0. 전체 수와 같거나 크면 빈 목록이다
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      description: 한 번에 받을 수. 없으면 50. 1 부터 200 까지
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Problem:
      description: 공통 오류 형식 (RFC 9457 에 code 와 field 를 더한 것)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RelationsAsOf:
      type: object
      required: [asOf, entityId, total, offset, limit, relations]
      properties:
        asOf:
          type: string
          format: date
          description: 답에 쓴 날짜. 요청에 asOf 가 있었든 없었든 담는다
        entityId:
          type: string
        total:
          type: integer
          minimum: 0
          description: 조회 시점에 유효한 관계의 전체 수. 나누기 전의 수다. 화면은 다시 세지 않는다
        offset:
          type: integer
          minimum: 0
          description: 답에 쓴 건너뛴 수
        limit:
          type: integer
          minimum: 1
          description: 답에 쓴 한 번에 주는 수
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
    RelationMap:
      type: object
      description: 관계 지도. 개체 하나를 가운데 둔 노드와 간선
      required: [asOf, centerEntityId, depth, reachedDepth, maxNodes, totalNodes, truncated, nodes, edges]
      properties:
        asOf:
          type: string
          format: date
          description: 답에 쓴 날짜. 요청에 있었든 없었든 담는다
        centerEntityId:
          type: string
          description: 가운데 개체의 id
        depth:
          type: integer
          minimum: 1
          maximum: 3
          description: 답에 쓴 깊이. 청한 깊이다
        reachedDepth:
          type: integer
          minimum: 1
          maximum: 3
          description: >-
            따라간 깊이. 찾은 노드가 maxNodes 를 넘은 단계에서 더 따라가지 않으므로 depth 보다 작을 수 있다.
            멈추지 않았으면 depth 와 같다
        maxNodes:
          type: integer
          minimum: 1
          description: 담는 노드의 한도. 가운데 개체를 넣어 센다. 200 이다
        totalNodes:
          type: integer
          minimum: 1
          description: >-
            자르기 전의 노드의 수. reachedDepth 까지 찾은 것을 가운데 개체를 넣어 센다. 그 너머는 세지 않는다.
            reachedDepth 가 depth 보다 작으면 depth 안의 전체가 아니라 멈춘 데까지의 수다
        truncated:
          type: boolean
          description: 노드가 한도를 넘어 잘렸는가. true 이면 nodes 는 가까운 것부터 maxNodes 개다
        nodes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/RelationMapNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/RelationMapEdge'
    RelationPath:
      type: object
      required: [asOf, fromEntityId, toEntityId, found, limitReached, maxLength, length, entities, steps]
      properties:
        asOf:
          type: string
          format: date
          description: 답에 쓴 조회 시점. 이 날짜에 유효한 관계로 찾았고, 표시 이름도 이 날짜의 값이다
        fromEntityId:
          type: string
        toEntityId:
          type: string
        found:
          type: boolean
          description: 경로를 찾았는가
        limitReached:
          type: boolean
          description: >-
            한도(최대 길이, 훑는 개체의 수) 때문에 멈췄는가. true 이면 경로가 없다는 뜻이 아니라 한도 안에서 찾지
            못했다는 뜻이다. 찾았으면 false 다
        maxLength:
          type: integer
          minimum: 1
          description: 찾는 경로의 최대 길이. 이보다 긴 경로는 찾지 않는다
        length:
          type: [integer, 'null']
          minimum: 0
          description: 경로의 길이 (관계의 수). 찾지 못했으면 null 이다. 두 개체가 같으면 0 이다
        entities:
          type: array
          description: 경로가 지나는 개체. 출발 개체에서 도착 개체까지 차례대로다. 찾지 못했으면 비어 있다
          items:
            $ref: '#/components/schemas/EntityRef'
        steps:
          type: array
          description: 걸음. 출발 개체 쪽부터 차례대로다. 찾지 못했거나 두 개체가 같으면 비어 있다
          items:
            $ref: '#/components/schemas/RelationPathStep'
    RelationPathStep:
      type: object
      required: [stepNo, from, to, relation]
      properties:
        stepNo:
          type: integer
          minimum: 1
        from:
          $ref: '#/components/schemas/EntityRef'
        to:
          $ref: '#/components/schemas/EntityRef'
        relation:
          description: 건넌 관계. 관계에 적힌 방향(출발, 도착)은 저장된 그대로다. 걸어간 방향(from 에서 to)과 다를 수 있다
          allOf:
            - $ref: '#/components/schemas/Relation'
    PackRelationMap:
      type: object
      required: [packId, asOf, maxNodes, connectedEntities, isolatedEntities, relations, grouped, typeGroups,
                 relationGroups, nodes, edges]
      properties:
        packId:
          type: string
        asOf:
          type: string
          format: date
          description: 답에 쓴 조회 시점
        maxNodes:
          type: integer
          description: 개체 하나하나를 담는 한도. 개체 하나의 둘레의 지도와 같은 값이다
        connectedEntities:
          type: integer
          minimum: 0
          description: 조회 시점에 유효한 관계에 닿은 개체의 수. typeGroups 의 entityCount 를 더한 것과 같다
        isolatedEntities:
          type: integer
          minimum: 0
          description: 그 Pack 의 개체 가운데 조회 시점에 유효한 관계가 하나도 없는 것의 수. 지도에 넣지 않는다
        relations:
          type: integer
          minimum: 0
          description: 조회 시점에 유효한 관계의 수. relationGroups 의 relationCount 를 더한 것과 같다
        grouped:
          type: boolean
          description: 이어진 개체가 한도를 넘어 개체 하나하나를 담지 않았는가. true 이면 nodes 와 edges 가 비어 있다
        typeGroups:
          type: array
          description: 유형마다의 이어진 개체의 수. 유형의 이름의 글자 코드 순이다. 개체에 적힌 유형 그대로다
          items:
            type: object
            required: [entityType, entityTypeLabel, entityCount]
            properties:
              entityType:
                type: string
              entityTypeLabel:
                type: string
                description: Pack 의 정의의 이름표. 없으면 유형의 이름이다
              entityCount:
                type: integer
                minimum: 1
        relationGroups:
          type: array
          description: (출발 개체의 유형, 관계 유형, 도착 개체의 유형)마다의 관계의 수. 그 셋의 글자 코드 순이다
          items:
            type: object
            required: [sourceEntityType, relationType, targetEntityType, relationCount]
            properties:
              sourceEntityType:
                type: string
              relationType:
                type: string
              targetEntityType:
                type: string
              relationCount:
                type: integer
                minimum: 1
        nodes:
          type: array
          description: 이어진 개체. 유형, 식별자의 글자 코드 순이다. grouped 가 true 이면 비어 있다
          items:
            type: object
            required: [entityId, entity]
            properties:
              entityId:
                type: string
              entity:
                description: 그 개체. 표시 이름은 조회 시점의 값이다
                $ref: '#/components/schemas/EntityRef'
        edges:
          type: array
          description: 유효한 관계. 관계 유형, 출발 개체, 도착 개체, 관계의 식별자 순이다. grouped 가 true 이면 비어 있다
          items:
            $ref: '#/components/schemas/RelationMapEdge'
    RelationMapNode:
      type: object
      required: [entityId, entity, depth]
      properties:
        entityId:
          type: string
        entity:
          description: 그 개체. 표시 이름은 조회 시점의 값이다
          $ref: '#/components/schemas/EntityRef'
        depth:
          type: integer
          minimum: 0
          description: 가운데 개체에서 건넌 관계의 수 가운데 가장 작은 것. 가운데 개체는 0
    RelationMapEdge:
      type: object
      description: 조회 시점에 유효한 관계 하나. 두 끝이 모두 nodes 에 있다
      required: [id, relationType, sourceEntityId, targetEntityId, validFrom, validTo, provenance, recordedAt]
      properties:
        id:
          type: string
        relationType:
          type: string
        sourceEntityId:
          type: string
          description: 관계에 적힌 출발 개체의 id. nodes 의 entityId 가운데 하나다
        targetEntityId:
          type: string
          description: 관계에 적힌 도착 개체의 id. nodes 의 entityId 가운데 하나다
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, 'null']
          format: date
          description: 종료일. 제외한다. 없으면 null
        provenance:
          $ref: '#/components/schemas/Provenance'
        recordedAt:
          type: string
          format: date-time
    Relation:
      type: object
      required: [id, relationType, sourceEntityId, targetEntityId, source, target, validFrom, validTo, provenance, recordedAt]
      properties:
        id:
          type: string
        relationType:
          type: string
        sourceEntityId:
          type: string
          description: 출발 개체의 id
        targetEntityId:
          type: string
          description: 도착 개체의 id
        source:
          description: 출발 개체. 표시 이름은 조회 시점의 값이다
          $ref: '#/components/schemas/EntityRef'
        target:
          description: 도착 개체. 표시 이름은 조회 시점의 값이다
          $ref: '#/components/schemas/EntityRef'
        validFrom:
          type: string
          format: date
          description: 시작일. 포함한다
        validTo:
          type: [string, 'null']
          format: date
          description: 종료일. 제외한다. null 이면 계속 유효하다
        provenance:
          $ref: '#/components/schemas/Provenance'
        recordedAt:
          type: string
          format: date-time
          description: 기록한 때 (협정 세계시)
    AttributeValuesAsOf:
      type: object
      required: [asOf, entityId, entity, values]
      properties:
        asOf:
          type: string
          format: date
          description: 답에 쓴 조회 시점
        entityId:
          type: string
        entity:
          description: 그 개체. 표시 이름은 조회 시점의 값이다
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        values:
          type: array
          description: 조회 시점에 유효한 속성 값. 속성의 이름, 시작일 순이다. 없으면 빈 목록이다
          items:
            $ref: '#/components/schemas/AttributeValueAsOf'
    AttributeValueAsOf:
      type: object
      required: [attributeName, attributeLabel, value, valueDisplay, validFrom, validTo, provenance, recordedAt]
      properties:
        attributeName:
          type: string
        attributeLabel:
          type: string
          description: Pack 의 정의의 이름표. 없으면 속성의 이름이다
        value:
          type: string
          description: 저장한 글자 그대로다
        valueDisplay:
          type: string
          description: 화면에 보일 글자. 참·거짓 속성이면 예, 아니오다. 그 밖에는 value 와 같다
        validFrom:
          type: string
          format: date
        validTo:
          description: 종료일. 없으면 null (계속 유효하다)
          oneOf:
            - type: string
              format: date
            - type: 'null'
        provenance:
          $ref: '#/components/schemas/Provenance'
        recordedAt:
          type: string
          format: date-time
    Provenance:
      type: object
      description: 출처. 어느 입력 자료의 어느 판에서 왔는가
      required: [inputSourceId, inputSourceLabel, editionNo]
      properties:
        inputSourceId:
          type: string
        inputSourceLabel:
          type: string
          description: >-
            입력 자료의 이름표. Pack 의 매핑에 적은 화면에 보일 이름이다. 적지 않았으면 (또는 그 Pack 이
            적재되어 있지 않으면) 입력 자료의 id 와 같다
        editionNo:
          type: integer
          minimum: 1
    AuditOutcome:
      type: string
      description: 감사 기록의 결과. STARTED 하기 전에 남긴 줄, SUCCESS 성공, DENIED 거부 (권한 없음, 로그인 실패), FAILED 실패
      enum: [STARTED, SUCCESS, DENIED, FAILED]
    AuditRecordList:
      type: object
      required: [actor, action, outcome, from, to, maxId, total, offset, limit, records]
      properties:
        actor:
          type: [string, 'null']
          description: 답에 쓴 거르는 조건. 요청에 없었으면 null 이다
        action:
          type: [string, 'null']
        outcome:
          oneOf:
            - $ref: '#/components/schemas/AuditOutcome'
            - type: 'null'
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        maxId:
          type: [integer, 'null']
          format: int64
          description: 답에 쓴 일련번호의 위쪽 끝. 주지 않았으면 null 이다
        total:
          type: integer
          minimum: 0
          description: 조건에 맞는 줄의 전체 수. 나누기 전의 수다. maxId 를 줬으면 그 번호까지의 수다
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        records:
          type: array
          description: 조건에 맞는 줄 가운데 이 쪽의 것. id 의 내림차순이다
          items:
            $ref: '#/components/schemas/AuditRecord'
    AuditRecord:
      type: object
      required: [id, occurredAt, actor, action, target, asOf, outcome, httpStatus, detail, startedId]
      properties:
        id:
          type: integer
          format: int64
          description: 일련번호. 남긴 차례대로 커진다
        occurredAt:
          type: string
          format: date-time
          description: 언제. 협정 세계시다
        actor:
          type: [string, 'null']
          description: 누가. 사용자의 아이디. 모르면 null 이다 (로그인하기 전의 요청, 서버에서 실행한 명령)
        action:
          type: string
          description: 무엇을 했는가. 기능의 이름
        target:
          type: [string, 'null']
          description: 무엇에 대해. 요청의 항목 가운데 대상을 가리키는 것들
        asOf:
          type: [string, 'null']
          format: date
          description: 조회에 쓴 조회 시점. 없는 요청이면 null 이다
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        httpStatus:
          type: [integer, 'null']
          description: 응답의 HTTP 상태. 시작의 줄에는 없다
        detail:
          type: [string, 'null']
        startedId:
          type: [integer, 'null']
          format: int64
          description: 이 줄이 결과일 때, 하기 전에 남긴 줄의 id
    Session:
      type: object
      description: 로그인한 사람
      required: [loginId, role, timeZone]
      properties:
        loginId:
          type: string
          description: 아이디
        role:
          type: string
          enum: [ADMIN, OFFICER]
          description: 역할. ADMIN 관리자, OFFICER 담당자
        timeZone:
          type: string
          description: >-
            설치 설정의 시간대 (예. Asia/Seoul). 화면은 시각을 이 시간대로 바꿔 보여 준다.
            API 의 시각은 모두 협정 세계시 그대로다. 서버가 조회 시점의 "오늘"을 정할 때 쓰는 시간대와 같다
    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          description: 비밀번호. 서버는 이 값을 저장하거나 기록에 남기지 않는다
    VerificationResults:
      type: object
      required: [packId, available, unavailableReason, scenarios]
      properties:
        packId:
          type: string
        available:
          type: boolean
          description: >-
            질문을 읽을 수 있었는가. 서버에 Pack 폴더가 정해져 있지 않거나, 그 Pack 의 폴더나 질문 파일이 없거나, 질문
            파일을 읽지 못하면 false 이고 scenarios 는 비어 있다
        unavailableReason:
          description: available 이 false 인 까닭과 무엇을 하면 되는지. true 이면 null
          oneOf:
            - type: string
            - type: 'null'
        scenarios:
          type: array
          description: 질문 파일마다 하나. 파일 이름의 글자 코드 순이다
          items:
            $ref: '#/components/schemas/VerificationScenario'
    VerificationScenario:
      type: object
      required: [fileName, scenarioId, title, stepCount, questionCount, matched, mismatch, passedCount, repeatable,
                 differingQuestionIds, results]
      properties:
        fileName:
          type: string
        scenarioId:
          type: string
        title:
          type: string
        stepCount:
          type: integer
          description: 시나리오의 단계의 수
        questionCount:
          type: integer
        matched:
          type: boolean
          description: 저장소의 그 Pack 의 판이 시나리오의 단계와 꼭 같은가. false 이면 묻지 않았고 results 는 비어 있다
        mismatch:
          description: matched 가 false 인 까닭 (어느 단계가 어떻게 다른가). true 이면 null
          oneOf:
            - type: string
            - type: 'null'
        passedCount:
          type: integer
          description: 통과한 질문의 수. matched 가 false 이면 0
        repeatable:
          type: boolean
          description: 두 번 물은 결과가 같은가. matched 가 false 이면 true
        differingQuestionIds:
          type: array
          description: 두 번 물은 결과가 달랐던 질문의 번호. 번호 순
          items:
            type: string
        results:
          type: array
          description: 질문마다의 결과. 번호의 글자 코드 순이다
          items:
            $ref: '#/components/schemas/VerificationQuestionResult'
    VerificationQuestionResult:
      type: object
      required: [id, kind, kindLabel, label, passed, expected, actual, reason]
      properties:
        id:
          type: string
        kind:
          type: string
        kindLabel:
          type: string
          description: 종류를 사람이 읽는 말로 (시점 조회, 변동, 영향 범위, 조치, 관계 지도, 속성 값)
        label:
          type: string
          description: 어느 날짜나 단계를 물었는가. 골든셋의 번호를 적은 질문이면 함께 있다
        passed:
          type: boolean
        expected:
          description: 기대한 값을 글자로 적은 것. 견주지 못했으면 null
          oneOf:
            - type: string
            - type: 'null'
        actual:
          description: 제품의 답을 글자로 적은 것. 견주지 못했으면 null
          oneOf:
            - type: string
            - type: 'null'
        reason:
          description: 견주지 못한 까닭. 견줬으면 null
          oneOf:
            - type: string
            - type: 'null'
    PackFolderList:
      type: object
      required: [configured, folders]
      properties:
        configured:
          type: boolean
          description: 서버에 Pack 폴더(설치 설정 tabnit.packs-dir)가 정해져 있고 그 폴더가 있는가
        folders:
          type: array
          description: 적재할 수 있는 이름의 폴더. 이름의 글자 코드 순
          items:
            $ref: '#/components/schemas/PackFolder'
    PackFolder:
      type: object
      required: [packId, loaded]
      properties:
        packId:
          type: string
          description: 폴더의 이름. loadPack 의 packId 로 그대로 보낸다
        loaded:
          type: boolean
          description: 그 이름의 Pack 이 이미 적재되어 있는가. true 인 것을 다시 적재하면 지금의 정의가 바뀔 수 있다
    PackLoadRequest:
      type: object
      required: [packId]
      properties:
        packId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z0-9-]+$'
          description: 적재할 Pack 의 id. 서버의 Pack 폴더 바로 아래에 있는 폴더의 이름이다
    PackLoad:
      type: object
      required: [packId, outcome, warnings]
      properties:
        packId:
          type: string
        outcome:
          type: string
          enum: [LOADED, UPDATED, UNCHANGED]
          description: LOADED 처음 적재했다. UPDATED 이미 있던 정의를 고친 것으로 바꿨다. UNCHANGED 이미 있는 것과 같아 바꾸지 않았다
        warnings:
          type: array
          description: >-
            경고. 적재를 막지 않는다: Pack 은 적재됐다. 뜻대로 동작하지 않을 수 있는 곳을 알린다.
            pack 이 준 순서 그대로다 (규칙의 경고는 규칙 번호 순). 없으면 빈 목록이다.
            같은 Pack 을 다시 적재해 바뀐 것이 없어도 같은 경고가 나온다
          items:
            $ref: '#/components/schemas/PackWarning'
    PackWarning:
      type: object
      description: Pack 을 적재하면서 알리는 경고 하나
      required: [file, item, message]
      properties:
        file:
          type: string
          description: Pack 폴더 안에서의 자리. 규칙의 경고는 rules 다
        item:
          type: string
          description: 경고의 대상. 규칙의 경고는 규칙 번호다
        message:
          type: string
          description: 사용자에게 보이는 문구. 무엇이 왜 걸리는지와 무엇을 하면 되는지를 담는다
    PackProblem:
      type: object
      description: Pack 에서 찾은 문제 하나
      required: [file, item, message]
      properties:
        file:
          type: string
          description: Pack 폴더 안에서의 파일 이름. 폴더 자체의 문제면 빈 글자
        item:
          type: string
          description: 틀린 항목. 정의의 이름이다
        message:
          type: string
          description: 무엇이 틀렸고 어떻게 고치면 되는지
    PackDefinition:
      type: object
      description: 적재된 Pack 의 정의. Pack 의 파일에 적힌 것을 읽어 검증한 값이다 (D6)
      required: [packId, label, defaultMaxDepth, loadedAt, entityTypes, attributes, relationTypes, inputSources, rules, constraints]
      properties:
        packId:
          type: string
        label:
          type: string
          description: Pack 의 이름
        defaultMaxDepth:
          type: integer
          minimum: 1
          description: 영향 범위 계산의 최대 깊이의 기본값
        loadedAt:
          type: string
          format: date-time
          description: 적재한 때. 협정 세계시다
        entityTypes:
          type: array
          description: 개체 유형. 이름의 글자 코드 순
          items:
            $ref: '#/components/schemas/PackEntityType'
        attributes:
          type: array
          description: 속성. 이름의 글자 코드 순
          items:
            $ref: '#/components/schemas/PackAttribute'
        relationTypes:
          type: array
          description: 관계 유형. 이름의 글자 코드 순
          items:
            $ref: '#/components/schemas/PackRelationType'
        inputSources:
          type: array
          description: 입력 자료와 그 매핑. 입력 자료의 식별자 순
          items:
            $ref: '#/components/schemas/PackInputSource'
        rules:
          type: array
          description: 규칙. 규칙 번호의 글자 코드 순 (평가하는 차례가 아니다)
          items:
            $ref: '#/components/schemas/PackRule'
        constraints:
          type: string
          description: 제약 파일(constraints.ttl)의 글 그대로 (SHACL). 제약이 없으면 빈 글자다
    PackEntityType:
      type: object
      required: [name, label, parents, displayNameAttribute]
      properties:
        name:
          type: string
        label:
          type: string
          description: 이름표 (화면에 보일 이름)
        parents:
          type: array
          description: 상위 유형의 이름
          items:
            type: string
        displayNameAttribute:
          type: [string, 'null']
          description: 표시 이름으로 쓸 속성. 이 유형이 스스로 적은 값이다. null 이면 상위 유형의 것을 받는다
    PackAttribute:
      type: object
      required: [name, label, entityType, valueFormat]
      properties:
        name:
          type: string
        label:
          type: string
        entityType:
          type: string
          description: 어느 개체 유형의 속성인가
        valueFormat:
          type: string
          enum: [STRING, INTEGER, DECIMAL, DATE, BOOLEAN]
    PackRelationType:
      type: object
      required: [name, label, sourceType, targetType, impactDirection]
      properties:
        name:
          type: string
        label:
          type: string
        sourceType:
          type: string
          description: 출발 개체의 유형
        targetType:
          type: string
          description: 도착 개체의 유형
        impactDirection:
          type: string
          description: 영향이 퍼지는 방향. 출발에서 도착으로, 도착에서 출발로, 양쪽, 퍼지지 않음
          enum: [SOURCE_TO_TARGET, TARGET_TO_SOURCE, BOTH, NONE]
    PackMappedEntityRef:
      type: object
      required: [entityType, keyColumn]
      properties:
        entityType:
          type: string
        keyColumn:
          type: string
          description: 입력의 키를 읽을 열
    PackMappedAttribute:
      type: object
      required: [attributeName, column, validFromColumn, validToColumn, datePattern, groupingSeparator, trueValue, falseValue]
      properties:
        attributeName:
          type: string
        column:
          type: string
          description: 값을 읽을 열
        validFromColumn:
          type: [string, 'null']
        validToColumn:
          type: [string, 'null']
        datePattern:
          type: [string, 'null']
        groupingSeparator:
          type: [string, 'null']
        trueValue:
          type: [string, 'null']
        falseValue:
          type: [string, 'null']
    PackMappedEntity:
      type: object
      required: [entityType, keyColumn, attributes]
      properties:
        entityType:
          type: string
        keyColumn:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/PackMappedAttribute'
    PackMappedRelation:
      type: object
      required: [relationType, source, target, validFromColumn, validToColumn]
      properties:
        relationType:
          type: string
        source:
          $ref: '#/components/schemas/PackMappedEntityRef'
        target:
          $ref: '#/components/schemas/PackMappedEntityRef'
        validFromColumn:
          type: [string, 'null']
          description: 유효기간의 시작일을 읽을 열. null 이면 시작일은 판의 적용일이다
        validToColumn:
          type: [string, 'null']
    PackInputSource:
      type: object
      description: 입력 자료 하나와 그 매핑 (D6 7절)
      required: [inputSourceId, label, fileFormat, sheetName, defaultDatePattern, requiredColumns, itemKeyColumns, primaryEntity, entities, relations]
      properties:
        inputSourceId:
          type: string
        label:
          type: string
          description: 이름표. Pack 이 적지 않았으면 식별자다
        fileFormat:
          type: string
          enum: [CSV, XLSX]
        sheetName:
          type: [string, 'null']
        defaultDatePattern:
          type: [string, 'null']
        requiredColumns:
          type: array
          items:
            type: string
        itemKeyColumns:
          type: array
          description: 항목의 키 열. 판을 비교할 때 이 열로 같은 항목을 찾는다
          items:
            type: string
        primaryEntity:
          description: 행의 주 개체
          oneOf:
            - $ref: '#/components/schemas/PackMappedEntityRef'
            - type: 'null'
        entities:
          type: array
          description: 행이 만드는 개체
          items:
            $ref: '#/components/schemas/PackMappedEntity'
        relations:
          type: array
          description: 행이 만드는 관계
          items:
            $ref: '#/components/schemas/PackMappedRelation'
    PackRuleCondition:
      type: object
      description: 규칙의 조건 하나 (D8 3절). 유형을 보는 조건이거나 속성 값을 보는 조건이다
      required: [subject, typeIs, attributeName, operator, values, compareTo, compareSubject, compareAttributeName, linkedBy]
      properties:
        subject:
          type: string
          enum: [CHANGE_TARGET, IMPACT_TARGET, LINKED_TARGET]
        typeIs:
          type: [string, 'null']
        attributeName:
          type: [string, 'null']
        operator:
          type: [string, 'null']
          description: 속성을 보는 조건의 비교. 유형을 보는 조건이면 null
        values:
          type: array
          items:
            type: string
        compareTo:
          type: string
          description: 속성 값을 무엇과 견주는가
        compareSubject:
          type: [string, 'null']
        compareAttributeName:
          type: [string, 'null']
        linkedBy:
          type: [string, 'null']
    PackRule:
      type: object
      description: 규칙 하나 (D8 2절)
      required: [ruleNo, label, priority, changeKinds, appliesTo, targetType, conditions, actionText, dueInDays, inputSources, changedAttributes, changedRelationTypes]
      properties:
        ruleNo:
          type: string
        label:
          type: string
        priority:
          type: integer
          minimum: 1
          description: 우선순위. 수가 작을수록 먼저다
        changeKinds:
          type: array
          description: 어떤 종류의 변동에 걸리는가
          items:
            type: string
            enum: [ADDED, CHANGED, REMOVED]
        appliesTo:
          type: string
          description: 조치의 대상이 변동 대상인가 영향 대상인가
          enum: [CHANGE_TARGET, IMPACT_TARGET]
        targetType:
          type: string
          description: 조치를 만들 대상의 개체 유형
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/PackRuleCondition'
        actionText:
          type: string
          description: 조치에 담을 해야 할 일의 문구
        dueInDays:
          type: integer
          minimum: 0
          description: 기한까지의 일수
        inputSources:
          type: array
          description: 어느 입력 자료의 변동에 걸리는가. 비어 있으면 모든 입력 자료다
          items:
            type: string
        changedAttributes:
          type: array
          items:
            type: string
        changedRelationTypes:
          type: array
          items:
            type: string
    PackList:
      type: object
      required: [packs]
      properties:
        packs:
          type: array
          items:
            $ref: '#/components/schemas/PackSummary'
    PackSummary:
      type: object
      required: [packId, label, inputSources]
      properties:
        packId:
          type: string
          description: Pack 의 id
        label:
          type: string
          description: Pack 의 이름
        inputSources:
          type: array
          description: 그 Pack 이 받는 입력 자료. 매핑이 하나도 없는 Pack 이면 비어 있다
          items:
            $ref: '#/components/schemas/InputSourceSummary'
    InputSourceSummary:
      type: object
      required: [inputSourceId, inputSourceLabel, fileFormat, latestEdition]
      properties:
        inputSourceId:
          type: string
          description: 입력 자료의 id
        inputSourceLabel:
          type: string
          description: >-
            입력 자료의 이름표. Pack 의 매핑에 적은 화면에 보일 이름이다. 적지 않았으면 (또는 그 Pack 이
            적재되어 있지 않으면) 입력 자료의 id 와 같다
        fileFormat:
          type: string
          enum: [CSV, XLSX]
          description: 받는 파일의 형식
        latestEdition:
          description: 지금의 가장 새 판. 아직 판이 없으면 null
          oneOf:
            - $ref: '#/components/schemas/EditionSummary'
            - type: 'null'
    EditionSummary:
      type: object
      required: [editionId, editionNo, effectiveDate]
      properties:
        editionId:
          type: string
        editionNo:
          type: integer
          minimum: 1
          description: 그 입력 자료 안에서의 판 번호
        effectiveDate:
          type: string
          format: date
          description: 그 판의 적용일
    ActionStatus:
      type: string
      enum: [PENDING, CONFIRMED, ON_HOLD]
      description: 조치의 상태. PENDING 대기, CONFIRMED 확정, ON_HOLD 보류
    EntityRef:
      type: object
      description: >-
        개체 하나. 화면은 표시 이름, 유형의 이름표, 키로 보여 준다. id 는 서버에 되돌려 보내는 값이다.
        표시 이름은 날짜에 따라 달라질 수 있다: 어느 날짜의 값인지는 이 개체가 든 응답이 정한다
        (관계 조회는 조회 시점, 조치와 영향 범위는 그 변동이 나온 판의 적용일)
      required: [entityId, entityType, entityTypeLabel, entityKey, displayName]
      properties:
        entityId:
          type: string
          description: 개체의 id
        entityType:
          type: string
          description: 개체 유형의 이름. Pack 이 정한 것
        entityTypeLabel:
          type: string
          description: 개체 유형의 이름표 (화면에 보일 이름). Pack 이 정한 것
        entityKey:
          type: string
          description: 입력의 키
        displayName:
          type: [string, 'null']
          description: >-
            표시 이름. Pack 이 그 유형의 표시 이름으로 정한 속성의, 그 날짜에 유효한 값이다.
            Pack 이 정하지 않았거나 그 날짜에 값이 없으면 null 이고, 화면은 키를 보여 준다
    ActionList:
      type: object
      required: [packId, status, changeEventId, total, offset, limit, actions]
      properties:
        packId:
          type: string
        status:
          description: 거르는 데 쓴 상태. 가리지 않았으면 null
          oneOf:
            - $ref: '#/components/schemas/ActionStatus'
            - type: 'null'
        changeEventId:
          type: [string, 'null']
          description: 거르는 데 쓴 변동 이벤트의 id. 가리지 않았으면 null
        total:
          type: integer
          minimum: 0
          description: 거른 조치의 전체 수. 나누기 전의 수다. 화면은 다시 세지 않는다
        offset:
          type: integer
          minimum: 0
          description: 답에 쓴 건너뛴 수
        limit:
          type: integer
          minimum: 1
          description: 답에 쓴 한 번에 주는 수
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
    Action:
      type: object
      description: 조치 하나. 해야 할 일
      required: [id, changeEventId, ruleNo, ruleLabel, actionText, priority, dueDate, status, appliesTo, target, basis, createdAt]
      properties:
        id:
          type: string
          description: 조치의 id
        changeEventId:
          type: string
          description: 이 조치를 낳은 변동 이벤트의 id. 영향 범위를 볼 때 쓴다
        ruleNo:
          type: string
          description: 근거 규칙의 번호
        ruleLabel:
          type: string
          description: 조치를 만들 때의 그 규칙의 이름
        actionText:
          type: string
          description: 해야 할 일. 조치를 만들 때 규칙에 적혀 있던 문구 그대로다
        priority:
          type: integer
          minimum: 1
          description: 우선순위. 수가 작을수록 먼저다
        dueDate:
          type: string
          format: date
          description: 기한. 근거가 된 판의 적용일에 규칙이 적은 일수를 더한 날짜
        status:
          $ref: '#/components/schemas/ActionStatus'
        appliesTo:
          type: string
          enum: [IMPACT_TARGET, CHANGE_TARGET]
          description: >-
            대상이 영향 대상인가(IMPACT_TARGET), 바뀐 개체 자신인가(CHANGE_TARGET).
            IMPACT_TARGET 이면 그 변동의 영향 범위에 대상의 근거 경로가 있다. CHANGE_TARGET 이면 근거 경로가 없다
        target:
          $ref: '#/components/schemas/EntityRef'
        basis:
          $ref: '#/components/schemas/ActionBasis'
        createdAt:
          type: string
          format: date-time
          description: 만든 때 (협정 세계시)
    ActionDetail:
      type: object
      required: [action, history]
      properties:
        action:
          $ref: '#/components/schemas/Action'
        history:
          type: array
          description: 그 조치의 이력. 상태를 바꾼 차례다
          items:
            $ref: '#/components/schemas/ActionDecision'
    ActionDecision:
      type: object
      description: 조치의 이력 한 줄. 상태를 한 번 바꾼 것
      required: [seq, fromStatus, toStatus, decidedBy, decidedAt, note]
      properties:
        seq:
          type: integer
          minimum: 1
          description: 그 조치 안에서의 차례
        fromStatus:
          $ref: '#/components/schemas/ActionStatus'
        toStatus:
          $ref: '#/components/schemas/ActionStatus'
        decidedBy:
          type: string
          description: 누가 했는가. 사용자의 아이디
        decidedAt:
          type: string
          format: date-time
          description: 언제 했는가 (협정 세계시)
        note:
          type: [string, 'null']
          description: 사유. 없으면 null. 보류에는 반드시 있다
    ActionDecisionRequest:
      type: object
      required: [actionId, decision]
      properties:
        actionId:
          type: string
          minLength: 1
          description: 조치의 id. 서버가 준 값을 그대로 보낸다
        decision:
          type: string
          enum: [CONFIRM, HOLD]
          description: CONFIRM 확정, HOLD 보류
        note:
          type: [string, 'null']
          maxLength: 1000
          description: 사유. 보류에는 반드시 적는다. 확정에는 없어도 된다. 1,000자까지 (공백뿐이어도 한도는 같다). 눈에 보이는 글자가 없으면 없는 것으로 본다
    ActionDecisionConflictProblem:
      description: 공통 오류 형식에 조치의 지금 상태와 마지막 이력을 더했다
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [currentStatus, lastDecision]
          properties:
            currentStatus:
              $ref: '#/components/schemas/ActionStatus'
            lastDecision:
              description: 그 조치의 마지막 이력. 누가 언제 지금의 상태로 바꿨는가. currentStatus 와 같은 때에 읽은 것이다
              oneOf:
                - $ref: '#/components/schemas/ActionDecision'
                - type: 'null'
    ActionBasis:
      type: object
      description: 조치의 근거. 변동이 생긴 행의 주 개체(근거 조항)와, 그 변동이 나온 입력 자료의 판
      required: [entity, inputSourceId, inputSourceLabel, editionNo, effectiveDate]
      properties:
        entity:
          $ref: '#/components/schemas/EntityRef'
        inputSourceId:
          type: string
        inputSourceLabel:
          type: string
          description: >-
            입력 자료의 이름표. Pack 의 매핑에 적은 화면에 보일 이름이다. 적지 않았으면 (또는 그 Pack 이
            적재되어 있지 않으면) 입력 자료의 id 와 같다
        editionNo:
          type: integer
          minimum: 1
        effectiveDate:
          type: string
          format: date
          description: 그 판의 적용일
    ChangeImpactScope:
      type: object
      required: [changeEventId, packId, asOfPrevious, asOfEffective, maxDepth, truncated, storedAt, total, offset, limit, countsByType, countsByDepth, targets]
      properties:
        changeEventId:
          type: string
        packId:
          type: string
        asOfPrevious:
          type: string
          format: date
          description: 계산에 쓴 두 날짜 가운데 판의 적용일 전날
        asOfEffective:
          type: string
          format: date
          description: 판의 적용일
        maxDepth:
          type: integer
          minimum: 1
          description: 계산에 쓴 최대 깊이
        truncated:
          type: boolean
          description: 최대 깊이에서 멈췄고 그 너머에 아직 찾지 못한 대상이 있는가
        storedAt:
          type: string
          format: date-time
          description: 저장한 때 (협정 세계시)
        total:
          type: integer
          minimum: 0
          description: 영향 대상의 전체 수. 나누기 전의 수다. 변동 대상 자신은 세지 않는다
        offset:
          type: integer
          minimum: 0
          description: 답에 쓴 건너뛴 수
        limit:
          type: integer
          minimum: 1
          description: 답에 쓴 한 번에 주는 수
        countsByType:
          type: array
          description: 개체 유형별 수. 합계는 total 과 같다
          items:
            type: object
            required: [entityType, count]
            properties:
              entityType:
                type: string
              count:
                type: integer
                minimum: 1
        countsByDepth:
          type: array
          description: 깊이별 수. 합계는 total 과 같다
          items:
            type: object
            required: [depth, count]
            properties:
              depth:
                type: integer
                minimum: 1
              count:
                type: integer
                minimum: 1
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ImpactTarget'
    EntityImpact:
      type: object
      description: 개체 하나에서 출발해 계산한 영향 범위. 저장된 것이 아니다
      required: [entityId, entity, packId, asOf, asOfPrevious, maxDepth, truncated, total, offset, limit, countsByType, countsByDepth, targets]
      properties:
        entityId:
          type: string
          description: 출발 개체의 id
        entity:
          $ref: '#/components/schemas/EntityRef'
        packId:
          type: string
          description: 출발 개체의 Pack. 영향 방향과 최대 깊이를 이 Pack 의 정의에서 읽었다
        asOf:
          type: string
          format: date
          description: 답에 쓴 조회 시점. 보내지 않았으면 서버가 정한 날짜다
        asOfPrevious:
          type: [string, 'null']
          format: date
          description: 함께 따라간 전날. includePreviousDay 를 주지 않았으면 null 이다
        maxDepth:
          type: integer
          minimum: 1
          description: 답에 쓴 최대 깊이
        truncated:
          type: boolean
          description: 최대 깊이에서 멈췄는데 그 너머에 아직 찾지 못한 대상이 있는가
        total:
          type: integer
          minimum: 0
          description: 영향 대상의 전체 수. 나누기 전의 수다
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        countsByType:
          type: array
          description: 개체 유형별 수. 합계는 total 과 같다
          items:
            type: object
            required: [entityType, count]
            properties:
              entityType:
                type: string
              count:
                type: integer
                minimum: 1
        countsByDepth:
          type: array
          description: 깊이별 수. 합계는 total 과 같다
          items:
            type: object
            required: [depth, count]
            properties:
              depth:
                type: integer
                minimum: 1
              count:
                type: integer
                minimum: 1
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ImpactTarget'
    ImpactTarget:
      type: object
      description: 영향 대상 하나와 거기에 이른 근거 경로
      required: [entityId, entityType, entity, depth, path]
      properties:
        entityId:
          type: string
        entityType:
          type: string
          description: 개체 유형. 계산할 때의 값
        entity:
          description: 영향 대상인 개체. 표시 이름은 판의 적용일(asOfEffective)의 값이다
          $ref: '#/components/schemas/EntityRef'
        depth:
          type: integer
          minimum: 1
          description: 깊이. 가장 가까운 변동 대상에서 건넌 관계의 수. 경로의 단계의 수와 같다
        path:
          $ref: '#/components/schemas/ImpactPath'
    ImpactPath:
      type: object
      required: [startEntityId, start, asOf, steps]
      properties:
        startEntityId:
          type: string
          description: 경로가 시작한 변동 대상 개체의 id
        start:
          description: 경로가 시작한 변동 대상 개체. 표시 이름은 판의 적용일의 값이다
          $ref: '#/components/schemas/EntityRef'
        asOf:
          type: string
          format: date
          description: 이 경로의 관계가 모두 유효한 날짜. asOfPrevious 와 asOfEffective 가운데 하나다
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ImpactPathStep'
    ImpactPathStep:
      type: object
      description: 따라간 관계 하나. 계산할 때의 내용이다
      required: [stepNo, relationId, relationType, sourceEntityId, targetEntityId, source, target]
      properties:
        stepNo:
          type: integer
          minimum: 1
          description: 변동 대상 쪽부터의 차례
        relationId:
          type: string
        relationType:
          type: string
        sourceEntityId:
          type: string
          description: 그 관계의 출발 개체의 id. 관계에 적힌 방향이다 (따라간 방향이 아니다)
        targetEntityId:
          type: string
          description: 그 관계의 도착 개체의 id
        source:
          description: 그 관계의 출발 개체. 표시 이름은 판의 적용일의 값이다
          $ref: '#/components/schemas/EntityRef'
        target:
          description: 그 관계의 도착 개체. 표시 이름은 판의 적용일의 값이다
          $ref: '#/components/schemas/EntityRef'
    EntityList:
      type: object
      required: [packId, asOf, q, total, offset, limit, entities]
      properties:
        packId:
          type: string
        asOf:
          type: string
          format: date
          description: 답에 쓴 조회 시점. 속성 값은 이 날짜에 유효한 것으로 찾았고, 표시 이름도 이 날짜의 값이다
        q:
          type: string
          description: 답에 쓴 검색어. 요청에 없었으면 빈 글자다
        total:
          type: integer
          minimum: 0
          description: 찾은 개체의 전체 수. 나누기 전의 수다
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        entities:
          type: array
          description: 찾은 개체 가운데 이 쪽의 것. id 의 글자 코드 순이다
          items:
            $ref: '#/components/schemas/EntityRef'
    ConstraintViolationList:
      type: object
      required: [packId, asOf, checked, maxRows, entityCount, relationCount, valueCount, total, offset, limit, violations]
      properties:
        packId:
          type: string
        asOf:
          type: string
          format: date
          description: 답에 쓴 조회 시점
        checked:
          type: boolean
          description: >-
            검사했는가. 자료(개체, 관계, 속성 값의 수를 더한 것)가 maxRows 보다 크면 false 이고, 그때 total 은 0 이고
            violations 는 비어 있다. 화면은 위반이 없다고 보이지 않고 검사하지 못했다고 알린다
        maxRows:
          type: integer
          minimum: 1
          description: 한 번에 검사하는 자료의 한도
        entityCount:
          type: integer
          minimum: 0
          description: 그 Pack 의 개체의 수. 검사한 수가 아니다 (값도 관계도 없는 개체도 센다)
        relationCount:
          type: integer
          minimum: 0
          description: 조회 시점에 유효한 관계의 수
        valueCount:
          type: integer
          minimum: 0
          description: 조회 시점에 유효한 속성 값의 수
        total:
          type: integer
          minimum: 0
          description: 위반의 전체 수. 나누기 전의 수다. 화면은 다시 세지 않는다
        offset:
          type: integer
          minimum: 0
          description: 답에 쓴 건너뛴 수
        limit:
          type: integer
          minimum: 1
          description: 답에 쓴 한 번에 주는 수
        violations:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintViolation'
    ConstraintViolation:
      type: object
      description: 제약의 위반 하나
      required: [severity, entity, pathKind, pathName, pathLabel, value, valueEntity, constraintKind, constraintName, message]
      properties:
        severity:
          type: string
          enum: [VIOLATION, WARNING, INFO]
          description: 심각도. 제약에 sh:severity 를 적지 않았으면 VIOLATION 이다. 그것을 적은 제약의 것이다 (바깥 제약에서 내려받지 않는다)
        entity:
          description: 제약을 어긴 개체. 표시 이름은 조회 시점의 값이다. 제약의 대상이 개체가 아니면 (값을 대상으로 삼은 제약) null
          oneOf:
            - $ref: '#/components/schemas/EntityRef'
            - type: 'null'
        pathKind:
          type: string
          enum: [ATTRIBUTE, RELATION, EXPRESSION, NONE]
          description: 어긴 곳이 속성인가, 관계인가, 경로의 식인가, 개체 자신인가 (NONE)
        pathName:
          type: [string, 'null']
          description: 속성이나 관계 유형의 이름. 경로의 식이면 그 식을 적은 글자. 개체 자신이면 null
        pathLabel:
          type: [string, 'null']
          description: 속성이나 관계 유형의 이름표. 경로의 식이거나 개체 자신이면 null
        value:
          type: [string, 'null']
          description: 어긴 값. 저장된 글자 그대로다. 값 하나에 걸린 제약이 아니거나 값이 개체이면 null
        valueEntity:
          description: 어긴 값이 개체일 때 그 개체 (관계가 가리키는 개체). 아니면 null
          oneOf:
            - $ref: '#/components/schemas/EntityRef'
            - type: 'null'
        constraintKind:
          type: string
          description: >-
            제약의 종류. SHACL 의 제약 구성요소의 이름에서 뒤의 ConstraintComponent 를 뗀 것이다
            (MinCount, MaxCount, Datatype, Class, MinInclusive, Pattern, Or …)
        constraintName:
          type: [string, 'null']
          description: 그 제약이 딸린, 이름 있는 제약의 이름 (Pack 의 제약 파일에 적은 이름). 없으면 null
        message:
          type: string
          description: 알리는 문구. 제약에 sh:message 를 적었으면 그것이고, 아니면 제품이 제약의 종류마다 만든 한국어 문구다
    EditionList:
      type: object
      required: [packId, total, offset, limit, editions]
      properties:
        packId:
          type: string
        total:
          type: integer
          minimum: 0
          description: 그 Pack 의 판의 전체 수. 나누기 전의 수다. 화면은 다시 세지 않는다
        offset:
          type: integer
          minimum: 0
          description: 답에 쓴 건너뛴 수
        limit:
          type: integer
          minimum: 1
          description: 답에 쓴 한 번에 주는 수
        editions:
          type: array
          items:
            $ref: '#/components/schemas/EditionListItem'
    EditionListItem:
      type: object
      description: 받아들인 판 하나. 수는 저장된 것을 센 값이다
      required: [editionId, inputSourceId, inputSourceLabel, editionNo, effectiveDate, receivedAt, fileName, itemCount, changeCount, noticeCount]
      properties:
        editionId:
          type: string
          description: 판의 id
        inputSourceId:
          type: string
        inputSourceLabel:
          type: string
          description: >-
            입력 자료의 이름표. Pack 의 매핑에 적은 화면에 보일 이름이다. 적지 않았으면 (또는 그 Pack 이
            적재되어 있지 않으면) 입력 자료의 id 와 같다
        editionNo:
          type: integer
          description: 그 입력 자료 안에서의 판 번호. 1 부터
        effectiveDate:
          type: string
          format: date
          description: 판의 적용일
        receivedAt:
          type: string
          format: date-time
          description: 받은 때. 협정 세계시다
        fileName:
          type: [string, 'null']
          description: 받은 파일의 이름. 없으면 null
        itemCount:
          type: integer
          minimum: 0
          description: 받아들인 항목의 수
        changeCount:
          type: integer
          minimum: 0
          description: 바뀐 항목(변동 이벤트)의 수. 첫 판이면 0 이다
        noticeCount:
          type: integer
          minimum: 0
          description: 투입의 알림의 수
    EditionSubmission:
      type: object
      required: [outcome, editionId, packId, inputSourceId, inputSourceLabel, editionNo, effectiveDate, itemCount, changes, notices, retriedChanges, processingNotStarted]
      properties:
        outcome:
          type: string
          enum: [ACCEPTED, UNCHANGED]
          description: ACCEPTED 는 새 판을 만들었다. UNCHANGED 는 내용이 바로 앞 판과 같아 판을 만들지 않았다
        editionId:
          type: string
          description: 만든 판의 id. UNCHANGED 면 내용이 같았던 앞 판의 id
        packId:
          type: string
        inputSourceId:
          type: string
        inputSourceLabel:
          type: string
          description: >-
            입력 자료의 이름표. Pack 의 매핑에 적은 화면에 보일 이름이다. 적지 않았으면 (또는 그 Pack 이
            적재되어 있지 않으면) 입력 자료의 id 와 같다
        editionNo:
          type: integer
          minimum: 1
          description: 그 입력 자료 안에서의 판 번호
        effectiveDate:
          type: string
          format: date
          description: 그 판의 적용일. UNCHANGED 면 앞 판의 것이다
        itemCount:
          type: integer
          minimum: 0
          description: 받아들인 항목(행)의 수. UNCHANGED 면 0
        changes:
          type: array
          description: 앞 판과 비교해 바뀐 항목. 첫 판이거나 UNCHANGED 면 비어 있다
          items:
            $ref: '#/components/schemas/EditionChange'
        notices:
          type: array
          description: 투입의 알림 (건너뛴 행 등). UNCHANGED 면 비어 있다
          items:
            $ref: '#/components/schemas/EditionNotice'
        retriedChanges:
          type: array
          description: 이 요청이 함께 다시 처리한, 앞선 판의 변동. 전에 처리에 실패해 남아 있던 것이다. 보통 비어 있다
          items:
            $ref: '#/components/schemas/RetriedChange'
        processingNotStarted:
          type: boolean
          description: >-
            판은 받아들였지만 변동의 처리를 시작하지 못했는가. true 면 changes 의 처리 상태는 모두 PENDING 이고,
            다음에 받아들여진 판을 올릴 때 처리된다
    EditionChange:
      type: object
      required: [changeEventId, itemKey, kind, primaryEntityId, primaryEntity, targetEntityIds, targetEntities, changedValues, processing]
      properties:
        changeEventId:
          type: string
          description: 변동 이벤트의 id
        itemKey:
          type: string
          description: 바뀐 항목의 키
        changedValues:
          type: [array, 'null']
          description: >-
            그 행에서 바뀐 속성 값. 개체의 id, 속성의 이름의 글자 코드 순이다. 빈 목록은 바뀐 속성 값이 없다는 뜻이고,
            null 은 이전 값을 알 수 없다는 뜻이다 (바뀐 값을 남기기 전에 들어간 판과 견준 변동)
          items:
            $ref: '#/components/schemas/ChangedValue'
        kind:
          type: string
          enum: [ADDED, CHANGED, REMOVED]
          description: 추가, 변경, 삭제
        primaryEntityId:
          type: string
          description: 그 행의 주 개체의 id. 조치의 근거가 된다
        primaryEntity:
          description: >-
            그 행의 주 개체. primaryEntityId 와 같은 개체를 유형, 키, 표시 이름과 함께 준다. 표시 이름은 그 판의
            적용일의 값이다 (그 판에서 없어진 개체는 값이 없을 수 있다)
          $ref: '#/components/schemas/EntityRef'
        targetEntityIds:
          type: array
          description: 변동 대상 개체의 id. 글자 코드 순이다
          items:
            type: string
        targetEntities:
          type: array
          description: 변동 대상 개체. targetEntityIds 와 같은 개체를 같은 차례로 준다. 표시 이름은 그 판의 적용일의 값이다
          items:
            $ref: '#/components/schemas/EntityRef'
        processing:
          $ref: '#/components/schemas/ChangeProcessing'
    ChangedValue:
      type: object
      description: 그 행에서 바뀐 속성 값 하나. before 와 after 는 저장한 글자 그대로다
      required: [entityId, entity, attributeName, attributeLabel, before, after, beforeDisplay, afterDisplay]
      properties:
        entityId:
          type: string
          description: 어느 개체의 속성인가
        entity:
          description: 그 개체. entityId 와 같은 개체를 유형, 키, 표시 이름과 함께 준다. 표시 이름은 그 판의 적용일의 값이다
          $ref: '#/components/schemas/EntityRef'
        attributeName:
          type: string
          description: 속성의 이름
        attributeLabel:
          type: string
          description: Pack 이 정한 속성의 이름표. 없으면 속성의 이름이다
        before:
          type: [string, 'null']
          description: 앞 판에서 그 행이 넣었던 값. 없었으면 null (추가된 행, 빈 칸이던 속성)
        after:
          type: [string, 'null']
          description: 새 판에서 그 행이 넣은 값. 없어졌으면 null (삭제된 행, 빈 칸이 된 속성)
        beforeDisplay:
          type: [string, 'null']
          description: >-
            before 를 화면에 보일 글자. 참·거짓 속성이면 true 는 "예", false 는 "아니오" 다. 그 밖의 속성은 before 와
            같다. before 가 null 이면 null
        afterDisplay:
          type: [string, 'null']
          description: after 를 화면에 보일 글자. 규칙은 beforeDisplay 와 같다
    ChangeProcessing:
      type: object
      description: 변동 하나를 영향 범위 계산과 조치 생성까지 처리한 결과
      required: [status, failedStage, failureCode, failures, actionCount]
      properties:
        status:
          type: string
          enum: [PROCESSED, FAILED, PENDING]
          description: >-
            PROCESSED 는 조치까지 저장했다. FAILED 는 실패했고 뒤에 다시 시도된다 (다음에 받아들여진 판을 올릴 때,
            또는 관리자가 다시 처리할 때). PENDING 은 아직 처리하지 못했다
        failedStage:
          type: [string, 'null']
          enum: [IMPACT, RULES, null]
          description: 실패했을 때 어느 단계인가. IMPACT 는 영향 범위 계산, RULES 는 규칙 실행. 아니면 null
        failureCode:
          type: [string, 'null']
          description: 실패한 이유의 코드. 아니면 null. 문구가 아니다. 화면이 코드마다 안내문을 보여 준다
        failures:
          type: array
          description: >-
            평가에 실패한 규칙 (failureCode 가 RULE_FAILED 일 때). 규칙 번호 순이다. 그 밖의 실패와 실패가 아닌
            것은 빈 목록이다
          items:
            $ref: '#/components/schemas/ChangeFailure'
        actionCount:
          type: integer
          minimum: 0
          description: 그 변동에서 만들어진 조치의 수. 처리되지 않았으면 0
    ChangeFailure:
      type: object
      description: 평가에 실패한 규칙 하나와 그 까닭
      required: [ruleNo, code, entityId, attributeName, value]
      properties:
        ruleNo:
          type: string
          description: 규칙 번호
        code:
          type: string
          description: 까닭의 코드. 문구가 아니다 (예. VALUE_FORMAT_MISMATCH, DUE_DATE_OUT_OF_RANGE)
        entityId:
          type: [string, 'null']
          description: 걸린 개체의 id. 없으면 null
        attributeName:
          type: [string, 'null']
          description: 걸린 속성의 이름. 없으면 null
        value:
          type: [string, 'null']
          description: 걸린 값. 없으면 null
    EditionComparison:
      type: object
      required: [packId, from, to, changes]
      properties:
        packId:
          type: string
        from:
          $ref: '#/components/schemas/ComparedEdition'
        to:
          $ref: '#/components/schemas/ComparedEdition'
        changes:
          type: array
          description: 바뀐 항목. 항목의 키의 글자 코드 순이다
          items:
            $ref: '#/components/schemas/ComparedChange'
    ComparedEdition:
      type: object
      required: [editionId, inputSourceId, inputSourceLabel, editionNo, effectiveDate]
      properties:
        editionId:
          type: string
        inputSourceId:
          type: string
        inputSourceLabel:
          type: string
        editionNo:
          type: integer
          minimum: 1
        effectiveDate:
          type: string
          format: date
    ComparedChange:
      type: object
      description: >-
        두 판을 견줘 나온 바뀐 항목 하나. 판 하나의 바뀐 항목(EditionChange)과 같은 내용이고, 변동 이벤트의 id 와 처리
        결과가 없다: 견준 것은 저장되지 않는다
      required: [itemKey, kind, primaryEntityId, primaryEntity, targetEntityIds, targetEntities, changedAttributes,
                 changedRelationTypes, changedValues]
      properties:
        itemKey:
          type: string
        kind:
          type: string
          description: from 에 없고 to 에 있으면 ADDED, 거꾸로면 REMOVED, 둘에 있고 그 행이 만든 것이 다르면 CHANGED
          enum: [ADDED, CHANGED, REMOVED]
        primaryEntityId:
          type: string
        primaryEntity:
          description: 그 행의 주 개체. 표시 이름은 to 의 적용일의 값이다
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        targetEntityIds:
          type: array
          items:
            type: string
        targetEntities:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
        changedAttributes:
          type: array
          description: 그 행에서 바뀐 속성의 이름. 글자 코드 순
          items:
            type: string
        changedRelationTypes:
          type: array
          description: 그 행에서 바뀐 관계 유형의 이름. 글자 코드 순
          items:
            type: string
        changedValues:
          description: >-
            그 행에서 바뀐 속성 값의 앞뒤. before 는 from 의 값, after 는 to 의 값이다. 값을 남기기 전에 들어간 판과
            견줬으면 null 이다 (모른다)
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ChangedValue'
            - type: 'null'
    ChangeEventList:
      type: object
      required: [packId, status, total, offset, limit, changes]
      properties:
        packId:
          type: string
        status:
          type: [string, 'null']
          description: 답에 쓴 거르는 상태. 요청에 없었으면 null 이다
        total:
          type: integer
          minimum: 0
          description: 거른 변동의 전체 수. 나누기 전의 수다
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        changes:
          type: array
          description: 이 쪽의 변동 이벤트. 가장 최근에 받은 판의 것부터다
          items:
            $ref: '#/components/schemas/ChangeEventListItem'
    ChangeEventListItem:
      type: object
      required: [changeEventId, editionId, inputSourceId, inputSourceLabel, editionNo, effectiveDate, itemKey, kind,
                 primaryEntityId, primaryEntity, status, failedStage, failureCode, actionCount, impactTargetCount]
      properties:
        changeEventId:
          type: string
        editionId:
          type: string
          description: 그 변동이 나온 판의 id
        inputSourceId:
          type: string
        inputSourceLabel:
          type: string
        editionNo:
          type: integer
          minimum: 1
        effectiveDate:
          type: string
          format: date
          description: 그 판의 적용일
        itemKey:
          type: string
          description: 항목의 키
        kind:
          type: string
          enum: [ADDED, CHANGED, REMOVED]
        primaryEntityId:
          type: string
        primaryEntity:
          description: 그 행의 주 개체. 표시 이름은 그 판의 적용일의 값이다
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        status:
          type: string
          enum: [PENDING, PROCESSED, FAILED]
        failedStage:
          type: [string, 'null']
          description: 실패했을 때 어느 단계인가 (IMPACT, RULES). 아니면 null
        failureCode:
          type: [string, 'null']
        actionCount:
          type: integer
          minimum: 0
          description: 그 변동에 저장된 조치의 수. 상태를 가리지 않고 센다
        impactTargetCount:
          type: [integer, 'null']
          minimum: 0
          description: >-
            저장된 영향 범위의 영향 대상의 수. 영향 범위가 저장되지 않은 변동 (대기인 변동, 어느 단계에서든 실패한 변동)은
            null 이다. 규칙 실행에서 실패한 변동도 아무것도 저장되지 않는다.
            0 은 계산했더니 영향 대상이 없다는 뜻이다
    UnprocessedChangeList:
      type: object
      required: [packId, changes]
      properties:
        packId:
          type: string
        changes:
          type: array
          description: 처리되지 않은 변동. 처리하는 차례다
          items:
            $ref: '#/components/schemas/UnprocessedChange'
    UnprocessedChange:
      type: object
      required: [changeEventId, editionId, inputSourceId, inputSourceLabel, editionNo, effectiveDate, itemKey, kind, primaryEntityId, primaryEntity, processing]
      properties:
        changeEventId:
          type: string
        editionId:
          type: string
          description: 그 변동이 나온 판의 id
        inputSourceId:
          type: string
        inputSourceLabel:
          type: string
          description: >-
            입력 자료의 이름표. Pack 의 매핑에 적은 화면에 보일 이름이다. 적지 않았으면 (또는 그 Pack 이
            적재되어 있지 않으면) 입력 자료의 id 와 같다
        editionNo:
          type: integer
        effectiveDate:
          type: string
          format: date
          description: 그 판의 적용일
        itemKey:
          type: string
        kind:
          type: string
          enum: [ADDED, CHANGED, REMOVED]
        primaryEntityId:
          type: string
        primaryEntity:
          description: 그 행의 주 개체. 유형, 키, 표시 이름과 함께 준다. 표시 이름은 그 변동이 나온 판의 적용일의 값이다
          $ref: '#/components/schemas/EntityRef'
        processing:
          $ref: '#/components/schemas/ChangeProcessing'
    ChangeReprocessingRequest:
      type: object
      required: [packId]
      properties:
        packId:
          type: string
    ChangeReprocessing:
      type: object
      required: [packId, processedCount, failedCount, changes]
      properties:
        packId:
          type: string
        processedCount:
          type: integer
          minimum: 0
          description: changes 가운데 처리된 것의 수
        failedCount:
          type: integer
          minimum: 0
          description: changes 가운데 다시 실패한 것의 수
        changes:
          type: array
          description: 이 요청이 다시 처리한 변동과 그 결과. 처리한 차례다. 처리할 것이 없었으면 빈 목록
          items:
            $ref: '#/components/schemas/RetriedChange'
    RetriedChange:
      type: object
      required: [changeEventId, editionId, itemKey, processing]
      properties:
        changeEventId:
          type: string
        editionId:
          type: string
          description: 그 변동이 나온 판의 id
        itemKey:
          type: string
        processing:
          $ref: '#/components/schemas/ChangeProcessing'
    EditionNotice:
      type: object
      description: 투입의 알림 하나. 종류와 이유의 코드와 값, 그리고 그것을 풀어 쓴 문구다
      required: [kind, rowNo, code, subject, detail, message]
      properties:
        kind:
          type: string
          description: 종류. SKIPPED_ROW, REFERENCE_ONLY_ENTITY, ATTRIBUTE_CONFLICT, RELATION_CONFLICT, PERIOD_ADJUSTED
        rowNo:
          type: integer
          description: 걸린 행의 번호
        code:
          type: string
          description: 이유의 코드
        subject:
          type: [string, 'null']
          description: 걸린 열의 이름이나 개체·속성의 id. 없으면 null
        detail:
          type: [string, 'null']
          description: 걸린 값. 없으면 null
        message:
          type: string
          description: >-
            사용자에게 보이는 한국어 문구. 몇 번째 행의 어느 열(또는 어느 개체의 어느 속성)이 왜 걸렸는지와
            무엇을 하면 되는지를 적는다. 화면이 가르는 데는 kind 와 code 를 쓴다: 문구는 바뀔 수 있다
    EditionRejectedProblem:
      description: 공통 오류 형식에 거부한 이유를 더했다
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [reasonCode, reasonDetail]
          properties:
            reasonCode:
              type: string
              description: 거부한 이유의 코드. 투입 기록에 남은 것과 같다
            reasonDetail:
              type: [string, 'null']
              description: 거부한 이유의 값 (예. 없는 열의 이름). 없으면 null
    Problem:
      type: object
      description: RFC 9457 의 항목에 code 와 field 를 더했다
      required: [title, status, detail, code]
      properties:
        type:
          type: string
          description: 오류 종류의 주소. 따로 정하지 않은 오류는 about:blank
        title:
          type: string
          description: 오류 종류의 짧은 이름
        status:
          type: integer
          description: HTTP 상태
        detail:
          type: string
          description: 사용자에게 보이는 한국어 문구. 무엇을 하면 되는지까지 적는다
        code:
          type: string
          description: 오류의 종류. 화면이 이것으로 가른다. 바뀌지 않는 값이다
          enum: [MISSING_ENTITY_ID, INVALID_AS_OF, ENTITY_NOT_FOUND, MISSING_LOGIN_ID, MISSING_PASSWORD, LOGIN_FAILED, MISSING_PACK_ID, MISSING_INPUT_SOURCE_ID, MISSING_EFFECTIVE_DATE, INVALID_EFFECTIVE_DATE, MISSING_FILE, INVALID_EDITION, PACK_NOT_FOUND, INPUT_SOURCE_NOT_FOUND, FILE_TOO_LARGE, EDITION_REJECTED, INVALID_STATUS, MISSING_ACTION_ID, INVALID_ACTION_ID, ACTION_NOT_FOUND, INVALID_BODY, MISSING_DECISION, INVALID_DECISION, INVALID_NOTE, ACTION_DECISION_CONFLICT, MISSING_CHANGE_EVENT_ID, INVALID_CHANGE_EVENT_ID, IMPACT_SCOPE_NOT_FOUND, UNAUTHENTICATED, FORBIDDEN, INTERNAL, INVALID_PACK_ID, PACK_FOLDER_NOT_FOUND, PACK_INVALID, PACK_CHANGE_REJECTED, INVALID_OFFSET, INVALID_LIMIT, INVALID_ENTITY_ID]
        field:
          type: string
          description: 틀린 항목의 이름. 입력 오류일 때만 있다
        problems:
          type: array
          description: code 가 PACK_INVALID 일 때만 있다. Pack 에서 찾은 문제 전부. pack 이 준 순서 그대로다
          items:
            $ref: '#/components/schemas/PackProblem'
        reasons:
          type: array
          description: code 가 PACK_CHANGE_REJECTED 일 때만 있다. 이미 적재된 정의와 맞지 않는 곳. pack 이 준 순서 그대로다
          items:
            type: string
