# 제조 안전 Pack 의 검증 질문. 형식은 D4 3절이다.
#
# 상태: Q-01 ~ Q-26 은 확정 (2026-11-22, D2 AD-315). Q-27 부터는 초안이다 (2026-11-26, D2 AD-400: 새 공정을 들이는 판을 더했다.
# 대표가 확정하기 전이다). 자료나 규칙을 바꿔 정답이 달라지면 다시 확정한다 (D4 4절: 정답은 대표가 정한다).
# 모든 이름과 값은 지어낸 것이다. 실제 회사, 현장, 법령, 문서와 관계가 없다.
#
# 정답을 만든 방법: 자료가 커서 (개체 157개) 손으로 적지 않았다. 예시 입력 파일에서 문서의 규칙
# (D3 6절·7절의 변동 대상과 영향 범위, D8 의 두 날짜와 규칙의 조건, D7 의 순서)을 엔진과 따로 구현한 계산으로 만들었다.
# 제품이 낸 답을 옮겨 적은 것이 아니다. 질문마다 무엇 때문에 그 답인지를 주석으로 적었다.
#
# 골든셋 (시연의 CQ-01 ~ CQ-10) 과의 대응 (카드 T-08, D2 AD-421). 대응하는 질문에는 golden 으로 번호를 적었다.
#   CQ-01, CQ-02 (어느 날짜에 유효한 문서의 판): Q-42, Q-43 (속성 값의 시점 조회. 초안)
#   CQ-03 (한 인원의 두 날짜의 배치): Q-02, Q-03
#   CQ-04 (두 판에서 바뀐 항목): Q-06     CQ-05 (영향 범위의 집계): Q-09     CQ-06 (조치와 근거): Q-12
#   CQ-07 (결함 레코드의 격리와 신뢰도): 질문 없음. 기능 1-4 의 카드(범위 대조 문서의 4-9)에서 생긴다
#   CQ-08 (권한 없는 역할에게 건강 정보를 가린다): 질문 없음. 기능 5-1 의 카드(범위 대조 문서의 3-3)에서 생긴다
#   CQ-09 (읽기만 하는 토큰의 등록은 403): 부분. 서버 시험이 담당자의 Pack 적재가 403 인 것을 본다. 질문은 없다:
#          읽기만 하는 역할과 등록 API 의 카드(범위 대조 문서의 3-1, 4-2)에서 생긴다
#   CQ-10 (서명이 훼손된 피드의 거부): 질문 없음. 기능 3-3 의 카드(범위 대조 문서의 3-7, 4-4)에서 생긴다
#
# 개체는 유형의 이름과 입력의 키로 가리킨다. 목록의 순서는 제품이 내놓는 순서다 (D4 4절, D2 AD-282).
# 영향 범위와 조치는 판을 투입한 직후에 그때의 자료로 한 번 계산해 저장한 것이다 (D2 AD-119).
# 영향이 퍼지는 길: 물질안전자료 → 화학물질 → 제조공정·약품보관소·법정요건 → 공정설비·작업인원 (최대 깊이 3).
#
# 이 질문들이 묻지 않는 것: 길이가 같은 근거 경로가 둘인 경우, 관계 유형과 상대 개체가 같은 관계가 둘인 경우.
# 정답을 만든 계산이 그 두 규칙(관계 식별자로 가리기)을 구현하지 않아 그런 자료를 넣지 않았다.
# 그 규칙은 엔진의 일반 시험과 시험용 Pack 의 질문이 본다.

scenario:
  id: S-01
  title: 물질안전자료가 두 번 바뀌고 인원이 옮기고 공정이 운영을 시작하고 물질의 이름을 고치고 물질 하나를 쓰지 않게 되고 새 공정을 들인다
