  # ── 속성 값의 시점 조회 (초안, 2026-11-27, 카드 T-08, D2 AD-421) ─────────────
  # 정답을 만든 방법: 물질안전자료의 파일 넷(data/safety-sheet-v1 ~ v4.csv)에서 SDS-01 의 행을 판마다 읽어 손으로 적었다.
  # 판의 적용일은 시나리오의 3, 21, 27, 28단계다 (2026-01-01, 2026-09-02, 2026-11-20, 2026-12-10).
  # 값의 시작일은 그 값이 처음 적힌 판의 적용일이고, 종료일은 다른 값이 적힌 다음 판의 적용일이다 (시작일 포함, 종료일 제외).
  # 값이 그대로면 이어진다 (노출기준값 0.5 는 네 판 모두 같다). 참·거짓은 true, false 로 저장된다 (D6 5절).
  # 순서는 속성의 이름의 글자 코드 순이다 (D7 4절 "속성 값의 시점 조회").

  - id: Q-42
    kind: attribute-values-as-of
    title: 불산 자료 SDS-01 이 7판이 된 날의 속성 값 (새 시작일 당일. 초안)
    golden: CQ-01
    asOf: 2026-09-02
    entity: { type: 물질안전자료, key: SDS-01 }
    # 둘째 판(21단계)의 행: 7, 2026-09-02, 급성독성 구분2, 0.5, 예. 셋째 판(2026-11-20)에서 판번호, 개정일, 유해성구분이 다시 바뀐다.
    # 자료특별관리는 셋째, 넷째 판에서도 예라 종료일이 없다.
    expect:
      values:
        - { attribute: 노출기준값, value: "0.5", validFrom: 2026-01-01, validTo: null }
        - { attribute: 유해성구분, value: 급성독성 구분2, validFrom: 2026-09-02, validTo: 2026-11-20 }
        - { attribute: 자료개정일, value: "2026-09-02", validFrom: 2026-09-02, validTo: 2026-11-20 }
        - { attribute: 자료특별관리, value: "true", validFrom: 2026-09-02, validTo: null }
        - { attribute: 자료판번호, value: "7", validFrom: 2026-09-02, validTo: 2026-11-20 }

  - id: Q-43
    kind: attribute-values-as-of
    title: 불산 자료 SDS-01 이 7판이 되기 전날의 속성 값 (종료일 전날. 초안)
    golden: CQ-02
    asOf: 2026-09-01
    entity: { type: 물질안전자료, key: SDS-01 }
    # 첫 판(3단계)의 행: 6, 2025-01-15, 급성독성 구분3, 0.5, 아니오. 2026-09-02 에 넷이 바뀌므로 그날이 종료일이다.
    expect:
