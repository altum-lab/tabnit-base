# 퇴직연금 Pack 의 검증 질문. 형식은 D4 3절이다.
#
# 상태: 확정 (2026-11-22, D2 AD-315). 자료나 규칙을 바꿔 정답이 달라지면 다시 확정한다 (D4 4절: 정답은 대표가 정한다).
# B-09 와 B-14 에서 달라진 Q-08, Q-16, Q-31 은 다시 확정했다 (2026-11-22, D2 AD-342).
# 관계 지도의 질문 Q-32 ~ Q-36 은 초안이다 (2026-11-23, A-08, D2 AD-368). 대표가 확정하기 전이다.
# 모든 이름은 지어낸 것이다. 실제 기관, 사업장, 사람, 규정과 관계가 없다.
#
# 정답을 만든 방법: 자료가 커서 (개체 362개) 손으로 적지 않았다. 예시 입력 파일에서 문서의 규칙
# (D3 6절·7절의 변동 대상과 영향 범위, D8 의 두 날짜와 규칙의 조건, D7 의 순서)을 엔진과 따로 구현한 계산으로 만들었다
# (tools/packs/retirement-pension-build.py). 제품이 낸 답을 옮겨 적은 것이 아니다. 질문마다 무엇 때문에 그 답인지를 주석으로 적었다.
#
# 개체는 유형의 이름과 입력의 키로 가리킨다. 목록의 순서는 제품이 내놓는 순서다 (D4 4절, D2 AD-282).
# 영향 범위와 조치는 판을 투입한 직후에 그때의 자료로 한 번 계산해 저장한 것이다 (D2 AD-119).
# 영향이 퍼지는 길: 운영규약 → 운영요건 → 운용상품·연금제도·금융기관·기본운용방법, 금융기관 → 운용상품 → 기본운용방법·연금계좌,
# 기본운용방법·연금제도 → 연금계좌 → 연금가입자 → 가입사업장 → 기업담당자, 연금제도 → 가입사업장 (최대 깊이 5).
# 한 대상에 길이가 같은 길이 여럿이면 관계 식별자가 앞선 길이 남는다 (D3 7절). 이 자료에는 그런 대상이 많다.
#
# 이 질문들이 묻지 않는 것: 관계 유형과 상대 개체가 같은 관계가 둘인 경우 (정답을 만든 계산이 구현하지 않았다).
#
# 전수 대조: 이 시나리오의 모든 변동의 영향 범위와 모든 개체의 경계 날짜의 관계를 같은 계산으로 만들어
# questions/crosscheck/S-01.yaml 에 따로 두었다 (D4 3절 "전수 대조"). 질문이 아니다: 질문의 수에 넣지 않는다.

scenario:
  id: S-01
  title: 위험자산 한도가 내려가고 보유가 바뀌고 금융기관의 등급이 내려가고 퇴직 통보가 들어오고 적립비율이 바뀌고 규약의 이름이 바뀐다
  steps:
    # 2026-01-01: 처음 자료가 들어온다. 모두 첫 판이라 변동은 없다.
    - { step: 1, inputSource: regulation, file: data/regulation-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 2, inputSource: requirement, file: data/requirement-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 3, inputSource: institution, file: data/institution-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 4, inputSource: product, file: data/product-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 5, inputSource: default-option, file: data/default-option-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 6, inputSource: default-option-product, file: data/default-option-product-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 7, inputSource: group, file: data/group-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 8, inputSource: manager, file: data/manager-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 9, inputSource: employer, file: data/employer-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 10, inputSource: plan, file: data/plan-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 11, inputSource: plan-employer, file: data/plan-employer-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 12, inputSource: participant, file: data/participant-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 13, inputSource: account, file: data/account-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 14, inputSource: account-product, file: data/account-product-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 15, inputSource: requirement-product, file: data/requirement-product-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 16, inputSource: requirement-plan, file: data/requirement-plan-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 17, inputSource: requirement-institution, file: data/requirement-institution-v1.csv, effectiveDate: 2026-01-01 }
    - { step: 18, inputSource: requirement-default-option, file: data/requirement-default-option-v1.csv, effectiveDate: 2026-01-01 }
    # 2026-04-01: 위험자산 편입 한도(RQ-01)가 0.8 에서 0.7 로 내려간다. RQ-05 는 이름만 바뀐다.
    - { step: 19, inputSource: requirement, file: data/requirement-v2.csv, effectiveDate: 2026-04-01 }
    # 2026-06-01: 계좌 셋이 상품 하나씩을 팔고, 계좌 둘이 상품 하나씩을 새로 산다.
    - { step: 20, inputSource: account-product, file: data/account-product-v2.csv, effectiveDate: 2026-06-01 }
    # 2026-08-18: 저축은행 다(I-03)의 등급이 BBB 에서 BB+ 로 내려간다 (점수 11 → 9). 저축은행 라(I-04)는 BBB- 가 된다 (점수 10). 저축은행 마(I-05)는 오른다. 보험 바(I-06)는 BB+ 가 된다 (점수 9). 여신전문 차(I-10)는 이름만 바뀐다.
    - { step: 21, inputSource: institution, file: data/institution-v2.csv, effectiveDate: 2026-08-18 }
    # 2026-10-01: 퇴직 통보. N-003, N-015, N-040 은 퇴직일 2026-09-30, N-052 는 2026-10-01, N-066 은 예정(2026-10-31). N-077 은 출생연도만 고친다.
    - { step: 22, inputSource: participant, file: data/participant-v2.csv, effectiveDate: 2026-10-01 }
    # 2026-10-06: 확정급여 제도의 적립비율이 바뀐다. 0.95 미만은 L-02 (0.91), L-03 (0.78), L-04 (0.88). L-06 은 꼭 0.95 다.
    - { step: 23, inputSource: plan, file: data/plan-v2.csv, effectiveDate: 2026-10-06 }
    # 2026-11-01: 계좌 A-013 가 상품 P-07 를 판다. 그 뒤에 같은 날의 규약이 들어온다 (차례가 정답에 닿는다).
    - { step: 24, inputSource: account-product, file: data/account-product-v3.csv, effectiveDate: 2026-11-01 }
    # 2026-11-01: 규약 RG-05 의 이름이 바뀐다.
    - { step: 25, inputSource: regulation, file: data/regulation-v2.csv, effectiveDate: 2026-11-01 }

# 시점: 과거 2026-05-31 / 2026-06-01 (보유가 바뀌는 경계), 2026-09-30 / 2026-10-01 (재직이 끝나는 경계), 현재 2026-12-01 (마지막 판 뒤).

questions:

  # ── 시점 조회 ──────────────────────────────────────────────

  - id: Q-01
    kind: relations-as-of
    title: 가입자 N-003 이 퇴직하기 전날의 관계 (종료일 전날)
    asOf: 2026-09-30
    entity: { type: 연금가입자, key: N-003 }
    # 재직은 2026-10-01 에 끝난다. 전날에는 사업장 E-07 의 재직이 아직 유효하다. 이 가입자의 계좌도 든다. 순서는 관계 유형, 상대 개체.
    expect:
      relations:
        - { type: 계좌소유, source: { type: 연금계좌, key: A-003 }, target: { type: 연금가입자, key: N-003 }, validFrom: 2026-01-01, validTo: null }
        - { type: 사업장재직, source: { type: 연금가입자, key: N-003 }, target: { type: 가입사업장, key: E-07 }, validFrom: 2026-01-01, validTo: 2026-10-01 }

  - id: Q-02
    kind: relations-as-of
    title: 가입자 N-003 의 재직이 끝난 날의 관계 (종료일 당일)
    asOf: 2026-10-01
    entity: { type: 연금가입자, key: N-003 }
    # 재직은 이날 끝나 들지 않는다. 계좌를 가진 관계는 그대로다.
    expect:
      relations:
        - { type: 계좌소유, source: { type: 연금계좌, key: A-003 }, target: { type: 연금가입자, key: N-003 }, validFrom: 2026-01-01, validTo: null }

  - id: Q-03
    kind: relations-as-of
    title: 계좌 A-005 가 상품을 팔기 전날의 관계
    asOf: 2026-05-31
    entity: { type: 연금계좌, key: A-005 }
    # 보유는 2026-06-01 에 바뀐다. 전날에는 처음의 보유 그대로다. 가입자, 제도, 지정한 기본운용방법도 든다.
    expect:
      relations:
        - { type: 계좌소유, source: { type: 연금계좌, key: A-005 }, target: { type: 연금가입자, key: N-005 }, validFrom: 2026-01-01, validTo: null }
        - { type: 방법지정, source: { type: 연금계좌, key: A-005 }, target: { type: 기본운용방법, key: D-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 상품보유, source: { type: 연금계좌, key: A-005 }, target: { type: 운용상품, key: P-03 }, validFrom: 2026-01-01, validTo: 2026-06-01 }
        - { type: 상품보유, source: { type: 연금계좌, key: A-005 }, target: { type: 운용상품, key: P-09 }, validFrom: 2026-01-01, validTo: null }
        - { type: 상품보유, source: { type: 연금계좌, key: A-005 }, target: { type: 운용상품, key: P-26 }, validFrom: 2026-01-01, validTo: null }
        - { type: 제도가입, source: { type: 연금계좌, key: A-005 }, target: { type: 연금제도, key: L-07 }, validFrom: 2026-01-01, validTo: null }

  - id: Q-04
    kind: relations-as-of
    title: 계좌 A-005 가 상품을 판 날의 관계 (종료일 당일, 새 시작일 당일)
    asOf: 2026-06-01
    entity: { type: 연금계좌, key: A-005 }
    # 판 상품의 보유는 이날 끝나 들지 않고, 새로 산 상품의 보유가 이날 시작해 든다.
    expect:
      relations:
        - { type: 계좌소유, source: { type: 연금계좌, key: A-005 }, target: { type: 연금가입자, key: N-005 }, validFrom: 2026-01-01, validTo: null }
        - { type: 방법지정, source: { type: 연금계좌, key: A-005 }, target: { type: 기본운용방법, key: D-01 }, validFrom: 2026-01-01, validTo: null }
        - { type: 상품보유, source: { type: 연금계좌, key: A-005 }, target: { type: 운용상품, key: P-06 }, validFrom: 2026-06-01, validTo: null }
        - { type: 상품보유, source: { type: 연금계좌, key: A-005 }, target: { type: 운용상품, key: P-09 }, validFrom: 2026-01-01, validTo: null }
        - { type: 상품보유, source: { type: 연금계좌, key: A-005 }, target: { type: 운용상품, key: P-26 }, validFrom: 2026-01-01, validTo: null }
        - { type: 제도가입, source: { type: 연금계좌, key: A-005 }, target: { type: 연금제도, key: L-07 }, validFrom: 2026-01-01, validTo: null }

  - id: Q-05
    kind: relations-as-of
    title: 현재, 저축은행 다(I-03)의 관계
    asOf: 2026-12-01
    entity: { type: 금융기관, key: I-03 }
    # 이 기관이 제공하는 상품 둘과 이 기관에 걸린 요건 둘이다. 등급이 내려간 것은 속성 값이 바뀐 것이라 관계는 그대로다.
    expect:
      relations:
        - { type: 상품제공, source: { type: 운용상품, key: P-05 }, target: { type: 금융기관, key: I-03 }, validFrom: 2026-01-01, validTo: null }
        - { type: 상품제공, source: { type: 운용상품, key: P-06 }, target: { type: 금융기관, key: I-03 }, validFrom: 2026-01-01, validTo: null }
        - { type: 요건적용, source: { type: 운영요건, key: RQ-02 }, target: { type: 금융기관, key: I-03 }, validFrom: 2026-01-01, validTo: null }
        - { type: 요건적용, source: { type: 운영요건, key: RQ-16 }, target: { type: 금융기관, key: I-03 }, validFrom: 2026-01-01, validTo: null }

  # ── 변동 ───────────────────────────────────────────────────

  - id: Q-06
    kind: changes
    title: 요건의 둘째 판에서 나온 변동
    step: 19
    # RQ-01 은 한도가, RQ-05 는 이름이 바뀌었다. 나머지 열아홉 행은 그대로다. 순서는 항목의 키.
    expect:
      changes:
        - { itemKey: [RQ-01], kind: changed }
        - { itemKey: [RQ-05], kind: changed }

  - id: Q-07
    kind: changes
    title: 보유의 둘째 판에서 나온 변동 (추가와 삭제)
    step: 20
    # 항목의 키는 계좌와 상품 두 열이다. 판 것은 삭제, 새로 산 것은 추가다.
    expect:
      changes:
        - { itemKey: [A-005, P-03], kind: removed }
        - { itemKey: [A-005, P-06], kind: added }
        - { itemKey: [A-020, P-12], kind: removed }
        - { itemKey: [A-033, P-26], kind: removed }
        - { itemKey: [A-040, P-13], kind: added }

  - id: Q-08
    kind: changes
    title: 금융기관의 둘째 판에서 나온 변동
    step: 21
    # I-03, I-04, I-05, I-06 은 등급과 점수가, I-10 은 이름이 바뀌었다.
    expect:
      changes:
        - { itemKey: [I-03], kind: changed }
        - { itemKey: [I-04], kind: changed }
        - { itemKey: [I-05], kind: changed }
        - { itemKey: [I-06], kind: changed }
        - { itemKey: [I-10], kind: changed }

  - id: Q-09
    kind: changes
    title: 가입자의 둘째 판에서 나온 변동
    step: 22
    # 퇴직일이 들어온 다섯 명과 출생연도를 고친 한 명이다. 모두 변경이다 (행이 없어진 것이 아니다).
    expect:
      changes:
        - { itemKey: [N-003], kind: changed }
        - { itemKey: [N-015], kind: changed }
        - { itemKey: [N-040], kind: changed }
        - { itemKey: [N-052], kind: changed }
        - { itemKey: [N-066], kind: changed }
        - { itemKey: [N-077], kind: changed }

  - id: Q-10
    kind: changes
    title: 제도의 둘째 판에서 나온 변동
    step: 23
    # 확정급여 제도 여섯 가운데 적립비율이 달라진 다섯이다. L-05 는 값이 같아 변동이 아니다.
    expect:
      changes:
        - { itemKey: [L-01], kind: changed }
        - { itemKey: [L-02], kind: changed }
        - { itemKey: [L-03], kind: changed }
        - { itemKey: [L-04], kind: changed }
        - { itemKey: [L-06], kind: changed }

  # ── 영향 범위 ──────────────────────────────────────────────

  - id: Q-11
    kind: impact
    title: 위험자산 한도가 내려간 것의 영향 범위
    change: { step: 19, itemKey: [RQ-01] }
    # 변동 대상은 요건 RQ-01 과 그 행이 가리키는 규약 RG-01 이다. RQ-01 이 걸린 목표시점 펀드 넷이 깊이 1, 그 펀드를 보유한 계좌와 펀드로 구성된 기본운용방법이 깊이 2, 그 방법을 지정한 계좌와 가입자가 그 뒤다. 깊이 4 와 5 에는 가입자가 재직하는 사업장과 그 담당자가 있다. 규약 RG-01 에서는 같은 규약의 다른 요건 RQ-15 와 그것이 걸린 제도, 그 사업장과 담당자 쪽으로 퍼진다 (네 대상의 근거 경로는 RG-01 에서 시작한다). 최대 깊이 5 안에서 모두 닿는다.
    expect:
      targets:
        - entity: { type: 운영요건, key: RQ-15 }
          depth: 1
          path: { from: { type: 운영규약, key: RG-01 }, asOf: 2026-04-01, relations: [ { type: 규약부과, source: { type: 운영규약, key: RG-01 }, target: { type: 운영요건, key: RQ-15 } } ] }
        - entity: { type: 운용상품, key: P-13 }
          depth: 1
          path: { from: { type: 운영요건, key: RQ-01 }, asOf: 2026-04-01, relations: [ { type: 요건적용, source: { type: 운영요건, key: RQ-01 }, target: { type: 운용상품, key: P-13 } } ] }
        - entity: { type: 운용상품, key: P-14 }
          depth: 1
          path: { from: { type: 운영요건, key: RQ-01 }, asOf: 2026-04-01, relations: [ { type: 요건적용, source: { type: 운영요건, key: RQ-01 }, target: { type: 운용상품, key: P-14 } } ] }
        - entity: { type: 운용상품, key: P-15 }
          depth: 1
          path: { from: { type: 운영요건, key: RQ-01 }, asOf: 2026-04-01, relations: [ { type: 요건적용, source: { type: 운영요건, key: RQ-01 }, target: { type: 운용상품, key: P-15 } } ] }
        - entity: { type: 운용상품, key: P-16 }
          depth: 1
          path: { from: { type: 운영요건, key: RQ-01 }, asOf: 2026-04-01, relations: [ { type: 요건적용, source: { type: 운영요건, key: RQ-01 }, target: { type: 운용상품, key: P-16 } } ] }
