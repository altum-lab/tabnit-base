      description: 담당자와 관리자가 부를 수 있다
      parameters:
        - name: packId
          in: query
          required: true
          description: Pack 의 식별자
          schema:
            type: string
            minLength: 1
        - name: status
          in: query
          required: false
          description: 이 상태의 조치만. 없으면 가리지 않는다
          schema:
            $ref: '#/components/schemas/ActionStatus'
        - name: changeEventId
          in: query
          required: false
          description: 이 변동 이벤트에서 나온 조치만. 서버가 준 id 를 그대로 보낸다. 없으면 가리지 않는다
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            거른 조치를 나눠 돌려준다: offset 만큼 건너뛰고 limit 개까지 준다. total 은 거른 조치의 전체 수다.
            순서는 기한이 이른 것부터이고, 같으면 우선순위(수가 작은 것부터),
            규칙 번호, 대상 개체의 id, 조치의 id 차례다. 글자는 모두 글자 코드 순이다.
            해당하는 것이 없으면 빈 목록이다. 그 Pack 의 것이 아닌 변동 이벤트로 거르면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/action:
    get:
      operationId: getAction
      summary: 조치 하나를 그 이력과 함께 돌려준다
      description: 담당자와 관리자가 부를 수 있다
      parameters:
        - name: actionId
          in: query
          required: true
          description: 조치의 id. 서버가 준 값을 그대로 보낸다
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 조치와 그 이력. 이력의 순서는 상태를 바꾼 차례다. 아직 아무도 바꾸지 않았으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/action-decisions:
    post:
      operationId: decideAction
      summary: 조치를 확정하거나 보류한다
      description: >-
        대기인 조치는 확정하거나 보류할 수 있고, 보류인 조치는 확정할 수 있다. 확정은 되돌릴 수 없다.
        누가 했는지와 언제 했는지는 요청에서 받지 않는다. 서버가 로그인한 사람과 서버의 시각으로 채워 이력에 남긴다.
        지금의 상태로 바꾼 바로 그 사람이 같은 동작을 다시 보내면 (응답을 받지 못해 다시 누른 경우) 아무것도 바꾸지 않고
        성공으로 답한다. 새 이력은 남지 않고 처음의 사유가 남는다.
        담당자가 부른다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionDecisionRequest'
      responses:
        '200':
          description: >-
            바뀐 조치와 그 이력. 이력의 마지막 줄이 방금 한 것이다.
            같은 사람이 같은 동작을 다시 보낸 것이면 처음 한 것이 마지막 줄이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: >-
            지금의 상태에서는 그렇게 바꿀 수 없다 (다른 사람이 이미 확정한 조치, 다른 사람이 보류한 조치를 다시 보류,
            확정된 조치를 보류). 아무것도 바뀌지 않았다. 공통 오류 형식에 조치의 지금 상태와 마지막 이력을 더해 담는다.
            자기가 바꾼 뒤 응답을 받지 못해 같은 동작을 다시 보낸 것은 이 응답이 아니라 200 이다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ActionDecisionConflictProblem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/relation-exports:
    get:
      operationId: exportRelations
      summary: 개체의 관계 가운데 조회 시점에 유효한 것을 파일로 내보낸다
      description: 인자와 순서는 getRelationsAsOf 와 같고 offset, limit 이 없다. 담당자와 관리자가 부를 수 있다
      parameters:
        - name: entityId
          in: query
          required: true
          description: 개체의 id
          schema:
            type: string
            minLength: 1
        - name: asOf
          in: query
          required: false
          description: 조회 시점. 없으면 설치 설정의 시간대에서의 오늘이고, 그 날짜가 파일과 파일 이름에 적힌다
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: true
          description: 파일의 형식. csv 또는 json
          schema:
            type: string
            enum: [csv, json]
      responses:
        '200':
          description: >-
            관계의 파일이다 (Content-Disposition 이 attachment 이고 파일 이름을 준다). 나누지 않는다: 그 조건의 전체를 담는다.
            순서는 목록의 API 와 같다. json 은 목록의 답과 같은 모양이고 offset 은 0, limit 은 한 번에 내보내는 행의 한도다.
            csv 는 UTF-8 (맨 앞에 BOM), 쉼표, CRLF 이고 첫 행이 머리 행이다. 같은 목록에서는 글자까지 같은 파일이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationsAsOf'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          description: 행이 한 번에 내보내는 한도를 넘는다 (EXPORT_TOO_LARGE). 일부만 담은 파일을 주지 않는다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/action-exports:
    get:
